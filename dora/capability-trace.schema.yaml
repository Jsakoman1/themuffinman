kind: dora_capability_trace_schema
version: 1
purpose: Trace one declared capability from product and domain intent through bounded work, implementation references, validation evidence, and runtime evidence without inferring delivery completion.
required_fields: [kind, version, capability, work, implementation_references, validation_evidence, runtime_evidence, unresolved]
capability_required_fields: [id, product_references, domain_references]
work_required_fields: [plan, task]
evidence_required_fields: [id, path, status]
validation_evidence_required_fields: [id, path, status, command]
evidence_statuses: [recorded, pending, failed]
invariants:
  - Every reference is project-relative and must point to a declared product-owned file when its evidence status is recorded.
  - A recorded validation or runtime evidence entry is traceability evidence, not a release or feature-completion claim.
  - Pending or failed evidence must have an explicit unresolved record.
  - Dora does not invent missing implementation, validation, runtime evidence, or a completion conclusion.
