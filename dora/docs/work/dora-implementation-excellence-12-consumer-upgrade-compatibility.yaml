planning_item:
  priority: P2
  current_evidence:
  - ProjectUpgrade.preview! compares two reviewed local sources and is explicitly
    read-only.
  - PluginContract and template controls already name static compatibility surfaces.
  problem: A raw changed-path list does not tell the owner which contract category
    changed or which retest is conservatively relevant.
  intended_outcome: A read-only report classifies a supplied local upgrade preview
    into schema, command, template, plugin, and implementation contract dimensions.
    It reports additive, breaking, and unknown cases plus declared retests, but never
    makes an upgrade decision.
  source_of_truth_mapping:
    project_upgrade_preview: Sole source of the current/target pin and filesystem
      migration facts.
    consumer_upgrade_compatibility_report: Regenerable advisory classification only;
      it has no upgrade lifecycle.
    plugin_contract: Sole static plugin-contract validation source.
  invariants:
  - Local reviewed preview input only; no network download or source retrieval.
  - No upgrade apply, rollback, consumer write, pin update, or approval creation.
  - An unknown or removed contract is never called compatible.
  - Result carries source references, observed_at, and a read-only/advisory label.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-project-memory-closeout-gate-master.yaml
  baseline_only_surfaces:
  - Existing preview/apply/rollback authority and source-review rules.
  residual_scope: Read-only compatibility explanation before an owner-approved upgrade.
  retest_triggers:
  - Upgrade
  - source descriptor
  - schema
  - template
  - plugin
  - or starter compatibility changes.
  non_duplication_rule: The report is planning guidance and never an upgrade approval
    record.
