scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-greenfield-discovery-delivery-master.yaml
  - docs/work/dora-materialize-independent-repository.yaml
  baseline_only_surfaces:
  - Existing ProjectReadModel, DecisionLog, ProjectMemory, discovery provenance, work
    verifier, AgentSession, CodexContextPacket, and ChangeImpact contracts.
  - Existing Bridge V1/V2/V3 authority boundaries and owner-local runner behavior.
  - Existing consumer projects and the uncommitted TheMuffinMan-local IDC pilot workspace.
  residual_scope:
  - A versioned local IDC v0 contract that distinguishes source provenance from claim
    assessment and preserves evidenced missing context rather than rejecting it as
    malformed input.
  - A local validator and deterministic renderer for owner/Codex-authored dossier
    payloads.
  - A fixed-selector, sanitized, read-only Dora envelope exporter.
  - An owner-started local workflow and a read-only Bridge envelope profile with no
    execution authority.
  retest_triggers:
  - Any change to IDC status/provenance semantics, source allow-list, selector allow-list,
    envelope redaction, CLI output/write behavior, or Bridge authority boundary.
  - Any change to ProjectReadModel, DecisionLog, work verification, Bridge, or runner
    behavior used by an IDC envelope.
  non_duplication_rule: IDC owns only advisory request, manifest, dossier, and promotion-proposal
    material. Dora remains the sole decision, lifecycle, evidence, ProjectMemory,
    and verified-status authority.
non_goals:
- Hosted service, database, vector index, embeddings, personal memory, autonomous
  agent, automatic research, automatic source/context selection, automatic conflict
  detection, web access from IDC, or a generic MCP server.
- IDC-to-Dora write, automatic promotion, Codex invocation, terminal inspection, or
  consumer-project mutation.
- Replanning existing verified bounded Dora delivery from an IDC dossier.
