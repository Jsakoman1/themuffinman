tasks:
- id: implement-deterministic-idc-triage-contract
  title: Classify a bounded owner request without inferring execution authority
  type: security-feature
  status: done
  inventory_item: idc-orchestration-triage
  observable_outcome: A deterministic evaluator classifies a structured request as
    NO_IDC_NEEDED, IDC_OWNER_CONFIRMATION_REQUIRED, or IDC_OWNER_AUTHORIZED_LOCAL_RENDER,
    returns only a fixed advisory profile and next action, and fails closed for malformed,
    conflicting, unsupported, or authorization-free input.
  dependencies:
  - idc-orchestration-preflight
  paths:
  - idc/idc-triage-contract.schema.yaml
  - lib/dora/idc_triage.rb
  - test/idc_triage_test.rb
  - docs/domain-library.yaml
  required_paths:
  - idc/idc-triage-contract.schema.yaml
  - lib/dora/idc_triage.rb
  - test/idc_triage_test.rb
  - docs/domain-library.yaml
  validation: ruby test/idc_triage_test.rb && ruby idc/test/idc_v0_contract_test.rb
  evidence_boundary:
  - The evaluator receives only one explicitly supplied structured request; it performs
    no LLM call, source selection, filesystem/repository search, network request,
    write, shell/process, Git, Codex, Bridge, or Dora mutation.
  - An IDC candidate without explicit current owner authorization remains a confirmation
    request, not a local-render permission.
  - Triage output is advisory and never a DecisionLog, Master Plan, task, evidence,
    or verified-status assertion.
