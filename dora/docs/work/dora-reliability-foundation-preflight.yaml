current_state_readback:
  authority:
    accepted_owner_boundary: V3 is an owner-started foreground local runner. Automatic
      remote Codex start, stop, steering, attachment, inspection, service installation,
      and real-time ChatGPT control remain out of scope.
    evidence:
    - docs/product-brief.yaml
    - docs/domain-library.yaml
    - bridge/test/structured_handoff_e2e_test.rb
  reliability_findings:
  - area: checkpoint_resume_and_duplicate_execution_protection
    current_behavior: Claimed work is intentionally not checkpoint-resumed. Exclusive
      claim, fail-closed runner failure, and owner-created follow-up preserve a no-retry,
      no-reclaim boundary.
    evidence:
    - docs/domain-library.yaml
    - lib/dora/handoff.rb
    - lib/dora/handoff_runner.rb
    - test/handoff_test.rb
    - bridge/test/structured_handoff_e2e_test.rb
    gap: Existing duplicate-claim and runner-failure coverage does not explicitly
      start a fresh runner after a handoff is already CLAIMED and prove that it neither
      relaunches nor resumes that handoff.
  - area: end_to_end_traceability
    current_behavior: Immutable handoff intent, append-only lifecycle events, delivery
      links, verifier evidence references, and safe completion readback form the trace.
    evidence:
    - lib/dora/handoff.rb
    - lib/dora/handoff_cli.rb
    - bridge/test/structured_handoff_e2e_test.rb
    gap: The trace is covered by synthetic lifecycle completion; the missing dedicated
      restart regression should assert that an interrupted claimed handoff retains
      that same trace rather than producing a second execution trace.
  - area: authority_boundaries
    current_behavior: Bridge clients receive sanitized declared reads and bounded
      handoff ingress only; host-local runner operation is unavailable through MCP
      or remote requests.
    evidence:
    - docs/product-brief.yaml
    - docs/domain-library.yaml
    - bridge/test/structured_handoff_e2e_test.rb
    gap: No authority expansion is needed or proposed.
  - area: existing_context_capsule
    current_behavior: Dora provides bounded cited task context and keeps assistant-facing
      context derived from authoritative project knowledge rather than a mutable transcript.
    evidence:
    - docs/domain-library.yaml
    - lib/dora/agent_context.rb
    - lib/dora/codex_context_packet.rb
    - test/agent_context_test.rb
    - test/codex_context_packet_test.rb
    gap: The future restart regression must consume existing handoff/lifecycle state
      only; it must not introduce a runner checkpoint or a second context store.
  - area: required_regression_coverage
    current_behavior: Synthetic tests cover malformed or unclear handoff inputs, conflicting
      or locked decisions, verification failure, scope expansion alignment holds,
      structured blockers, and duplicate claims.
    evidence:
    - test/handoff_cli_test.rb
    - test/handoff_test.rb
    - test/intent_plan_alignment_test.rb
    - bridge/test/mcp_server_test.rb
    - bridge/test/structured_handoff_e2e_test.rb
    - bridge/test/handoff_runner_test.rb
    gap: Restart/duplicate behavior is only indirectly covered; no focused post-claim
      runner-restart assertion exists.
future_implementation_slice:
  id: dora-v3-claimed-handoff-restart-no-replay-regression
  title: Prove a claimed V3 handoff is not replayed after a runner restart
  selection_reason: This is the smallest safe slice because it closes the only identified
    reliability evidence gap without changing lifecycle, runner, bridge, or authority
    behavior.
  bounded_scope:
  - Add one synthetic test scenario to bridge/test/handoff_runner_test.rb.
  - Create and claim one fixture handoff, simulate a runner process ending before
    completion, then construct a fresh runner against the same private fixture state.
  - Assert the fresh runner does not launch, resume, re-claim, or duplicate-execute
    the CLAIMED handoff and leaves it for the existing owner-recovery path.
  acceptance_criteria:
  - The claimed handoff remains CLAIMED after the fresh runner observes it.
  - The fixed launcher invocation count remains unchanged after the simulated restart.
  - No second lifecycle claim, delivery link, completion, or child terminal data is
    produced.
  - Existing READY work, if present, remains governed by normal deterministic selection
    and does not cause the claimed item to be replayed.
  verification: ruby bridge/test/handoff_runner_test.rb && ruby test/handoff_test.rb
    && ruby bridge/test/structured_handoff_e2e_test.rb
  non_goals:
  - No runner checkpoint, automatic retry, resume protocol, new persistence, or lifecycle
    state.
  - No remote/live Codex process control, service installation, bridge capability,
    or product change.
  pause_or_owner_decision_conditions:
  - Pause if a passing assertion requires changing the accepted fail-closed no-replay
    behavior.
  - Request an owner decision if recovery should ever become an automatic resume or
    retry policy.
  owner_readback: A fresh local runner will not replay a claimed handoff; the owner
    must use the existing recovery/follow-up workflow.
  runner_restart_required: false
  runner_restart_rationale: The slice is a synthetic test-only scenario and must not
    restart the owner-local runner or modify its installed operation.
