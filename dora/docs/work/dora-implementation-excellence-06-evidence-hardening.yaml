kind: work
version: 1
id: dora-implementation-excellence-evidence-hardening
title: Make Dora verification evidence safer and more reproducible
status: verified
baseline: 4b07fbd00c5d59d2788346cddbe4c44606f8fdff
strict_verification: true
serial_task_execution: true
execution_inventory: docs/work/dora-implementation-excellence-evidence-hardening-execution-inventory.yaml
planning_item:
  priority: P1
  current_evidence:
  - WorkExecution runs a project-declared shell validation and retains the last twenty
    output lines up to four thousand characters.
  - Evidence records HEAD revision, changed file names, exit code, and task start
    fingerprints, but not a post-run content digest or bounded environment contract.
  problem: Test output can be noisy or contain sensitive values, commands can hang,
    and HEAD alone is not a precise identity for uncommitted verification changes.
  intended_outcome: Evidence collection gets conservative output redaction, bounded
    timeout/process handling, declared environment metadata, and required-path digests
    while preserving project-defined leaf commands.
  candidate_surfaces:
  - lib/dora/work_execution.rb
  - lib/dora/report_writer.rb
  - work-artifact schema
  - test/work_execution_nested_project_test.rb
  - test/work_verifier_test.rb
  invariants:
  - No secret collection
  - no arbitrary environment export
  - no command rewriting
  - and no replacement of project runtime evidence with static output.
  open_questions:
  - What redaction patterns are safe without hiding failures?
  - What timeout defaults/maxima suit local projects?
  - Which digest is stable for deleted or generated paths?
  future_atomic_slices:
  - Define evidence-safe output and environment schema.
  - Add timeout and redaction behavior with adversarial fixtures.
  - Record path digests and provenance without changing completion authority.
  readiness: selected_for_goal_pursuit
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-bridge-v3-runner-recovery-master.yaml
  baseline_only_surfaces:
  - Existing work verification command execution and retained historical evidence.
  residual_scope:
  - Evidence capture hardening only.
  retest_triggers:
  - Verifier subprocess execution
  - evidence serialization
  - output retention
  - or runtime artifact changes.
  non_duplication_rule: New safety metadata does not retroactively upgrade historic
    evidence.
