  baseline_only_surfaces:
  - Existing work verification and retained verified evidence.
  residual_scope:
  - Artifact classification
  - contradiction detection
  - and minimal historical metadata repair.
  retest_triggers:
  - Any work-artifact schema
  - doctor
  - plan parser
  - or retention-policy change.
  non_duplication_rule: Existing plan evidence remains historical; the new audit proves
    only integrity of the current artifact set.
