planning_item:
  priority: P0
  current_evidence:
  - docs/work/dora-bridge-v3-local-runner-atomic-hardening-review.yaml has a YAML
    suffix but is not parseable YAML.
  - Two verified work plans reference inventories still marked state active; one historical
    inventory uses delivery_verified.
  - A verified monitoring preflight retains text saying independent verification is
    pending.
  problem: Historical control artifacts are not consistently classified or reconciled,
    so broad tooling can either fail on a review note or read contradictory state.
  intended_outcome: A read-only consistency audit distinguishes work, master, inventory,
    and narrative review artifacts; it reports invalid suffix/content pairs and state
    contradictions with source references, observed time, and advisory labeling. A
    separate bounded cleanup may later correct accepted historical records without
    deleting evidence.
  candidate_surfaces:
  - lib/dora/work_artifact_schema.rb
  - lib/dora/project_doctor.rb
  - lib/dora/project_read_model.rb
  - test/work_artifact_schema_test.rb
  - docs/work
  invariants:
  - Historical evidence is append-only
  - a narrative review is not treated as executable YAML
  - reconciliation never invents verification
  - and ProjectDoctor cannot write
  - migrate
  - promote
  - or repair artifacts.
  open_questions:
  - Should non-executable review records move to .md or remain YAML with a declared
    schema?
  - Which historical inventory state aliases remain supported?
  future_atomic_slices:
  - Classify artifacts without modifying them.
  - Detect one declared contradiction deterministically with cited advisory evidence.
  - Reconcile the named historical artifacts with explicit compatibility policy.
  - Add regression fixtures for invalid YAML and verified/inventory-state mismatch.
  first_slice_acceptance:
  - One declared contradictory artifact combination yields one deterministic ProjectDoctor
    advisory finding.
  - The finding contains source references, observed_at, and a read-only/advisory
    label.
  - The diagnostic causes no write, migration, status change, or automated repair.
  - A focused negative test proves that the diagnostic cannot promote work to verified.
  readiness: selected_for_goal_pursuit
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
