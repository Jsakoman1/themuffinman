kind: work
version: 1
id: dora-implementation-excellence-bounded-failure-diagnosis
title: Explain known validation failures without attempting repair
status: verified
baseline: 4b07fbd00c5d59d2788346cddbe4c44606f8fdff
strict_verification: true
serial_task_execution: true
execution_inventory: docs/work/dora-implementation-excellence-bounded-failure-diagnosis-execution-inventory.yaml
planning_item:
  priority: P3
  current_evidence:
  - WorkExecution already records bounded, redacted leaf evidence and explicit timeout
    fields.
  - HandoffRunner has an independent fixed runner failure-code/recovery-hint taxonomy.
  problem: Leaf validation failures lack a safe local advisory classification, while
    raw output must not become a diagnostic API.
  intended_outcome: A standalone diagnosis read model accepts only a bounded evidence
    envelope and returns known `leaf_timeout` or `command_unavailable` classes; every
    other failure is explicitly unknown. It returns fixed safe next steps and never
    output text.
  source_of_truth_mapping:
    work_execution_evidence: Sole evidence fact source, including failure result and
      timeout/exit-code fields.
    bounded_failure_diagnosis: Regenerable advisory classification only; it does not
      alter evidence or work lifecycle.
    handoff_runner: Separate runner-specific taxonomy; no shared lifecycle or failure
      state.
  invariants:
  - No execution retry, output pattern matching, raw-output return, secret retention,
    automatic patch, or root-cause claim.
  - Unknown failures remain unknown.
  - Result carries source references, observed_at, and read-only/advisory labels.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-bridge-v3-runner-recovery-master.yaml
  baseline_only_surfaces:
  - Existing runner failure recovery hints and work verifier evidence.
  residual_scope: Read-only explanation of selected known failures.
  retest_triggers:
  - Verifier output
  - command catalog
  - doctor checks
  - finding schema
  - or evidence redaction changes.
  non_duplication_rule: Diagnosis is not repair state and does not override command
    exit status.
