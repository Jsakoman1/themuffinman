historical_goal_pursuit_preflight:
  completed:
  - Existing implementation and control primitives were mapped to prevent parallel
    state systems.
  - Each initiative has serial atomic slices with candidate bounded paths, leaf tests,
    dependencies, and authority limits.
  - Cross-initiative order is explicit; diagnostics and projections remain downstream
    of canonical work evidence.
  closure_boundary:
  - The pre-goal inventory and selection checks are retained only as historical
    provenance and do not authorize new work from this master.
  - Any future initiative must establish its own owner-approved plan, bounded paths,
    and verifier-valid evidence without reactivating this historical record.
source_of_truth_contract:
  work_artifact_schema: Declares the accepted work-artifact shapes and relationships;
    it does not establish verification.
  work_execution_and_agent_session: Record bounded work facts and render them; neither
    owns a second lifecycle.
  project_doctor: Diagnoses existing facts only; it cannot repair, promote, or normalize
    them.
  decision_log: Is the sole durable owner-decision record; closeouts, packets, and
    indexes only project it.
  change_impact: Is the sole impact model; companion impact is a configured derivative,
    not another dependency map.
  capability_trace: Records capability-use evidence; plugin contracts are static compatibility
    declarations, not a second capability registry.
  derived_views: Current-work index, option packets, scenario projections, diagnostics,
    and owner closeouts are regenerable read-only views with no manual state.
derived_output_guardrail:
  required_metadata:
  - source_references
  - observed_at
  - read_only_or_advisory_label
  mandatory_negative_proofs:
  - A derived view cannot set work or inventory status, including verified.
  - A derived view cannot create, amend, or close an owner decision.
  - A derived view cannot invoke GitHub, alter a consumer project, run a repair, or
    wake/start a remote agent.
  placement_rule: Each selected atomic implementation plan must name the producing
    read model and include its relevant negative-authority test before verifier closeout.
owner_follow_up:
  historical_artifact_cleanup:
    state: resolved_by_control_state_hygiene
    source: docs/work/dora-control-state-hygiene.yaml
    boundary: The named narrative records remain at their evidence-referenced paths but
      are explicitly non-executable; only three objectively terminal inventory state
      fields were reconciled, without rewriting evidence or inferring verification.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-project-memory-closeout-gate-master.yaml
  - docs/work/dora-bridge-v3-4-master-plan-progress-master.yaml
  - docs/work/dora-reliability-foundation-master.yaml
  - docs/work/dora-chatgpt-handoff-monitoring-preflight-master.yaml
  baseline_only_surfaces:
  - Existing work verification, immutable handoff lifecycle, owner-local runner, bridge
    authorization, and current generated-feature contracts.
  - Existing Dora releases through v1.8.0 and their consumer pins.
  completed_scope:
  - Improved Dora's implementation context, routing, closeout, evidence quality,
    owner-readable projections, and consumer extension contracts without creating a
    parallel status system.
  historical_retest_triggers:
  - Changes to a declared Dora CLI command, work-plan schema, verifier, Bridge read
    model, plugin contract, evidence format, or consumer upgrade path required the
    recorded verifier evidence for this program.
  future_work_boundary: Prior verified Dora evidence is historical baseline only; any
    future slice must produce its own changed paths and verifier-recorded evidence.
sequencing:
- order: 1
  initiative: truth-hygiene
  reason: Repair canonical control-data contradictions before relying on them for
    automation.
- order: 2
  initiative: implementation-session
  reason: Establish a bounded Codex context surface before adding more diagnostics.
- order: 3
  initiative: granular-routing
  reason: Supply correct leaf validation to implementation and closeout surfaces.
- order: 4
  initiative: diff-aware-closeout
  reason: Compare actual changes with declared obligations.
- order: 5
  initiative: task-scoped-contract
  reason: Make cross-layer obligations explicit rather than inferred.
- order: 6
  initiative: evidence-hardening
  reason: Protect and reproduce the evidence that later projections consume.
- order: 7
  initiative: companion-impact
  reason: Add configured cross-surface diagnostics after contracts and routing exist.
- order: 8
  initiative: owner-delivery-closeout
  reason: Build a generic owner summary only from strengthened canonical evidence.
- order: 9
  initiative: decision-freshness
  reason: Keep decision review advisory and tied to actual changed surfaces.
- order: 10
  initiative: chatgpt-option-packet
  reason: Keep optional external reasoning owner-mediated and fact-bounded.
- order: 11
  initiative: capability-scenario-catalog
  reason: Make capability expectations declarative before applying profiles.
- order: 12
  initiative: consumer-upgrade-compatibility
  reason: Reuse the upgraded artifact classification before extending consumer reporting.
- order: 13
  initiative: plugin-capability-contract
  reason: Stabilize extension compatibility after the consumer report model exists.
- order: 14
  initiative: current-work-index
  reason: Project a compact current view only after work, decision, and owner semantics
    are stable.
- order: 15
  initiative: bounded-failure-diagnosis
  reason: Diagnose only sanitized routed leaf evidence without repair authority.
- order: 16
  initiative: quality-profiles
  reason: Compose existing task, scenario, and routing obligations last so profiles do
    not invent policy.
