planning_item:
  priority: P2
  current_evidence:
  - Dora stores cited decision records and reports accepted/open decisions through
    project status and agent session.
  - No current diagnostic links a declared changed surface to decisions that an owner
    may need to re-review.
  problem: Old decisions can silently become contextually stale after a related contract
    or implementation surface changes.
  intended_outcome: A read-only freshness review maps declared decision citations
    or tags to changed path families and emits review candidates, never automatic
    reopen, modification, or invalidation.
  candidate_surfaces:
  - lib/dora/decision_log.rb
  - lib/dora/change_check.rb
  - lib/dora/agent_closeout.rb
  - decision-log.schema.yaml
  - test/decision_log_test.rb
  invariants:
  - Only owners change decision status; an unmatched decision is not called stale;
    no guessed semantic dependency.
  open_questions:
  - Should decisions declare paths, capability IDs, or system-map nodes?
  - How should superseded decisions be rendered?
  future_atomic_slices:
  - Add optional declared impact references to decision records.
  - Produce deterministic review candidates from actual changed paths.
  - Integrate candidates into read-only closeout and owner summary.
  readiness: selected_for_goal_pursuit
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/chatgpt-intent-plan-alignment-master.yaml
  baseline_only_surfaces:
  - Existing accepted/superseded decision semantics.
  residual_scope:
  - Advisory decision freshness candidates only.
  retest_triggers:
  - Decision schema
  - impact configuration
  - closeout
  - or status projection changes.
  non_duplication_rule: Freshness output is not a new decision log or an approval
    workflow.
