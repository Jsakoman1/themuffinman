execution_inventory: docs/work/dora-implementation-excellence-capability-scenario-catalog-execution-inventory.yaml
planning_item:
  priority: P2
  current_evidence:
  - CapabilityProofPacket already owns declared evidence-class obligations.
  - CapabilityTrace links recorded evidence and remains explicitly non-completion
    proof.
  - CapabilityAcceptance projects declared acceptance obligations without executing
    them.
  problem: Projects repeat common scenario categories inconsistently, and a new catalog
    must not duplicate proof status or capability evidence.
  intended_outcome: A read-only scenario catalog validates reusable happy-path, permission,
    recovery, and regression obligations, cites source references, and delegates all
    evidence state to existing proof and trace primitives.
  source_of_truth_mapping:
    scenario_catalog: Regenerable advisory declaration of scenario obligations; never
      a capability, work, or evidence lifecycle.
    capability_proof_packet: Sole existing declaration of evidence-class obligation
      state.
    capability_trace: Sole existing link to actual recorded or unresolved evidence.
  invariants:
  - A scenario is an obligation, never a completion or acceptance claim.
  - No task status, decision, GitHub, consumer project, runner, or remote agent can
    change.
  - The catalog carries source references, observed_at, and a read-only/advisory label.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-reliability-foundation-master.yaml
  baseline_only_surfaces:
  - Existing proof packet, capability trace, runtime profile, and acceptance schemas.
  residual_scope: A declarative scenario index with no automated product testing.
  retest_triggers:
  - Capability proof
  - trace
  - acceptance
  - runtime evidence
  - or work-plan contract changes.
  non_duplication_rule: The catalog references proof obligations and never stores
    duplicate verification status.
