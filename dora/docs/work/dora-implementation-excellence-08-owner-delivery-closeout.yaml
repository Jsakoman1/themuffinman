planning_item:
  priority: P2
  current_evidence:
  - Handoff completion can carry a compact result, and ProjectReadModel identifies
    current/latest delivery state.
  - Non-handoff verified work does not have one generic owner-readable closeout projection
    derived from plan evidence and decisions.
  problem: Owners must read raw plan YAML or multiple projections to understand what
    a normal verified delivery did, proved, deferred, and did not claim.
  intended_outcome: A read-only delivery-closeout view derives title, bounded work
    performed, verified tasks, validation references, declared decisions, deviations,
    residual risks, and follow-up need from canonical evidence.
  candidate_surfaces:
  - lib/dora/project_read_model.rb
  - lib/dora/project_status.rb
  - lib/dora/explain.rb
  - bin/dora
  - test/project_read_model_test.rb
  invariants:
  - No invented summary
  - no raw terminal output
  - no completion claim without verifier evidence
  - and no mutation of historical work artifacts.
  open_questions:
  - How are plan-authored summaries validated?
  - What is the safe behavior for partial, superseded, or malformed masters?
  future_atomic_slices:
  - Define closeout input precedence and safe output schema.
  - Project verified single-task, master, partial, and superseded fixtures.
  - Expose a read-only CLI/bridge-compatible envelope only after redaction review.
  readiness: selected_for_goal_pursuit
