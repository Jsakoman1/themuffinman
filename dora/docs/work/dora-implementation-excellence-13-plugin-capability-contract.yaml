execution_inventory: docs/work/dora-implementation-excellence-plugin-capability-contract-execution-inventory.yaml
planning_item:
  priority: P3
  current_evidence:
  - PluginContract versions 1 and 2 validate local plugin identity, source inputs,
    report output, and v2 execution policy.
  - PluginRunner cache input already binds plugin configuration, entrypoint identity,
    implementation identity, and source snapshot.
  problem: A plugin's compatibility-facing capability/API version, declared cache
    identity, output schema version, and deprecation posture are not explicit to a
    consumer before invocation.
  intended_outcome: Manifest v3 adds only static compatibility metadata. It remains
    local configuration, preserves v1/v2 readability, and does not create a second
    capability, cache, or evidence registry.
  source_of_truth_mapping:
    plugin_contract: Sole validator of static plugin metadata and version compatibility.
    analysis_cache: Sole runtime cache-key implementation.
    capability_trace: Sole capability-use evidence record.
  invariants:
  - Plugins remain local project-owned diagnostics and cannot set capability completion.
  - Contract validation invokes no plugin, cache, consumer source, GitHub, or remote
    agent.
  - v1/v2 backward compatibility remains explicit; v3 fails closed when its new fields
    are incomplete.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-reliability-foundation-master.yaml
  baseline_only_surfaces:
  - Existing plugin containment, report writer, and cache behavior.
  residual_scope: Declarative compatibility metadata and validation only.
  retest_triggers:
  - Plugin manifest
  - runner
  - cache
  - report schema
  - or pack changes.
  non_duplication_rule: Plugin compatibility never duplicates consumer feature evidence.
