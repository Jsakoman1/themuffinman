  retest_triggers:
    - Any IDC status, source, provenance, missing-context, promotion, or authority-boundary rule change.
  non_duplication_rule: The contract declares advisory data only; it cannot define canonical Dora decisions, plans, evidence, or state.
tasks:
  - id: formalize-idc-v0-contract
    title: Define machine-checkable advisory IDC input and output boundaries
    type: contract-and-atomic-hardening
    status: pending
    inventory_item: idc-01-contract
    observable_outcome: IDC v0 schemas distinguish structurally invalid input from evidence-bounded missing_context and open_question, separate source provenance from claim assessment, and prohibit authority-bearing fields before any renderer or Dora exporter exists.
    dependencies: []
    evidence_boundary:
      - Local schema fixtures and an atomic-hardening review only.
      - A structurally malformed source (for example absent identity, forbidden kind, locator, revision/digest, or observed_at) is rejected; a missing expected document is accepted only when the explicit manifest entry or cited source establishes the absence.
      - If neither basis establishes an absence, the contract requires open_question rather than missing_context; it does not search a filesystem or repository to infer either result.
      - No dossier generation, Dora source read, Bridge behavior, external request, consumer mutation, Git action, Codex start, or Dora write.
    paths:
