    - Versioned local IDC request, source-manifest, dossier, and promotion-proposal schemas plus their safety tests.
    - Source-manifest provenance fields (identity, allowed kind, locator, revision/digest, and observed_at) separated from claim assessment fields (status, source_refs, wording, and relevant confidence/freshness assessment).
    - Evidence-bounded missing-context semantics: only an owner-selected manifest's explicit expected-but-not-provided entry or a cited supplied source's explicit absence statement may support missing_context.
