current_state_readback:
  existing_structured_readbacks:
  - name: get_handoff_status
    current_behavior: Returns the handoff ID and title, lifecycle status, collaboration
      state, delivery/completion or blocker information, lifecycle events, and derived
      V3.2 progress.
    evidence:
    - bridge/lib/dora_bridge/server.rb
    - lib/dora/handoff.rb
    - docs/dora-bridge-v2-structured-handoff.md
  - name: get_handoff_lifecycle_readback
    current_behavior: 'Returns the narrower safe lifecycle projection: handoff ID,
      lifecycle status and outcome category, verification state/evidence references,
      derived phase/summary/token, and a fixed summary.'
    evidence:
    - bridge/lib/dora_bridge/server.rb
    - lib/dora/handoff.rb
    - bridge/test/mcp_server_test.rb
    - bridge/test/structured_handoff_e2e_test.rb
  owner_local_runner:
    current_behavior: Processes at most one eligible READY handoff at a time and polls
      the existing lifecycle/progress readback locally while the fixed child runs;
      it prints only deduplicated fixed transitions and is neither remotely controlled
      nor a ChatGPT push channel.
    evidence:
    - lib/dora/handoff_runner.rb
    - docs/dora-bridge-v2-structured-handoff.md
  exact_gap: No current readback is limited exactly to title/ID, lifecycle phase/status,
    safe summary, next action, and closeout reference. The narrow lifecycle readback
    intentionally omits title and next action, while the existing status readback
    includes richer collaboration and lifecycle content than a monitoring task needs.
platform_feasibility:
  finding: A same-thread one-minute ChatGPT follow-up loop is not supportable in this
    environment.
  supported_activation_path: A user may create or request a ChatGPT Scheduled Task
    from ChatGPT's Scheduled page and enable notifications. The task must have access
    to the Dora Bridge as an available approved app before it can invoke a readback;
    that availability is an account/workspace precondition, not an assumed capability
    of this Codex session.
  documented_limit: Official OpenAI documentation says ChatGPT Scheduled Tasks cannot
    run more than once per hour. They can monitor for meaningful changes and stop
    when a terminal condition is reached, but they are not webhooks or real-time push.
  same_thread_limitation: The official activation path creates and manages a Scheduled
    Task. It does not establish that an arbitrary active Codex conversation can receive
    one-minute, same-thread tool follow-ups, retain the handoff tool context, or be
    externally pushed a response.
  source:
    title: Scheduled Tasks in ChatGPT
    url: https://help.openai.com/en/articles/10291617-scheduled-tasks-in-chatgpt
    accessed_at: '2026-08-10'
recommendation:
  decision: Do not add a minute timer, polling workaround, webhook, tunnel, runner
    control, or platform configuration. Use the existing status readbacks for manual
    checks now. If a future user-facing monitor is still wanted, first add one additive
    read-only monitor projection, then let a user configure an hourly-or-slower ChatGPT
    Scheduled Task only when the authorized Dora Bridge app is available to that task.
future_implementation_slice:
  id: dora-bridge-handoff-monitor-readback
  title: Add one bounded read-only handoff monitor readback
  selection_reason: This is the smallest useful slice because it closes the exact
    shaping gap without changing the runner, lifecycle writes, handoff selection,
    platform scheduling, or ChatGPT authority.
  ownership_boundary:
    dora_bridge: Derives and validates the read-only response from the current authoritative
      handoff lifecycle and existing verifier evidence.
    chatgpt: At most reads one explicit handoff ID through an already authorized app;
      it does not select work, write lifecycle feedback, start/stop the runner, or
      schedule itself.
    owner: Chooses whether to create/manage an hourly-or-slower Scheduled Task and
      retains all runner, installation, and app-permission decisions.
  bounded_scope:
  - Add one MCP read-only tool that accepts exactly one allow-listed project and one
    explicit handoff ID.
  - Derive a fixed monitoring envelope from existing status/lifecycle state without
    storing monitor state or accepting a cadence argument.
  - Document the manual activation prerequisite and terminal stop condition; do not
    create or configure a ChatGPT Task.
  data_contract:
    handoff:
      fields:
      - id
      - title
    lifecycle:
      fields:
      - status
      - phase
    summary: Fixed owner-safe summary derived from the existing lifecycle projection.
    next_action: 'Fixed allowlisted value: CONTINUE_MONITORING, STOP_MONITORING, or
      STOP_MONITORING_AND_REVIEW.'
    closeout_reference: Existing project-relative verification reference for COMPLETED
      only; null otherwise.
  terminal_behavior:
  - Return CONTINUE_MONITORING only for a claimed handoff without verification failure.
  - Return STOP_MONITORING for COMPLETED and include the evidence-owned closeout reference.
  - Return STOP_MONITORING_AND_REVIEW for BLOCKED or VERIFICATION_FAILED; a monitor
    must stop immediately and never retry, resume, or create a follow-up.
  acceptance_criteria:
  - The tool accepts only one explicit authorized project/handoff pair and has no
    list, selection, cadence, write, runner, shell, filesystem, or process-control
    argument.
  - Its successful response contains only the declared six monitoring elements and
    never exposes feedback prose, lifecycle events, raw evidence, paths other than
    the allowed closeout reference, terminal output, environment values, or secrets.
  - Derived values are deterministic from existing lifecycle/evidence state; no new
    store, timer, status cache, or runner state exists.
  - Claimed, completed, blocked, verification-failed, malformed, unknown, and unauthorized
    scenarios are fail-closed and terminal scenarios direct the client to stop monitoring.
  - Existing V1/V2/V2.2/V3 handoff, lifecycle, runner, and bridge regressions remain
    passing.
  focused_test_strategy:
    target: bridge/test/mcp_server_test.rb
    approach: Add focused synthetic MCP assertions for the new tool's exact schema,
      deterministic action mapping, completion closeout reference, terminal stop behavior,
      malformed/unknown/cross-project unavailable envelope, and absence of forbidden
      data. Run the existing handoff and bridge regressions as the leaf suite.
    validation: ruby bridge/test/mcp_server_test.rb && ruby test/handoff_test.rb &&
      ruby bridge/test/structured_handoff_e2e_test.rb && ruby bridge/test/handoff_runner_test.rb
  restart_required: true
  restart_rationale: If the local Dora Bridge MCP process is already running, the
    owner must restart or relaunch that process after the additive tool is installed
    so it loads the new tool registry. The owner-local handoff runner does not need
    a restart, and this slice installs no scheduler or service.
  non_goals:
  - No minute-scale or automatic ChatGPT follow-up loop.
  - No real-time push, webhook, cloud relay, tunnel, polling-limit workaround, or
    raw terminal-log streaming.
  - No remote Codex or runner start, stop, steering, attachment, inspection, or retry.
  - No handoff lifecycle mutation, status-store duplication, automatic push/release,
    or ChatGPT Task creation.
