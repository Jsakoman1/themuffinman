kind: master
version: 1
id: dora-greenfield-discovery-delivery
title: Add bounded greenfield discovery, owner framing, and delivery handoff to Dora
status: verified
baseline: 4b07fbd00c5d59d2788346cddbe4c44606f8fdff
strict_verification: true
planning_only: false
execution_inventory: docs/work/dora-greenfield-discovery-delivery-execution-inventory.yaml
atomic_task_hardening_plan: docs/work/dora-greenfield-discovery-delivery-00-atomic-task-hardening.yaml
program_state:
  phase: verified_core_scope
  goal_pursuit_authorized: false
  implementation_authorized: false
  purpose: 'Plan a narrow pre-delivery capability for greenfield applications: Dora
    may elicit direction, prepare cited advisory exploration, receive owner framing,
    and hand accepted facts into the existing delivery primitives. It must not become
    an autonomous product manager, research authority, second state system, or remote-control
    channel.'
  activation_rule: The verified core scope is closed. Evidence-gated optimization
    candidates remain intentionally deferred until their shared owner trigger is satisfied.
critical_disposition:
  accepted:
  - 'A provenance-first discovery layer is necessary: current idea interview and create-app
    flows safely capture confirmed first-capability intent, but they do not shape
    a DoomsDay-scale target product before first implementation.'
  - An adaptive direction interview, explicit assumptions, owner gates, compact journeys,
    and a delivery handoff are useful additions if they remain bounded and do not
    replace existing product, domain, decision, work, or evidence artifacts.
  - Owner-mediated, consent-gated research may be useful after initial direction and
    before a proposed skeleton, provided it enters Dora only as cited advisory material.
  changed:
  - Foundation Profile becomes a derived foundation-choices projection from product/domain/DecisionLog
    references, not a durable profile or policy store.
  - Delivery Matrix becomes a regenerable delivery-coverage projection from an accepted
    skeleton, CapabilityPackage, CapabilityAcceptance, task contracts, and scenario
    obligations; it is never a backlog or delivery lifecycle.
  - Deferred-but-designed Register is rejected as a new register. A durable deferred
    commitment belongs in the existing DecisionLog or persistent backlog only when
    the owner explicitly chooses it; otherwise it remains an advisory assumption or
    open question.
  - Glossary work extends the existing DomainLibrary vocabulary only after an owner-confirmed
    domain term exists; no separate glossary file is introduced.
  - Project Context Graph is narrowed to a later, regenerable read-only index over
    existing artifacts. No graph database, graph-owned schema, manual graph edits,
    or canonical dependency model is in scope.
  - A parallel discovery coordinator is deferred. The first design uses a simple deterministic
    synthesis workflow; coordination is considered only if evidence shows repeated
    independent lanes cannot be synthesized safely by that workflow.
  rejected_now:
  - Autonomous product decisions, automatic requirements invention, or automatic DecisionLog
    writes from interview, research, skeleton, journey, or synthesis output.
  - Automatic ChatGPT invocation, web browsing, external connector installation, remote
    Codex start, remote agent wake-up, GitHub action, consumer-project mutation, or
    research response ingestion without an owner-mediated step.
  - A broad app generator that writes speculative domain code, migrations, routes,
    or product UI before the owner accepts a bounded first delivery.
scope_control:
  baseline_only_surfaces:
  - Existing IdeaInterview and IdeaInterviewSession preserve only user-confirmed answers.
  - Existing CreateApp and SessionCreateApp create project knowledge and one first
    declared capability; they deliberately do not create product implementation.
  - Existing DecisionLog is the sole durable owner-decision record.
  - Existing DomainLibrary, ProductBrief, CapabilityPackage, CapabilityAcceptance,
    task contracts, WorkArtifactSchema, WorkExecution, CapabilityTrace, and WorkVerifier
    remain the product/delivery/evidence controls.
  - Existing AssistantContextView, ProjectReadModel, CurrentWorkIndex, ChangeImpact,
    option packet, and CapabilityScenarioCatalog are bounded derived surfaces.
  residual_scope:
  - Prepare advisory discovery outputs for greenfield product framing.
  - Require concise owner confirmation before facts cross into existing canonical
    primitives.
  - Derive a small delivery handoff from accepted facts without starting implementation.
  retest_triggers:
  - Any change to interview/session schemas, create-app, DecisionLog, DomainLibrary,
    product brief, capability package, work-plan validation, bridge authority, or
    external research/connectivity policy.
  non_duplication_rule: This program may project and cite existing facts, but it may
    not keep a second lifecycle, decision log, backlog, evidence store, dependency
    graph, or product knowledge database.
source_of_truth_contract:
  idea_interview_and_session:
    owns: User-confirmed initial answers and explicit open decisions only.
    does_not_own: Product design truth, research claims, acceptance, implementation,
      owner decision status, or verification.
  product_brief:
    owns: Owner-confirmed product intent, users, outcome, constraints, and non-goals.
    does_not_own: Research transcript, execution state, test evidence, or inferred
      decisions.
  domain_library:
    owns: Owner-confirmed domain vocabulary, invariants, permission concepts, and
      workflows.
    does_not_own: A parallel glossary, implementation state, or unconfirmed brainstorm.
  decision_log:
    owns: Durable owner-confirmed decisions and their existing references.
    does_not_own: Automatically accepted research, assumptions, task status, or evidence.
  work_artifact_schema_work_execution_and_verifier:
    owns: Declared task shape, execution facts, verification evidence, and verified
      state.
    does_not_own: Product framing, research interpretation, or owner decisions.
  capability_primitives:
    owns: Declared capability, acceptance/proof obligations, scenario evidence linkage,
      and readiness within their existing contracts.
    does_not_own: A new product roadmap or architecture authority.
  derived_discovery_outputs:
    owns: Nothing durable. They are reproducible advisory projections with sources,
      observed_at, digest/freshness where applicable, and read_only/advisory labels.
    does_not_own: Status, DecisionLog mutation, code, GitHub, consumer projects, runner
      state, external research authority, or remote-agent control.
  derived_context_index_later:
    owns: Nothing durable. It may index references between existing artifacts only.
    does_not_own: A graph database, manual edge state, lifecycle, impact authority,
      or replacement for ChangeImpact and ProjectReadModel.
phase_model:
  discovery:
    purpose: Turn a rough owner idea into explicitly sourced directions, assumptions,
      optional research questions, journeys, and a proposed skeleton. All output is
      advisory and may be discarded or regenerated.
    allowed: Local deterministic validation and read-only proposal rendering.
    prohibited: Canonical mutation, product code generation, external action, DecisionLog
      write, task activation, or remote-agent invocation.
  owner_framing:
    purpose: Let the owner select the product direction, resolve only high-leverage
      choices, consent to any external research, and explicitly promote chosen decisions
      by the existing DecisionLog workflow.
    allowed: Owner confirmation and the existing deliberate decision-recording path.
    prohibited: Inferring a confirmation from silence, research confidence, or a generated
      recommendation.
  delivery_handoff:
    purpose: 'Derive a compact, reviewable first-delivery package from accepted existing
      facts: first capability, journeys, cross-layer obligations, scenario classes,
      and one atomic next task candidate.'
    allowed: Read-only projection and normal future create-app/work-plan preparation.
    prohibited: Marking work active/verified, creating a consumer project, starting
      a runner, or writing product code without a separately selected delivery task.
owner_decision_gates:
- id: direction-sufficient
  before: Optional research or proposed skeleton generation.
  owner_must_confirm: Target first users, concrete problem/moment, intended first
    outcome, major non-goal, and whether the product is individual, shared, organizational,
    or public.
  cannot_be_inferred_from: A generic idea title, a similar product, or ChatGPT output.
- id: research-consent
  before: Any external ChatGPT/web research packet is used or an external response
    is imported.
  owner_must_confirm: Topic, permitted disclosure level, questions, allowed sources,
    and that the material is advisory only.
  cannot_be_inferred_from: A request for ideas, an existing connector, or prior consent.
- id: framing-acceptance
  before: A proposed skeleton is cited as input to a delivery handoff.
  owner_must_confirm: Chosen product direction, relevant foundation choices, unresolved
    blockers, and which proposed statements may enter ProductBrief/DomainLibrary/DecisionLog.
  cannot_be_inferred_from: Research confidence, a complete interview, or a generated
    matrix.
- id: first-delivery-selection
  before: Create-app mutation, a first work plan, code generation, or goal pursuit.
  owner_must_confirm: First user-visible capability, selected starter/stack, bounded
    scope, required quality profile, and the exact first atomic task.
  cannot_be_inferred_from: A delivery handoff or capability readiness projection.
- id: later-optimization-need
  before: Derived context index expansion, role-specific packs, coordinator, or connector
    work.
  owner_must_confirm: Concrete observed pain or failure evidence that simpler existing
    ProjectReadModel, AssistantContextView, synthesis, and owner-mediated packet flows
    cannot solve.
red_team_assessment:
- risk: Overengineering a discovery platform before proving a greenfield framing gap.
  mitigation: Start with provenance guard and one narrow adaptive interview; defer
    index, coordinator, connector, and any application-generator expansion.
- risk: Derived views become stale and are mistaken for current truth.
  mitigation: Require source references, observed_at, digest/freshness, advisory label,
    deterministic regeneration, and no mutable cache-as-authority.
- risk: Research sounds credible but gives false certainty or imports irrelevant patterns.
  mitigation: Separate fact/inference/speculation, cite sources/time, require owner
    consent, preserve assumption ledger, and never auto-promote a research claim.
- risk: An adaptive interview grows into a long questionnaire that delays value.
  mitigation: Direction interview has a short required core; further questions are
    conditional, and the owner can stop at a framing gate with explicit open decisions.
- risk: Skeleton, foundation, glossary, matrix, and deferred work duplicate existing
    state.
  mitigation: Each is a derived projection or extension of ProductBrief/DomainLibrary/
    DecisionLog/capability/work primitives; persistent fields require a named owner.
- risk: Parallel discovery produces conflicting, unreviewable recommendations.
  mitigation: Use one deterministic synthesis pass first; defer coordinator until
    observed evidence justifies its added state and scheduling complexity.
- risk: "“Helpful” discovery accidentally starts code, GitHub, a consumer project,
    or an agent."
  mitigation: Every candidate has a negative-authority leaf test and explicit fail-closed
    boundary.
candidate_sequence:
  serial_execution_rule: Candidates are planning inventory only. When activated, Dora
    executes one selected atomic candidate at a time; independent analysis may be
    proposed in one advisory synthesis but no concurrent mutation is permitted.
  candidates:
  - id: discovery-provenance-mutation-guard
    phase: discovery
    priority: P0
    observable_outcome: A reusable advisory discovery-output envelope validates source
      references, observed time, advisory/read-only disposition, and an explicit authority
      boundary.
    prerequisites:
    - Confirm existing derived-output metadata conventions in CapabilityScenarioCatalog,
      CurrentWorkIndex, and owner option packet.
    candidate_required_paths:
    - lib/dora/discovery_provenance.rb
    - test/discovery_provenance_test.rb
    - docs/domain-library.yaml
    leaf_validation: ruby test/discovery_provenance_test.rb
    evidence_boundary: Synthetic local documents and in-memory output only; no consumer,
      bridge store, external request, project write, shell, GitHub, or runner activity.
    negative_authority_proof: Test proves an envelope cannot set work/inventory status,
      create/amend/close a DecisionLog entry, write code, invoke GitHub, mutate a
      consumer project, or start/wake a remote or local agent.
    owner_gate_after: none
  - id: adaptive-direction-interview-contract
    phase: discovery
    priority: P0
    observable_outcome: A short direction interview selects only conditional follow-up
      questions from owner-confirmed answers and records unresolved concerns without
      inferring values.
    prerequisites:
    - discovery-provenance-mutation-guard
    candidate_required_paths:
    - lib/dora/idea_interview_session.rb
    - idea-interview-session.schema.yaml
    - test/adaptive_direction_interview_test.rb
    leaf_validation: ruby test/adaptive_direction_interview_test.rb
    evidence_boundary: Synthetic session fixtures only; no external research, decision
      write, create-app mutation, consumer project, GitHub, code generation, or runner
      activity.
    negative_authority_proof: Test proves the interview preserves only user_confirmed
      answers/open decisions and cannot promote an answer, mutate DecisionLog, create
      work, change status, or start an agent.
    owner_gate_after: direction-sufficient
  - id: assumption-ledger-projection
    phase: discovery
    priority: P0
    observable_outcome: A regenerable advisory projection classifies statements as
      confirmed, assumption, external research, open question, or deferred-without-commitment
      and cites their source.
    prerequisites:
    - discovery-provenance-mutation-guard
    - adaptive-direction-interview-contract
    candidate_required_paths:
    - lib/dora/discovery_assumption_ledger.rb
    - test/discovery_assumption_ledger_test.rb
    leaf_validation: ruby test/discovery_assumption_ledger_test.rb
    evidence_boundary: Synthetic confirmed interview and advisory research fixtures
      only; no durable ledger file, DecisionLog write, task, code, consumer, GitHub,
      or agent action.
    negative_authority_proof: Test proves that no assumption is treated as accepted,
      verified, or a durable decision and that rendering leaves all source fixtures
      byte-for-byte unchanged.
    owner_gate_after: none
  - id: owner-framing-gate-read-model
    phase: owner_framing
    priority: P0
    observable_outcome: A deterministic read-only framing result reports whether the
      owner-confirmed direction is sufficient for a proposed skeleton, or names only
      the blocking questions.
    prerequisites:
    - adaptive-direction-interview-contract
    - assumption-ledger-projection
    candidate_required_paths:
    - lib/dora/owner_framing_gate.rb
    - test/owner_framing_gate_test.rb
    leaf_validation: ruby test/owner_framing_gate_test.rb
    evidence_boundary: Synthetic discovery input only; no DecisionLog recording, research,
      create-app, work-plan state, consumer mutation, GitHub, or agent invocation.
    negative_authority_proof: Test proves a sufficient result is not an owner confirmation
      and cannot unlock create-app, goal pursuit, task activation, DecisionLog writes,
      or status changes.
    owner_gate_after: framing-acceptance
  - id: owner-mediated-research-framing-packet
    phase: discovery
    priority: P1
    conditional_on: Owner selects research-consent and the framing gate reports a
      material research question.
    observable_outcome: Dora renders a copyable, redacted research packet and validates
      an owner-pasted advisory response envelope with source links, observed time,
      fact/inference/speculation labels, and no canonical promotion.
    prerequisites:
    - discovery-provenance-mutation-guard
    - owner-framing-gate-read-model
    candidate_required_paths:
    - lib/dora/discovery_research_packet.rb
    - test/discovery_research_packet_test.rb
    - docs/codex-idea-interview.md
    leaf_validation: ruby test/discovery_research_packet_test.rb
    evidence_boundary: Synthetic owner-consented request and pasted-response fixtures
      only; no network call, connector, external credential, transcript store, DecisionLog
      write, GitHub, consumer mutation, or remote agent.
    negative_authority_proof: Test proves no method performs web/ChatGPT invocation
      or accepts authority from a response, and cannot mutate decision/status/code/GitHub/consumer/runner
      state.
    owner_gate_after: framing-acceptance
  - id: skeleton-lite-projection
    phase: discovery
    priority: P1
    observable_outcome: A compact proposed skeleton projects only cited confirmed
      facts and explicit open questions into users, major product areas, foundation-choice
      coverage, first delivery, and intentional exclusions; it does not create a new
      canonical product model.
    prerequisites:
    - owner-framing-gate-read-model
    - owner-confirmed framing-acceptance
    candidate_required_paths:
    - lib/dora/discovery_skeleton.rb
    - test/discovery_skeleton_test.rb
    - docs/agent-first-application-guide.md
    leaf_validation: ruby test/discovery_skeleton_test.rb
    evidence_boundary: Synthetic ProductBrief/DomainLibrary/DecisionLog and advisory
      discovery fixtures only; no create-app, consumer repository, generated source,
      migration, GitHub, or runner.
    negative_authority_proof: Test proves the skeleton is advisory/regenerable, cannot
      invent a confirmed concept, cannot write ProductBrief/DomainLibrary/DecisionLog,
      and cannot create work or code.
    owner_gate_after: first-delivery-selection
  - id: journey-and-foundation-coverage-projection
    phase: discovery
    priority: P1
    observable_outcome: A compact journey projection identifies primary user moments,
      happy/empty/permission/recovery expectations and reports foundation-choice coverage
      as derived references, never a profile store.
    prerequisites:
    - skeleton-lite-projection
    candidate_required_paths:
    - lib/dora/discovery_journey.rb
    - test/discovery_journey_test.rb
    leaf_validation: ruby test/discovery_journey_test.rb
    evidence_boundary: Synthetic accepted skeleton and cited source artifacts only;
      no UI generation, test execution, DecisionLog mutation, consumer change, GitHub,
      or agent action.
    negative_authority_proof: Test proves journey/foundation coverage has no lifecycle/evidence
      status, cannot create an authority profile, and cannot write docs, code, decisions,
      tasks, or remote commands.
    owner_gate_after: first-delivery-selection
  - id: simple-discovery-synthesis
    phase: discovery
    priority: P1
    observable_outcome: A deterministic synthesis renders agreement, contradiction,
      source references, unresolved choices, and owner questions from interview, assumptions,
      optional research, skeleton, and journeys without scheduling parallel agents.
    prerequisites:
    - assumption-ledger-projection
    - skeleton-lite-projection
    - journey-and-foundation-coverage-projection
    candidate_required_paths:
    - lib/dora/discovery_synthesis.rb
    - test/discovery_synthesis_test.rb
    leaf_validation: ruby test/discovery_synthesis_test.rb
    evidence_boundary: In-memory advisory inputs only; no queue, worker, coordinator,
      persistence, DecisionLog write, source edit, consumer mutation, GitHub, or agent
      launch.
    negative_authority_proof: Test proves synthesis flags conflicts rather than resolving
      them and cannot set a decision/status or invoke external/repository/agent operations.
    owner_gate_after: framing-acceptance
  - id: delivery-and-scenario-handoff-projection
    phase: delivery_handoff
    priority: P1
    observable_outcome: A read-only handoff derives one owner-selected first capability,
      existing task-contract obligations, scenario classes, referenced paths, and
      one next atomic candidate; coverage remains a projection rather than a matrix/backlog/lifecycle.
    prerequisites:
    - skeleton-lite-projection
    - journey-and-foundation-coverage-projection
    - owner-confirmed first-delivery-selection
    candidate_required_paths:
    - lib/dora/discovery_delivery_handoff.rb
    - test/discovery_delivery_handoff_test.rb
    - docs/agent-first-application-guide.md
    leaf_validation: ruby test/discovery_delivery_handoff_test.rb
    evidence_boundary: Synthetic accepted canonical references and advisory source
      projections; no task activation/verification, create-app apply, code generation,
      consumer mutation, GitHub, release, runner, or remote agent.
    negative_authority_proof: Test proves a handoff cannot become a work artifact,
      mark a scenario verified, write DecisionLog, create a project, alter a consumer,
      invoke GitHub, or start any agent.
    owner_gate_after: none; a separate normal create-app or atomic work-plan selection
      is required.
  - id: derived-context-index-preflight
    phase: later_optimization
    priority: P2
    conditional_on: At least two documented greenfield sessions show that ProjectReadModel,
      AssistantContextView, ChangeImpact, and simple synthesis cannot provide an adequate
      cited context view.
    observable_outcome: A planning-only evidence record decides whether a read-only
      index over existing paths/references is justified; it must reject graph storage
      if the need is unproven.
    prerequisites:
    - delivery-and-scenario-handoff-projection
    - owner-confirmed later-optimization-need
    candidate_required_paths:
    - docs/work/dora-derived-context-index-preflight.yaml
    - test/project_read_model_test.rb
    leaf_validation: ruby test/project_read_model_test.rb
    evidence_boundary: Existing local read models and synthetic fixtures only; no
      new index, graph database, cache, consumer read, source mutation, GitHub, or
      agent action.
    negative_authority_proof: Test/planning evidence proves the preflight cannot add
      state, mutate an existing view, alter status/decisions/code/consumer/GitHub,
      or run an agent.
    owner_gate_after: owner explicitly selects a separate index implementation plan.
  - id: role-specific-context-pack-preflight
    phase: later_optimization
    priority: P2
    conditional_on: Derived context index preflight proves a concrete role/context
      selection gap.
    observable_outcome: A planning record chooses whether existing AgentSession and
      AssistantContextView can be parameterized before any new role-specific packet
      is introduced.
    prerequisites:
    - derived-context-index-preflight
    candidate_required_paths:
    - docs/work/dora-role-specific-context-pack-preflight.yaml
    - test/agent_context_test.rb
    leaf_validation: ruby test/agent_context_test.rb
    evidence_boundary: Existing local context fixtures only; no new context store,
      session write, consumer mutation, GitHub, runner, connector, or remote agent.
    negative_authority_proof: Evidence proves a preflight cannot alter AgentSession,
      work status, DecisionLog, code, consumer projects, GitHub, or any runner/agent.
    owner_gate_after: owner explicitly selects a separate packet implementation plan.
  - id: discovery-coordinator-preflight
    phase: later_optimization
    priority: P3
    conditional_on: Repeated owner reviews demonstrate that deterministic simple synthesis
      loses material conflicts across independently prepared discovery lanes.
    observable_outcome: A planning-only comparison evaluates a coordinator against
      a fixed synthesis workflow and rejects it unless the observed coordination benefit
      exceeds new-state risk.
    prerequisites:
    - simple-discovery-synthesis
    - owner-confirmed later-optimization-need
    candidate_required_paths:
    - docs/work/dora-discovery-coordinator-preflight.yaml
    - test/discovery_synthesis_test.rb
    leaf_validation: ruby test/discovery_synthesis_test.rb
    evidence_boundary: Recorded owner-reviewed synthetic examples only; no queue,
      worker, scheduler, subprocess, external call, consumer mutation, GitHub, or
      agent launch.
    negative_authority_proof: Preflight proves no coordinator state or execution is
      introduced and cannot mutate decision/status/code/consumer/GitHub or start a
      local/remote agent.
    owner_gate_after: owner explicitly selects a separate coordinator plan.
  - id: external-research-connector-preflight
    phase: later_optimization
    priority: P3
    conditional_on: Owner-mediated packets prove insufficient and the owner explicitly
      requests connector evaluation.
    observable_outcome: A planning-only consent, privacy, cost, audit, retention,
      and failure-mode review determines whether a bounded connector is safe enough
      to propose; no connector is built.
    prerequisites:
    - owner-mediated-research-framing-packet
    - owner-confirmed later-optimization-need
    candidate_required_paths:
    - docs/work/dora-external-research-connector-preflight.yaml
    - docs/product-brief.yaml
    - docs/domain-library.yaml
    leaf_validation: ruby bin/dora doctor .dora/project.yaml
    evidence_boundary: Dora policy/docs and owner-provided consent criteria only;
      no credential, network request, app installation, bridge change, consumer mutation,
      GitHub, or agent action.
    negative_authority_proof: The preflight proves it cannot contact ChatGPT/web,
      persist research, modify bridge authority, alter decision/status/code/consumer/GitHub,
      or start/wake an agent.
    owner_gate_after: explicit separate authority and security approval is mandatory.
minimum_first_implementation_recommendation:
  candidate: discovery-provenance-mutation-guard
  why_this_first: 'It gives every later discovery output the already-proven Dora pattern
    of provenance, observed time, advisory disposition, and negative authority. It
    is small, local, does not alter IdeaInterview semantics, and prevents the most
    dangerous failure: a helpful-looking discovery view silently becoming a second
    authority.'
  not_in_first_task:
  - Adaptive question selection.
  - Assumption or research content.
  - Product skeleton or journey rendering.
  - DecisionLog integration or write path.
  - Create-app, code generation, bridge, runner, connector, GitHub, release, or consumer
    change.
  acceptance_shape:
  - One synthetic discovery input yields deterministic source references, observed_at,
    read_only true, advisory disposition, and an explicit completion/authority boundary.
  - Missing provenance or an authority-like field fails closed.
  - Negative tests prove no mutation or external invocation surface exists.
pre_goal_hardening_requirements:
- Convert only the selected candidate into one work plan with one observable outcome,
  exact current required paths, dependencies, a leaf command, start fingerprints,
  and evidence boundary.
- Re-read current source and tests because all candidate paths in this draft are proposed
  bounds, not execution authorization.
- Add the candidate to a serial execution inventory only after owner selection; do
  not create an inventory or mark this master prepared/active now.
- Prove the negative authority boundary in the selected candidate's own leaf test.
- Use normal work-verify for any future verification; this planning document is not
  evidence.
