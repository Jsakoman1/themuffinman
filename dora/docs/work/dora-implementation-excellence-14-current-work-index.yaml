kind: work
version: 1
id: dora-implementation-excellence-current-work-index
title: Derive a compact current-work index without replacing canonical state
status: verified
baseline: 4b07fbd00c5d59d2788346cddbe4c44606f8fdff
strict_verification: true
serial_task_execution: true
execution_inventory: docs/work/dora-implementation-excellence-current-work-index-execution-inventory.yaml
planning_item:
  priority: P3
  current_evidence:
  - ProjectMemory validates navigation against inventories and fails on stale or ambiguous
    active work.
  - ProjectReadModel.summary already projects active delivery, latest verified delivery,
    next task, open decisions, and safe source references.
  problem: An agent needs a compact view of those canonical facts without navigating
    full historical plans or creating its own lifecycle.
  intended_outcome: A timestamped, read-only current-work index transforms an already
    built ProjectReadModel summary into current/last-verified/decision/next-action
    navigation and surfaces ambiguity rather than guessing.
  source_of_truth_mapping:
    project_memory_and_inventory: Canonical declaration and validated navigation of
      current work.
    project_read_model_summary: Sole aggregation source for the index.
    current_work_index: Regenerable advisory projection only; no manual persistence.
  invariants:
  - No second status store, history deletion, active-work inference, or completion
    inference from prose/timestamps.
  - Result carries source references, observed_at, and read-only/advisory labels.
  - It cannot change work, decision, GitHub, consumer, runner, or remote-agent state.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-project-memory-closeout-gate-master.yaml
  baseline_only_surfaces:
  - ProjectMemory, ProjectStatus, AgentNext, and bridge delivery projections.
  residual_scope: A derived local navigation view only.
  retest_triggers:
  - Project memory
  - inventory
  - project read model
  - agent next
  - or delivery evidence changes.
  non_duplication_rule: The index is a read-time projection and never persists current-work
    status.
