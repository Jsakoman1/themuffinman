planning_item:
  priority: P1
  current_evidence:
  - AgentContext exposes broad product/domain rules plus task required_paths and validation.
  - Existing vertical-slice and proof-packet routes describe potential migration,
    API, frontend, test, runtime, and documentation work before implementation.
  problem: A normal implementation task has no standard scoped map of owning read/write
    paths, permission owner, schema/API/UI contract, documentation, and runtime proof
    obligations.
  intended_outcome: An optional explicit implementation_contract on a task lets consumer
    projects declare these obligations; Dora validates and cites it but never fills
    missing business semantics by inference.
  candidate_surfaces:
  - work-plan.template.yaml
  - lib/dora/agent_context.rb
  - lib/dora/work_verifier.rb
  - lib/dora/atomic_plan_contract.rb
  - agent-context.schema.yaml
  - test/agent_context_test.rb
  invariants:
  - Consumer product rules remain product-owned; docs-only and small technical tasks
    do not need artificial API/UI fields.
  open_questions:
  - Which contract sections are required by task type?
  - Is the contract embedded or a cited project-relative file?
  future_atomic_slices:
  - Define a minimal optional schema with explicit omission semantics.
  - Render it in implementation session and closeout without duplicating task status.
  - Add backend, API, UI, data, and docs-only fixture examples.
  readiness: selected_for_goal_pursuit
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-reliability-foundation-master.yaml
  baseline_only_surfaces:
  - Existing product brief
  - domain library
  - vertical-slice
  - and proof-packet contracts.
  residual_scope:
  - A declarative task-level bridge between existing knowledge and implementation
    controls.
  retest_triggers:
  - Work-plan schema
  - task context
  - verification
  - or capability-proof changes.
  non_duplication_rule: The contract cites product authority; it does not create a
    second domain model.
