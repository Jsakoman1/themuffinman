program_state:
  phase: verified
  implementation_authorized: true
  owner_gate_status: confirmed
  activation_rule: Owner approved this master on 2026-08-12; all slices completed
    only after direct-predecessor verifier evidence.
  owner_must_confirm:
  - The local Dora checkout is the only implementation target.
  - Owner authorization for IDC rendering is explicit for the current request; it
    is never inferred from a broad conversation or retained as a standing permission.
  - The local renderer may write only the declared advisory output path and may not
    create Dora decisions, plans, evidence, ProjectMemory, or verified status.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-idc-operational-v0-master.yaml
  - docs/work/chatgpt-intent-plan-alignment-master.yaml
  baseline_only_surfaces:
  - IDC v0 request, manifest, dossier, deterministic renderer, and local owner workflow.
  - Dora ProjectReadModel, IDC envelope, DecisionLog, work lifecycle, evidence, and
    existing local command-envelope contracts.
  - Dora Bridge's existing read-only profiles and owner-started Codex/handoff boundaries.
  - Consumer repositories, the parent TheMuffinMan workspace, and its uncommitted
    IDC pilot.
  residual_scope:
  - A deterministic triage contract that distinguishes no-IDC, owner-confirmation-needed,
    and explicitly owner-authorized local IDC rendering.
  - One fixed local Dora wrapper that may invoke the already-existing IDC renderer
    only after validated authorization and only with explicit request, manifest, dossier,
    and output paths.
  - A read-only Bridge/Codex triage readback that can recommend a local next action
    but cannot invoke the wrapper, Codex, shell, Git, network, or Dora writes.
  retest_triggers:
  - Any IDC status, provenance, triage outcome, authorization, input/output path,
    subprocess boundary, Bridge tool, ProjectReadModel, envelope, or handoff change.
  non_duplication_rule: Triage and orchestration are derived local controls. IDC keeps
    advisory material only; Dora remains the sole canonical decision, planning, lifecycle,
    ProjectMemory, evidence, and verified-status authority.
non_goals:
- Automatic source selection, repository discovery, web research, personal-memory
  capture, background processing, daemon/service installation, remote execution, or
  agent loop.
- Bridge write authority, Bridge-launched IDC/Codex, direct Codex invocation, terminal
  streaming or inspection, Git actions, consumer-project changes, or IDC-to-Dora promotion.
- A standing authorization, whether inferred from a prior request or retained as a
  new permission store.
