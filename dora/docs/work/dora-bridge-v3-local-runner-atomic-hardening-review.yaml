master_plan: docs/work/dora-bridge-v3-local-runner-master.yaml
execution_inventory: docs/work/dora-bridge-v3-local-runner-execution-inventory.yaml
status: approved
findings:
- The serial inventory declares four atomic outcomes: discovery/hardening, local runner,
  fixed preclaimed launcher contract, and closeout proof/documentation. It never queues
  a broad child plan as executable work.
- The runner task is limited to repository-owned runner code and direct synthetic tests;
  it cannot change MCP capabilities, registry authority, historical handoffs, or host
  services.
- The launcher-contract task is limited to its contract, tests, and an owner-run install
  adapter. The adapter has one fixed destination and content-derived checksum; it does
  not install a service or accept caller-controlled source/destination paths.
- The closeout task is limited to end-to-end synthetic proof and canonical Dora-native
  documentation. It must demonstrate only scheduled readback awareness, never a
  fabricated push channel.
- Each implementation task has exact required paths, a serial dependency, a repository
  root-safe leaf validation command, and explicit security evidence including command
  injection, forged/cross-project input, duplicate runner, stale/restart, non-zero exit,
  and no remote-control exposure.
- V2.2 handoff lifecycle, delivery links, verification evidence, and readback remain the
  source of truth. Runner health is an ephemeral private operational aid and cannot
  become completion evidence or a ChatGPT collaboration transcript.
