id: dora-implementation-excellence-quality-profiles
title: Let consumer projects declare implementation-quality profiles
status: verified
baseline: 4b07fbd00c5d59d2788346cddbe4c44606f8fdff
strict_verification: true
serial_task_execution: true
execution_inventory: docs/work/dora-implementation-excellence-quality-profiles-execution-inventory.yaml
planning_item:
  priority: P3
  current_evidence:
  - Task implementation contracts already declare read/write/schema/API/UI/test/docs/runtime
    surfaces.
  - CapabilityScenarioCatalog declares reusable scenario classes without evidence
    status.
  - RuntimeProofProfile and project convention profiles are separate project-owned
    static inputs.
  problem: Consumers repeat cross-layer obligation selections and exceptions without
    one small composition model.
  intended_outcome: An opt-in read-only profile declares existing obligation classes
    and explicit exclusions. It does not execute a command, prove evidence, or apply
    product policy; later selected tasks may cite it through the existing implementation-contract
    schema.
  source_of_truth_mapping:
    implementation_contract: Sole task-level declaration of affected surfaces.
    capability_scenario_catalog: Sole scenario-obligation declaration.
    implementation_quality_profile: Static opt-in composition input only; no capability,
      evidence, or work lifecycle.
  invariants:
  - Profiles are opt-in, additive, project-owned, and explicit about exclusions.
  - No runtime acceptance, security approval, release readiness, test execution, or
    status inference.
  - Result carries source references, observed_at, and read-only/advisory labels.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-reliability-foundation-master.yaml
  baseline_only_surfaces:
  - Existing stack packs, proof packets, and consumer-owned validation commands.
  residual_scope: Opt-in profile declaration and validation only.
  retest_triggers:
  - Stack catalog
  - pack
  - task contract
  - proof packet
  - or consumer adapter changes.
  non_duplication_rule: A selected profile references obligations but does not create
    a second capability/evidence status.
