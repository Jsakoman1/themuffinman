planning_item:
  priority: P1
  current_evidence:
  - Dora already offers source maps, Spring mapper usage, HTTP contract linking, Vue
    navigation, configuration drift, and change-impact configuration.
  - These diagnostics are separate and do not provide one task-scoped companion surface
    report.
  problem: A change to a mapper, DTO, controller, repository, contract, or UI can
    have declared siblings that an agent forgets to inspect.
  intended_outcome: A consumer-configured companion-impact diagnostic reports related
    read/write/test/docs surfaces and requires explicit classification of every finding;
    it never infers hidden product relationships.
  candidate_surfaces:
  - lib/dora/change_impact.rb
  - lib/dora/plugins/spring_mapper_usage.rb
  - lib/dora/plugins/http_contract_linker.rb
  - templates/system-map-impact.yaml
  - test/change_impact_test.rb
  invariants:
  - Diagnostics are advisory
  - paths are declared by the consumer
  - and findings do not set task/capability/release status.
  open_questions:
  - Should this be a built-in command or a composable plugin report?
  - How do non-Spring/Vue consumers supply equivalent links?
  future_atomic_slices:
  - Define a portable companion relationship schema.
  - Build one source-map-backed report for declared Java/Vue examples.
  - Add closeout classification integration without auto-adding required paths.
  readiness: selected_for_goal_pursuit
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-reliability-foundation-master.yaml
  baseline_only_surfaces:
  - Existing diagnostics and product-owned source semantics.
  residual_scope:
  - One configured cross-surface diagnostic
  - not automatic architecture inference.
  retest_triggers:
  - Change-impact
  - plugin input
  - source-map
  - or implementation-contract changes.
  non_duplication_rule: Companion findings supplement, never replace, task required
    paths and owner review.
