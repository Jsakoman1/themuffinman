id: dora-implementation-excellence-diff-aware-closeout
title: Derive closeout obligations from actual task changes
status: verified
baseline: 4b07fbd00c5d59d2788346cddbe4c44606f8fdff
strict_verification: true
serial_task_execution: true
execution_inventory: docs/work/dora-implementation-excellence-diff-aware-closeout-execution-inventory.yaml
planning_item:
  priority: P1
  current_evidence:
  - lib/dora/agent_closeout.rb accepts caller-provided changed_paths and compares
    them with declared paths and impact configuration.
  - lib/dora/work_execution.rb already records task start fingerprints and computes
    project-relative Git changes for verification.
  problem: A manually supplied change list can omit a file, causing an incomplete
    diagnostic closeout even though Dora has stronger local change evidence.
  intended_outcome: A read-only closeout derives a bounded change set from the selected
    task's start snapshot and project Git state, then reports declared-path, documentation,
    validation, runtime, and unmatched-path obligations.
  candidate_surfaces:
  - lib/dora/agent_closeout.rb
  - lib/dora/work_execution.rb
  - lib/dora/change_check.rb
  - bin/dora
  - test/agent_closeout_test.rb
  - test/work_execution_nested_project_test.rb
  invariants:
  - Diagnostic output does not mutate task status
  - expose unrelated paths
  - or replace the work verifier.
  open_questions:
  - How are renamed/deleted files represented?
  - What should happen when the task was never started or Git is unavailable?
  future_atomic_slices:
  - Extract a shared safe change-set reader.
  - Add snapshot-aware closeout comparison and explicit unavailable states.
  - Cover untracked, nested-project, missing-start, renamed, and unmatched-path fixtures.
  readiness: selected_for_goal_pursuit
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-project-memory-closeout-gate-master.yaml
  baseline_only_surfaces:
  - Existing work verification and AgentCloseout output contract.
  residual_scope:
  - Read-only change-set derivation and obligation reporting.
  retest_triggers:
  - Git path normalization
  - task start fingerprints
  - closeout command
  - or impact configuration changes.
  non_duplication_rule: Closeout remains advisory; only work verification records
    evidence.
