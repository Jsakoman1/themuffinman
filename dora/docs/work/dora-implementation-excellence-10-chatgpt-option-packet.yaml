planning_item:
  priority: P2
  current_evidence:
  - Intent-plan alignment already evaluates a bounded non-canonical ChatGPT proposal
    against canonical Dora state.
  - Guided interviews and decision records retain user-confirmed answers and cited
    decisions.
  problem: Reasoning about alternatives, assumptions, and trade-offs has no small
    standard packet that remains explicitly non-canonical until an owner confirms
    one decision.
  intended_outcome: A bounded option packet can present alternatives, benefits, risks,
    assumptions, recommendation, and one explicit owner question; Dora may validate
    shape and display it but only owner confirmation can create or amend a cited decision.
  candidate_surfaces:
  - lib/dora/intent_plan_alignment.rb
  - lib/dora/decision_record.rb
  - bridge/lib/dora_bridge/server.rb
  - decision-log.schema.yaml
  - test/intent_plan_alignment_test.rb
  invariants:
  - No remote process control
  - no automatic decision creation
  - no persistent ChatGPT transcript
  - no source retrieval
  - and no product-rule inference.
  open_questions:
  - Is this an extension of intent-plan alignment or a separate transient contract?
  - Does ChatGPT receive any write endpoint beyond existing owner-requested ingress?
  future_atomic_slices:
  - Compare reuse of existing intent-plan fields with a new option schema.
  - Define owner confirmation and citation requirements.
  - Test malformed, conflicting, oversized, and non-confirmed proposals.
  readiness: selected_for_goal_pursuit
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/chatgpt-intent-plan-alignment-master.yaml
  baseline_only_surfaces:
  - Existing transient intent plan and owner-gated handoff boundaries.
  residual_scope:
  - Non-canonical structured reasoning input only.
  retest_triggers:
  - Bridge ingress
  - intent-plan alignment
  - decision record
  - or authorization changes.
  non_duplication_rule: The packet is a proposal and never a parallel plan, decision,
    or memory source.
