kind: dora_pre_goal_execution_inventory
version: 1
id: dora-implementation-excellence-pre-goal-inventory
status: prepared
purpose: >-
  A non-executable, serial blueprint for turning the implementation-excellence
  analysis into one verifier-bounded Dora task at a time. It is not work
  evidence, does not authorize code changes, and is superseded by the selected
  initiative's fresh atomic work plan before implementation begins.
authority_boundary:
  may_do: [inspect, refine, select, and prepare one atomic implementation plan]
  may_not_do: [mark work verified, alter release state, mutate a consumer, execute a plugin, or infer owner approval]
entry_gate:
  required: [owner selects one initiative, fresh baseline is captured, affected controls are read, required paths are re-confirmed]
  rejection_conditions: [working tree conflicts with selected paths, a proposed command lacks a safe bounded test, unresolved authority decision]
integration_rules:
  - Extend existing canonical read models and schema validation; do not add a parallel status store.
  - Reuse ProjectUpgrade, PluginContract, CapabilityTrace, DecisionLog, and AgentSession where their semantics already fit.
  - Keep diagnostics read-only; only the work verifier can establish verified work state.
  - Every derived result must carry source references, observed-at time, and a read-only/advisory label.
  - Every derived-view slice must contain a negative-authority test proving it cannot mutate status, owner decisions, GitHub, or a consumer project.
  - A schema/control change must include its focused Ruby test and doctor/read-model regression when those surfaces consume it.
serial_initiatives:
  - id: truth-hygiene
    plan: docs/work/dora-implementation-excellence-01-truth-hygiene.yaml
    depends_on: []
    integration: WorkArtifactSchema + ProjectDoctor classify canonical artifacts; ProjectReadModel consumes only valid, authoritative records.
    atomic_slices:
      - id: classify-artifact-kinds
        outcome: Artifact classification rejects YAML suffix/content mismatches and identifies executable versus narrative records.
        paths: [lib/dora/work_artifact_schema.rb, lib/dora/project_doctor.rb, test/work_artifact_schema_test.rb, test/project_doctor_test.rb]
        validation: ruby test/work_artifact_schema_test.rb && ruby test/project_doctor_test.rb
      - id: add-state-consistency-audit
        depends_on: [classify-artifact-kinds]
        outcome: Doctor reports one deterministic verified-plan/inventory or planning-closeout contradiction with source references, observed_at, advisory labeling, and no assigned corrected state.
        paths: [lib/dora/project_doctor.rb, lib/dora/project_read_model.rb, test/project_doctor_test.rb, test/project_read_model_test.rb]
        validation: ruby test/project_doctor_test.rb && ruby test/project_read_model_test.rb
      - id: reconcile-approved-history
        depends_on: [add-state-consistency-audit]
        outcome: A manifest-backed, owner-reviewed repair corrects only named historical metadata and preserves evidence.
        paths: [docs/work, docs/implementation-control.md, test/project_doctor_test.rb]
        validation: bin/dora doctor .dora/project.yaml && ruby test/project_doctor_test.rb
  - id: implementation-session
    plan: docs/work/dora-implementation-excellence-02-implementation-session.yaml
    depends_on: [truth-hygiene]
    integration: AgentSession composes canonical AgentContext, ProjectStatus, AgentNext, routing, and the selected atomic task.
    atomic_slices:
      - id: define-session-contract
        outcome: One versioned read-model contract names task, constraints, paths, dependencies, start, tests, docs, and closeout.
        paths: [lib/dora/agent_session.rb, lib/dora/agent_context.rb, test/agent_session_test.rb, test/agent_context_test.rb]
        validation: ruby test/agent_context_test.rb && ruby test/agent_session_test.rb
      - id: expose-session-command
        depends_on: [define-session-contract]
        outcome: A bounded CLI command renders the contract without exposing mutation or secret-bearing evidence.
        paths: [bin/dora, lib/dora/agent_session.rb, lib/dora/command_registry.rb, test/agent_session_command_test.rb]
        validation: ruby test/agent_session_command_test.rb && ruby test/command_registry_test.rb
  - id: granular-routing
    plan: docs/work/dora-implementation-excellence-03-granular-routing.yaml
    depends_on: [implementation-session]
    integration: Tool catalog stays declarative; session and closeout ask the existing command-selection layer for targeted validation.
    atomic_slices:
      - id: define-tool-catalog-schema
        outcome: Catalog entries declare owning paths, purpose, cost, environment, and focused command.
        paths: [.dora/controls/tool-catalog.yaml, lib/dora/tool_catalog.rb, lib/dora/tool_selection_commands.rb, test/tool_selection_commands_test.rb]
        validation: ruby test/tool_selection_commands_test.rb
      - id: resolve-change-routing
        depends_on: [define-tool-catalog-schema]
        outcome: Changed path prefixes map deterministically to deduplicated leaf checks and explicit fallback diagnostics.
        paths: [.dora/controls/change-routing.yaml, lib/dora/change_impact.rb, test/change_impact_test.rb, test/change_impact_compatibility_test.rb]
        validation: ruby test/change_impact_test.rb && ruby test/change_impact_compatibility_test.rb
      - id: project-routing-into-session
        depends_on: [resolve-change-routing]
        outcome: Session and closeout display selected checks with no automatic process execution.
        paths: [lib/dora/agent_session.rb, lib/dora/agent_closeout.rb, test/agent_session_test.rb, test/agent_closeout_test.rb]
        validation: ruby test/agent_session_test.rb && ruby test/agent_closeout_test.rb
  - id: diff-aware-closeout
    plan: docs/work/dora-implementation-excellence-04-diff-aware-closeout.yaml
    depends_on: [granular-routing]
    integration: WorkExecution's start fingerprint becomes an input to AgentCloseout, not a second source of truth.
    atomic_slices:
      - id: capture-bounded-change-set
        outcome: A task exposes a bounded, reproducible path set derived from its recorded start fingerprint.
        paths: [lib/dora/work_execution.rb, test/work_execution_test.rb, test/work_execution_nested_project_test.rb]
        validation: ruby test/work_execution_test.rb && ruby test/work_execution_nested_project_test.rb
      - id: compare-contract-to-diff
        depends_on: [capture-bounded-change-set]
        outcome: Closeout reports missing required paths, undeclared material paths, tests, docs, and runtime evidence as findings.
        paths: [lib/dora/agent_closeout.rb, lib/dora/change_impact.rb, test/agent_closeout_test.rb, test/change_impact_test.rb]
        validation: ruby test/agent_closeout_test.rb && ruby test/change_impact_test.rb
  - id: task-scoped-contract
    plan: docs/work/dora-implementation-excellence-05-task-scoped-contract.yaml
    depends_on: [diff-aware-closeout]
    integration: WorkArtifactSchema validates optional implementation obligations; AgentContext/Session render them for the selected task.
    atomic_slices:
      - id: add-contract-schema
        outcome: Task contracts express read/write paths, owners, schema/API/test/docs/runtime obligations without forcing irrelevant fields.
        paths: [lib/dora/work_artifact_schema.rb, test/work_artifact_schema_test.rb]
        validation: ruby test/work_artifact_schema_test.rb
      - id: enforce-contract-obligations
        depends_on: [add-contract-schema]
        outcome: The verifier enforces only declared contract fields and rejects a malformed required obligation before any closeout projection.
        paths: [lib/dora/work_verifier.rb, lib/dora/work_artifact_schema.rb, test/work_verifier_test.rb, test/work_artifact_schema_test.rb]
        validation: ruby test/work_verifier_test.rb && ruby test/work_artifact_schema_test.rb
      - id: render-contract-obligations
        depends_on: [enforce-contract-obligations]
        outcome: Context and closeout expose only declared obligations and distinguish required from advisory scope.
        paths: [lib/dora/agent_context.rb, lib/dora/agent_closeout.rb, test/agent_context_test.rb, test/agent_closeout_test.rb]
        validation: ruby test/agent_context_test.rb && ruby test/agent_closeout_test.rb
  - id: evidence-hardening
    plan: docs/work/dora-implementation-excellence-06-evidence-hardening.yaml
    depends_on: [task-scoped-contract]
    integration: WorkExecution remains the execution recorder; evidence presentation is bounded before consumers read it.
    atomic_slices:
      - id: define-evidence-envelope
        outcome: Evidence records declare execution environment, elapsed limit, redaction policy, and changed-path digest.
        paths: [lib/dora/work_execution.rb, lib/dora/work_artifact_schema.rb, test/work_execution_test.rb, test/work_artifact_schema_test.rb]
        validation: ruby test/work_execution_test.rb && ruby test/work_artifact_schema_test.rb
      - id: enforce-safe-command-capture
        depends_on: [define-evidence-envelope]
        outcome: Leaf validation capture times out, redacts configured secrets, and preserves a small reproducible diagnostic.
        paths: [lib/dora/work_execution.rb, test/work_execution_test.rb]
        validation: ruby test/work_execution_test.rb
  - id: companion-impact
    plan: docs/work/dora-implementation-excellence-07-companion-impact-audit.yaml
    depends_on: [evidence-hardening]
    integration: ChangeImpact consumes declared companion patterns and existing source-map plugins; it only warns.
    atomic_slices:
      - id: define-companion-rules
        outcome: A project control declares sibling read/write/test surfaces and allowable advisory severity.
        paths: [.dora/controls/companion-impact.yaml, lib/dora/change_impact.rb, test/change_impact_test.rb]
        validation: ruby test/change_impact_test.rb
      - id: connect-stack-aware-findings
        depends_on: [define-companion-rules]
        outcome: Java/Spring and Vue rules cite configured companions through existing plugins without claiming defects as facts.
        paths: [lib/dora/plugins/spring_mapper_usage.rb, lib/dora/plugins/http_contract_linker.rb, lib/dora/plugins/typescript_vue.rb, test/spring_mapper_usage_plugin_test.rb, test/http_contract_linker_plugin_test.rb, test/typescript_vue_source_map_plugin_test.rb]
        validation: ruby test/spring_mapper_usage_plugin_test.rb && ruby test/http_contract_linker_plugin_test.rb && ruby test/typescript_vue_source_map_plugin_test.rb
  - id: owner-delivery-closeout
    plan: docs/work/dora-implementation-excellence-08-owner-delivery-closeout.yaml
    depends_on: [companion-impact]
    integration: ProjectReadModel and AgentCloseout project verified evidence plus DecisionLog; verification authority does not move.
    atomic_slices:
      - id: define-owner-closeout-projection
        outcome: A stable read model separates completed evidence, unresolved decisions, warnings, and owner action.
        paths: [lib/dora/project_read_model.rb, lib/dora/agent_closeout.rb, test/project_read_model_test.rb, test/agent_closeout_test.rb]
        validation: ruby test/project_read_model_test.rb && ruby test/agent_closeout_test.rb
      - id: expose-owner-closeout-command
        depends_on: [define-owner-closeout-projection]
        outcome: A read-only command renders owner-readable closeout for non-handoff work with citations.
        paths: [lib/dora/project_commands.rb, lib/dora/command_registry.rb, test/project_commands_test.rb, test/command_registry_test.rb]
        validation: ruby test/project_commands_test.rb && ruby test/command_registry_test.rb
  - id: decision-freshness
    plan: docs/work/dora-implementation-excellence-09-decision-freshness.yaml
    depends_on: [owner-delivery-closeout]
    integration: DecisionLog remains decision authority; change impact creates non-mutating freshness findings.
    atomic_slices:
      - id: link-decisions-to-surfaces
        outcome: Decision records may declare affected path/domain references with validation for stable identifiers.
        paths: [lib/dora/decision_log.rb, lib/dora/work_artifact_schema.rb, test/decision_log_test.rb, test/work_artifact_schema_test.rb]
        validation: ruby test/decision_log_test.rb && ruby test/work_artifact_schema_test.rb
      - id: project-freshness-review
        depends_on: [link-decisions-to-surfaces]
        outcome: Changed paths yield an advisory stale-decision review with cited reason and no state mutation.
        paths: [lib/dora/change_impact.rb, lib/dora/project_read_model.rb, test/change_impact_test.rb, test/project_read_model_test.rb]
        validation: ruby test/change_impact_test.rb && ruby test/project_read_model_test.rb
  - id: chatgpt-option-packet
    plan: docs/work/dora-implementation-excellence-10-chatgpt-option-packet.yaml
    depends_on: [decision-freshness]
    entry_gate: owner explicitly approves a local, read-only packet format; no ChatGPT wake-up, API call, or autonomous decision write is in scope.
    integration: IntentPlanAlignment and DecisionLog supply the facts; external ChatGPT remains optional human-mediated reasoning.
    atomic_slices:
      - id: define-owner-mediated-packet
        outcome: A local fact projection separates cited observations, assumptions, and unanswered questions from any decision record or generated option.
        paths: [lib/dora/intent_plan_alignment.rb, lib/dora/decision_log.rb, test/intent_plan_alignment_test.rb, test/decision_log_test.rb]
        validation: ruby test/intent_plan_alignment_test.rb && ruby test/decision_log_test.rb
      - id: format-copyable-option-template
        depends_on: [define-owner-mediated-packet]
        outcome: A command emits a redacted owner-copyable option template, but does not generate an option or accept an inbound ChatGPT write.
        paths: [lib/dora/analysis_commands.rb, lib/dora/command_registry.rb, test/analysis_commands_test.rb, test/command_registry_test.rb]
        validation: ruby test/analysis_commands_test.rb && ruby test/command_registry_test.rb
      - id: prove-packet-has-no-decision-authority
        depends_on: [format-copyable-option-template]
        outcome: Negative tests prove a packet cannot write DecisionLog, change work status, invoke GitHub, or start a remote agent.
        paths: [lib/dora/analysis_commands.rb, lib/dora/decision_log.rb, test/analysis_commands_test.rb, test/decision_log_test.rb]
        validation: ruby test/analysis_commands_test.rb && ruby test/decision_log_test.rb
  - id: capability-scenario-catalog
    plan: docs/work/dora-implementation-excellence-11-capability-scenario-catalog.yaml
    depends_on: [decision-freshness]
    integration: Scenario declarations link to CapabilityTrace and proof packets; they do not replace existing regression evidence.
    atomic_slices:
      - id: define-scenario-catalog-contract
        outcome: Scenario records declare happy path, permission, recovery, regression, owners, and evidence boundaries.
        paths: [docs/regression-scenario-catalog.yaml, lib/dora/capability_trace.rb, test/capability_trace_test.rb]
        validation: ruby test/capability_trace_test.rb
      - id: connect-scenarios-to-proof
        depends_on: [define-scenario-catalog-contract]
        outcome: Capability proof output reports declared scenario coverage and unknown coverage explicitly.
        paths: [lib/dora/capability_proof_packet.rb, lib/dora/capability_acceptance.rb, test/capability_proof_packet_test.rb, test/capability_acceptance_test.rb]
        validation: ruby test/capability_proof_packet_test.rb && ruby test/capability_acceptance_test.rb
  - id: consumer-upgrade-compatibility
    plan: docs/work/dora-implementation-excellence-12-consumer-upgrade-compatibility.yaml
    depends_on: [truth-hygiene]
    integration: Extend ProjectUpgrade's existing manifest diff; do not create a second upgrade protocol.
    atomic_slices:
      - id: extend-upgrade-impact-model
        outcome: Upgrade comparison classifies schema, command, plugin, and control compatibility plus required retests.
        paths: [lib/dora/project_upgrade.rb, test/project_upgrade_preview_test.rb, test/project_upgrade_apply_test.rb]
        validation: ruby test/project_upgrade_preview_test.rb && ruby test/project_upgrade_apply_test.rb
      - id: render-owner-upgrade-report
        depends_on: [extend-upgrade-impact-model]
        outcome: Preview command emits a read-only compatibility report before apply and preserves existing apply authority.
        paths: [lib/dora/project_commands.rb, test/project_upgrade_apply_command_test.rb, test/project_commands_test.rb]
        validation: ruby test/project_upgrade_apply_command_test.rb && ruby test/project_commands_test.rb
  - id: plugin-capability-contract
    plan: docs/work/dora-implementation-excellence-13-plugin-capability-contract.yaml
    depends_on: [consumer-upgrade-compatibility]
    integration: Version-2 PluginContract and PluginRunner are extended compatibly with policy enforcement and cache identity.
    atomic_slices:
      - id: define-plugin-capability-metadata
        outcome: Plugin declarations specify supported Dora versions, input paths, output schema, and cache identity.
        paths: [lib/dora/plugin_contract.rb, lib/dora/plugin_adapter.rb, test/plugin_contract_test.rb, test/plugin_adapter_test.rb]
        validation: ruby test/plugin_contract_test.rb && ruby test/plugin_adapter_test.rb
      - id: enforce-compatible-plugin-execution
        depends_on: [define-plugin-capability-metadata]
        outcome: Runner rejects incompatible contracts before execution and reports a stable actionable reason.
        paths: [lib/dora/plugin_runner.rb, lib/dora/plugin_discovery.rb, test/plugin_runner_test.rb, test/plugin_policy_contract_test.rb, test/plugin_cache_identity_test.rb]
        validation: ruby test/plugin_runner_test.rb && ruby test/plugin_policy_contract_test.rb && ruby test/plugin_cache_identity_test.rb
  - id: current-work-index
    plan: docs/work/dora-implementation-excellence-14-current-work-index.yaml
    depends_on: [owner-delivery-closeout, decision-freshness]
    integration: ProjectMemory, ProjectStatus, and ProjectReadModel are the sole inputs; historical plans remain intact.
    atomic_slices:
      - id: define-current-work-precedence
        outcome: A documented projection precedence chooses active task, latest verified evidence, open decisions, and next safe action.
        paths: [lib/dora/project_status.rb, lib/dora/project_read_model.rb, test/project_status_test.rb, test/project_read_model_test.rb]
        validation: ruby test/project_status_test.rb && ruby test/project_read_model_test.rb
      - id: expose-current-work-index
        depends_on: [define-current-work-precedence]
        outcome: A read-only command renders the compact index with an explicit freshness/staleness or ambiguity signal rather than guessing.
        paths: [lib/dora/project_commands.rb, test/project_commands_test.rb]
        validation: ruby test/project_commands_test.rb
  - id: bounded-failure-diagnosis
    plan: docs/work/dora-implementation-excellence-15-bounded-failure-diagnosis.yaml
    depends_on: [evidence-hardening, granular-routing]
    integration: Sanitized WorkExecution evidence and ToolSelection provide inputs; diagnosis never runs a fix or changes task status.
    atomic_slices:
      - id: define-failure-taxonomy
        outcome: Known failure classes map to an advisory next-safe step, evidence requirements, and an unknown fallback.
        paths: [.dora/controls/failure-taxonomy.yaml, lib/dora/work_execution.rb, test/work_execution_test.rb]
        validation: ruby test/work_execution_test.rb
      - id: render-bounded-diagnosis
        depends_on: [define-failure-taxonomy]
        outcome: A command groups recent redacted leaf failures and cites its non-repair boundary.
        paths: [lib/dora/analysis_commands.rb, lib/dora/command_registry.rb, test/analysis_commands_test.rb, test/command_registry_test.rb]
        validation: ruby test/analysis_commands_test.rb && ruby test/command_registry_test.rb
  - id: quality-profiles
    plan: docs/work/dora-implementation-excellence-16-quality-profiles.yaml
    depends_on: [task-scoped-contract, capability-scenario-catalog, granular-routing]
    integration: Profiles select from ToolCatalog, task contracts, and scenarios; they cannot silently expand a task's required paths.
    atomic_slices:
      - id: define-profile-schema
        outcome: Project profiles declare stack-appropriate required checks, docs, and evidence with explicit inheritance and override rules.
        paths: [.dora/controls/implementation-quality-profiles.yaml, lib/dora/stack_catalog.rb, test/stack_catalog_test.rb]
        validation: ruby test/stack_catalog_test.rb
      - id: resolve-profile-obligations
        depends_on: [define-profile-schema]
        outcome: Session validates profile applicability and shows resulting obligations separately from task-owned requirements.
        paths: [lib/dora/agent_context.rb, lib/dora/agent_session.rb, test/agent_context_test.rb, test/agent_session_test.rb]
        validation: ruby test/agent_context_test.rb && ruby test/agent_session_test.rb
      - id: validate-profile-routing
        depends_on: [resolve-profile-obligations]
        outcome: Targeted routing and capability proof report profile-required checks without automatic execution.
        paths: [lib/dora/tool_catalog.rb, lib/dora/tool_selection_commands.rb, lib/dora/capability_proof_packet.rb, test/tool_selection_commands_test.rb, test/capability_proof_packet_test.rb]
        validation: ruby test/tool_selection_commands_test.rb && ruby test/capability_proof_packet_test.rb
non_goals:
  - No autonomous code repair, decision mutation, ChatGPT wake-up, or external API integration.
  - No retrospective rewrite of evidence beyond separately owner-approved historical metadata reconciliation.
  - No Dora release, consumer upgrade, or runner reconfiguration.
