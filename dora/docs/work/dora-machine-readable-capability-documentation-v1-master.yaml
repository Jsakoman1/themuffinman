- docs/work/dora-machine-readable-capability-documentation-v1-06-external-adoption.yaml
- docs/work/dora-machine-readable-capability-documentation-v1-07-closeout.yaml
external_adoption_follow_ons:
- repository: ai-system
  purpose: Record the Dora/IDC/PC/CPPE component registry and topology as private architecture documentation.
  eligibility: Dora release slice is verified and the AI-system owner approves its project-local plan.
  authority_boundary: The registry may link Dora facts but cannot own Dora decisions, delivery state or IDC runtime truth.
- repository: DoomsDayStorage
  purpose: Adopt the portable capability inventory and strengthen existing documentation controls from current product evidence.
  eligibility: Dora release slice is verified and the DoomsDayStorage owner approves its project-local plan.
  authority_boundary: DoomsDayStorage retains product/domain truth, DecisionLog, work plans and runtime evidence.
- repository: TheMuffinMan
  purpose: Map the existing capability inventory into the portable contract without re-evaluating product status.
  eligibility: Dora release slice is verified and the TheMuffinMan owner approves its project-local plan.
  authority_boundary: TheMuffinMan retains its existing inventory status authority and all product/delivery controls.
