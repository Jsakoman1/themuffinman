kind: dora_consumer_release_registry
version: 1
authority_boundary: Owner-maintained coordination metadata only. A consumer owns its
  own current pin, release commit, validation evidence and delivery state; this registry
  cannot discover, mutate, deploy, verify or infer any consumer state.
update_contract:
  source_release_manifest_template: templates/dora-release-manifest.yaml
  consumer_pin_record: .dora/bootstrap-source.yaml
  package_path: dora
  required_flow: [owner_approval, reviewed_local_source, upgrade_preview, upgrade_apply,
    consumer_validation, isolated_commit]
consumers:
  - id: doomsday-storage
    repository: https://github.com/Jsakoman1/DoomsDayStorage.git
    release_branch: main
    adapter: .dora/project.yaml
    package_path: dora
    migration_status: snapshot-pin-migration-required
    exclusion: Never discover or read any source outside an explicitly selected local worktree.
  - id: themuffinman
    repository: https://github.com/Jsakoman1/themuffinman.git
    release_branch: main
    adapter: .dora/project.yaml
    package_path: dora
    migration_status: snapshot-pin-migration-required
    exclusion: Existing uncommitted idc pilot and planning drafts remain out of scope for every Dora release update.
