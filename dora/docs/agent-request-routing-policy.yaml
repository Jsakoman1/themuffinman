kind: dora_agent_request_routing_policy
version: 1
default: classify_before_planning
routes:
- request_shape: bounded_delivery
  route: dora_direct
  idc_profile: none
  owner_authorization: not_required_for_triage
  required: [bounded_dora_context, atomic_work_plan, explicit_work_start]
- request_shape: wide_research
  route: idc_advisory_triage
  idc_profile: research_dossier
  owner_authorization: current_request_required_before_render
  required: [explicit_owner_selected_sources, owner_readback]
- request_shape: greenfield_discovery
  route: idc_advisory_triage
  idc_profile: greenfield_product_delivery_baseline
  owner_authorization: current_request_required_before_render
  required: [explicit_owner_selected_sources, owner_readback, approved_baseline_before_master_plan]
master_plan:
  required: [preflight, child_plan_review, atomic_hardening, serial_execution_inventory, owner_readback]
goal_pursuing:
  required: [explicit_owner_authorization_after_readback]
boundaries:
- Classification cannot select or read sources, render IDC, start Codex, create Dora state, or promote a conclusion.
- IDC rendering is current-request-only and does not authorize a Dora decision, plan, work item, evidence record, or verified state.
