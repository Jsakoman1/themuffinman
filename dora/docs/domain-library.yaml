kind: dora_domain_library
version: 1
vocabulary:
- id: project-read-model
  description: A transport-independent, sanitized aggregation of declared project artifacts.
- id: bridge-registry
  description: A private allow-list that maps a public project identifier to one trusted adapter path.
- id: structured-handoff
  description: A private local ingress record that carries immutable owner-requested implementation intent from ChatGPT to an owner-run Codex workflow.
- id: chatgpt-intent-plan
  description: A bounded owner-authored, non-canonical proposal evaluated transiently against Dora state; it never becomes a Dora plan, task, decision, lifecycle record, or evidence source.
entities:
- id: project-adapter
  description: A project-owned declaration of bounded roots and workflow commands.
- id: execution-inventory
  description: A serial record of declared work items and their verified, pending, or superseded state.
- id: handoff
  description: An immutable created handoff plus append-only lifecycle events, stored outside registered project repositories.
- id: handoff-collaboration-feedback
  description: A bounded append-only semantic milestone projection on a claimed handoff, containing high-signal progress, findings, verification state, deviations, and residual risks rather than terminal output.
- id: local-handoff-runner
  description: An owner-started foreground local process that selects an authorized READY handoff, claims it once, and passes only its validated UUID to the fixed local launcher for non-interactive Codex execution.
- id: assistant-context-view
  description: A compact derived view of authoritative Dora knowledge with provenance and freshness, never a mutable duplicate of project truth or raw transcript store.
- id: intent-plan-alignment-readback
  description: A derived owner-safe projection containing phase, alignment result, first safe next action, one eligible first candidate at most, blocked later candidates, and one fixed actionable blocker or decision.
invariants:
- id: read-only-projection
  description: External bridge output is sanitized server-side and never grants write, shell, filesystem, or source retrieval authority.
- id: explicit-supersession
  description: Superseded work remains auditable but cannot resolve as active or latest delivery.
- id: handoff-immutable-content
  description: Handoff title, objective, acceptance criteria, constraints, references, implementation brief, creator, and idempotency key never change after creation; corrections create a new linked handoff.
- id: handoff-decision-stop
  description: An implementation brief with unresolved owner decisions is a decision request, not implementation authority; Codex must stop and record a blocker instead of guessing.
- id: handoff-evidence-completion
  description: A handoff can be COMPLETED only after it links a Dora delivery and passing verification evidence; a blocked handoff retains a structured reason.
- id: handoff-current-state-precedence
  description: Current handoff lifecycle state and linked Dora verification evidence override stale immutable handoff snapshot text; COMPLETED is never evidence by itself.
- id: handoff-progress-monotonicity
  description: Claimed feedback may advance only through the finite START, DISCOVERY/PLANNING, IMPLEMENTING, and VERIFYING phase model with non-regressing allowlisted verification states. VERIFIED is evidence-owned; BLOCKED and COMPLETED are lifecycle outcomes that override active progress; terminal handoffs are not mutable.
- id: handoff-lifecycle-readback
  description: The dedicated external lifecycle readback exposes only a validated handoff ID, status, outcome category, verification state, project-relative evidence references, and fixed owner-safe summary; it never exposes immutable content, raw lifecycle events, terminal output, environment values, secrets, or private filesystem paths.
- id: handoff-progress-projection
  description: A derived, read-only handoff progress object that reports only one fixed phase, human-friendly label, fixed sanitized summary, and stable material-change token. It derives from the existing lifecycle and never exposes feedback prose, raw evidence, source content, paths, commands, environment values, or secrets.
- id: handoff-owner-decision-readback
  description: A structured owner-decision block records question, rationale, known options, optional recommendation, blocked work, and work that may continue, while corrections remain append-only lineage.
- id: project-memory-closeout-gate
  description: Project memory current-work navigation must validate against declared execution inventory state before a strict master closeout can become verified; terminal verified work uses explicit state none, and reconciliation never rewrites historical task evidence.
- id: local-runner-fail-closed
  description: Duplicate, stale, interrupted, non-zero, ambiguous, or private-state-failed runner execution never retries or reclaims CLAIMED work; it stops with structured Dora state or owner recovery required. A child launch failure retains only an allowlisted code, optional exit code, and fixed recovery hint; fixed wrapper codes distinguish launcher preflight from Codex execution without retaining child streams.
- id: local-runner-terminal-observation
  description: The owner-local runner terminal observes only the existing V3.2 fixed lifecycle/progress projection. It emits one readiness message, deduplicates unchanged idle and phase state, maps invalid or unavailable readback to one fixed unavailable message, and never prints child output, feedback prose, tokens, paths, commands, environment values, or secrets.
- id: assistant-readback-provenance
  description: Assistant-facing context and completion awareness are derived from cited Dora artifacts and existing sanitized handoff readback; scheduled checking does not imply real-time push.
- id: intent-plan-canonical-precedence
  description: Dora's declared project health, accepted decisions, unresolved owner decisions, active delivery, latest verification, and task evidence are authoritative over any ChatGPT Intent Plan. Evaluation is transient and cannot reinterpret or overwrite them.
- id: intent-plan-first-slice-gate
  description: Only a dependency-free first candidate with the no-owner-decision gate may be identified after accepted or reconciled alignment. Later candidates remain blocked until their declared predecessor has Dora verification evidence and no owner decision is pending.
permission_rules:
- id: bridge-read
  actor: authorized external client
  action: read safe project projection
  boundary: Only explicitly allow-listed projects and sanitized projection fields are available.
- id: bridge-handoff-write
  actor: authorized external client
  action: create an owner-requested structured implementation handoff
  boundary: Only a known project with explicit handoff_write capability may receive bounded structured data; the server grants no filesystem, shell, patch, git, source, process, or Codex control.
- id: bridge-intent-plan-alignment
  actor: authorized external client
  action: transiently evaluate one bounded Intent Plan against an explicitly allow-listed Dora project
  boundary: The read-only evaluation accepts no paths, commands, source retrieval, or mutation fields; it returns fixed safe language and never persists proposal or canonical-state content.
- id: local-runner-operation
  actor: local owner
  action: explicitly start, inspect, or stop the foreground local runner
  boundary: The operation is host-local, project-allowlisted, fixed-launcher only, and unavailable through MCP, ChatGPT, or any remote bridge request.
workflows:
- id: declared-work-lifecycle
  initial_state: planned
  transitions:
  - from: planned
    to: active
    action: start one declared work item
  - from: active
    to: verified
    action: record passing leaf validation
  - from: planned
    to: superseded
    action: explicitly replace obsolete work without claiming completion
- id: structured-handoff-lifecycle
  initial_state: READY
  transitions:
  - from: READY
    to: CLAIMED
    action: one local Codex consumer claims the deterministic handoff through Dora.
  - from: CLAIMED
    to: COMPLETED
    action: link a Dora delivery and passing evidence, then record completion.
  - from: READY
    to: BLOCKED
    action: record a structured blocker.
  - from: CLAIMED
    to: BLOCKED
    action: record a structured blocker.
  - from: CLAIMED
    to: BLOCKED
    action: record a structured owner/product decision request without guessing implementation behavior.
  - from: READY
    to: CANCELLED
    action: owner cancels the queued handoff.
  - from: READY
    to: SUPERSEDED
    action: owner records a follow-up handoff reference.
acceptance_scenarios:
- id: safe-external-summary
  given: An authorized client selects an allow-listed project.
  when: It requests the project summary.
  then: It receives current safe state or explicit inconsistency metadata without raw local data.
- id: owner-gated-structured-handoff
  given: ChatGPT submits bounded structured content for a project with explicit handoff_write capability.
  when: the local owner starts codex-both and Codex claims the selected handoff through Dora.
  then: normal Dora work verification evidence is required before a sanitized completed readback is available, and no remote request starts Codex.
- id: explicit-owner-decision-stop
  given: A structured handoff names an unresolved product decision.
  when: Codex reads the handoff through the local Dora boundary.
  then: It stops for the owner decision and does not convert the ambiguity into implementation work.
