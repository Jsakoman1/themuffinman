kind: dora_research_source_catalog
version: 1
snapshot_date: '2026-08-11'
scope: >-
  External evidence for a future private intelligent AI system. This catalog is
  research evidence, not a DecisionLog, implementation plan, or authority source.
epistemic_rule: >-
  External sources support findings only. Dora DecisionLog remains the sole authority
  for accepted owner decisions; unknown fields are intentionally not inferred.
sources:
- id: international-ai-safety-report-2026
  title: International AI Safety Report 2026
  authors_or_organization: International AI Safety Report expert panel, chaired by Yoshua Bengio
  source_type: technical report
  publication_date: '2026-02-24'
  revision_or_version: arXiv v1
  primary_url: https://arxiv.org/abs/2602.21012
  code_url: unknown
  peer_review_status: technical report
  verified_on: '2026-08-11'
  categories: [capabilities, agent-safety, risk-management]
  key_findings: General-purpose AI capability and risk synthesis; not a proof of autonomous reliability.
  limitations: Synthesis report, not one controlled benchmark.
  relevance_to_dora: Supports evaluation, governance, and risk-management boundaries.
  epistemic_status: externally-supported-finding
  may_become_stale: true
- id: osworld-2
  title: 'OSWorld 2.0: Benchmarking Computer Use Agents on Long-Horizon Real-World Tasks'
  authors_or_organization: Mengqi Yuan et al.
  source_type: benchmark preprint
  publication_date: '2026-07-13'
  revision_or_version: arXiv v2
  primary_url: https://arxiv.org/abs/2606.29537
  code_url: unknown
  peer_review_status: preprint
  verified_on: '2026-08-11'
  categories: [computer-use, long-horizon, benchmark]
  key_findings: '108 workflows; best reported binary completion 20.6%, partial score 54.8%.'
  limitations: Author-reported snapshot at a fixed step/model/tool configuration.
  relevance_to_dora: Long tasks need explicit context, recovery, and verification.
  epistemic_status: historical-snapshot
  may_become_stale: true
- id: long-horizon-terminal-bench
  title: 'Long-Horizon-Terminal-Bench: Testing the Limits of Agents on Long-Horizon Terminal Tasks with Dense Reward-Based Grading'
  authors_or_organization: Zongxia Li et al.
  source_type: benchmark preprint
  publication_date: '2026-07-13'
  revision_or_version: arXiv v2
  primary_url: https://arxiv.org/abs/2607.08964
  code_url: unknown
  peer_review_status: preprint
  verified_on: '2026-08-11'
  categories: [terminal, long-horizon, benchmark]
  key_findings: '46 tasks/9 categories; best 15.2% at reward >=0.95 and 10.9% at 1.0.'
  limitations: Dense partial reward does not establish completed user value.
  relevance_to_dora: Completion needs independent evidence, not partial trajectory progress.
  epistemic_status: historical-snapshot
  may_become_stale: true
- id: swe-evo
  title: 'SWE-EVO: Benchmarking Coding Agents in Long-Horizon Software Evolution Scenarios'
  authors_or_organization: Tue Le et al.
  source_type: benchmark preprint
  publication_date: '2026-05-22'
  revision_or_version: arXiv v6
  primary_url: https://arxiv.org/abs/2512.18470
  code_url: unknown
  peer_review_status: preprint
  verified_on: '2026-08-11'
  categories: [software-evolution, long-horizon, benchmark]
  key_findings: '48 tasks from 7 projects; average 21 files and 874 tests; reported 25% vs 72.80% on non-equivalent setups.'
  limitations: SWE-EVO/OpenHands/GPT-5.4 and SWE-bench Verified/GPT-5.2 are not a controlled head-to-head.
  relevance_to_dora: Serial decisions, dependencies, evidence, and verification remain valuable.
  epistemic_status: historical-snapshot
  may_become_stale: true
- id: swe-marathon
  title: 'SWE-Marathon: Can Agents Autonomously Complete Ultra-Long-Horizon Software Work?'
  authors_or_organization: Rishi Desai et al.
  source_type: benchmark preprint
  publication_date: '2026-06-05'
  revision_or_version: arXiv v1
  primary_url: https://arxiv.org/abs/2606.07682
  code_url: https://swe-marathon.org
  peer_review_status: preprint
  verified_on: '2026-08-11'
  categories: [software-engineering, long-horizon, verification]
  key_findings: '20 tasks; fewer than 30% solved; 13.8% reward-hacking rollouts.'
  limitations: Benchmark environment and author evaluation; not production behavior.
  relevance_to_dora: Supports verifier separation and adversarial completion checks.
  epistemic_status: historical-snapshot
  may_become_stale: true
- id: metr-time-horizon-1-1
  title: Time Horizon 1.1
  authors_or_organization: METR
  source_type: official evaluation report
  publication_date: '2026-01-29'
  revision_or_version: TH1.1
  primary_url: https://metr.org/blog/2026-1-29-time-horizon-1-1/
  code_url: https://github.com/METR/eval-analysis-public
  peer_review_status: official report
  verified_on: '2026-08-11'
  categories: [time-horizon, evaluation, software-tasks]
  key_findings: '228-task suite; historical P50 trend about 196 days; TH1.1 post-2023 estimate 131 days.'
  limitations: Mostly research/software task distribution, wide intervals, task-suite changes, saturation risk.
  relevance_to_dora: Horizon estimates are not permission for unattended multi-day execution.
  epistemic_status: historical-snapshot
  may_become_stale: true
- id: longmemeval
  title: 'LongMemEval: Benchmarking Chat Assistants on Long-Term Interactive Memory'
  authors_or_organization: Di Wu et al.
  source_type: peer-reviewed benchmark
  publication_date: '2025-03-04'
  revision_or_version: arXiv v2; ICLR 2025
  primary_url: https://arxiv.org/abs/2410.10813
  code_url: https://github.com/xiaowu0162/LongMemEval
  peer_review_status: peer-reviewed
  verified_on: '2026-08-11'
  categories: [memory, temporal-reasoning, benchmark]
  key_findings: 'Five abilities and roughly 30% sustained-interaction accuracy drop; indexing, retrieval, and reading are separate.'
  limitations: Synthetic curated chat histories do not define a canonical-memory policy.
  relevance_to_dora: Retrieval must preserve provenance and temporal status.
  epistemic_status: externally-supported-finding
  may_become_stale: false
- id: stale-memory-benchmark
