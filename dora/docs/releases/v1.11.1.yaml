kind: dora_release_manifest
version: 1
release:
  version: v1.11.1
  source_commit: 947bd7a6a73f2d52feed41ff6f2c5ef7eebc9e10
  release_type: patch
  published_at: '2026-08-12T12:30:00Z'
scope:
  changed_capabilities:
  - Consumer upgrade-apply persists the reviewed target immutable ref/checksum.
  - Consumer upgrade-rollback restores the backed-up source pin with the package.
  - Release operations guide, release manifest template and known-consumer registry
    make manual owner-approved updates reproducible.
  idc_impact: IDC runtime behavior is unchanged; IDC remains bundled, opt-in and owner-gated.
  compatibility_posture: Existing historical snapshot consumers require one explicit pin migration before using upgrade-preview/apply.
consumer_requirements:
  package_update: explicit-owner-selection-only
  adapter_change_required: true
  required_validations: [upgrade_preview, dora_doctor, git_diff_check, consumer_declared_checks]
  rollback: Restore the local upgrade backup before commit or revert the isolated consumer release commit after commit.
boundaries:
  - The release manifest does not claim that any consumer is updated, compatible, deployed or verified.
  - IDC remains opt-in; a Dora package update does not start IDC or create a Dora write path.
  - The release process does not discover consumer repositories or modify one without explicit owner approval.
