kind: dora_decision_log
version: 1
entries:
- id: dora-local-portfolio-read-model-boundary
  decision: Dora may support a local, explicitly allow-listed portfolio read model, provided every portfolio view remains read-only and advisory.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-greenfield-discovery-delivery-master.yaml#derived-context-index-preflight
  evidence_references:
  - docs/product-brief.yaml
- id: dora-decision-log-canonical-owner-authority
  decision: DecisionLog is Dora's sole canonical record of owner decisions. Delivery state remains in plans, tasks, and evidence; ProjectMemory and read models remain derived navigation with cited provenance only.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-implementation-excellence-master.yaml#source_of_truth_contract
  evidence_references:
  - docs/product-brief.yaml
- id: dora-stable-consumer-release-runtime
  decision: Stable consumer projects use a reproducibly vendored Dora runtime pinned to an immutable release/tag and commit. Reviewed local-source/bootstrap is limited to Dora development, testing, and pre-release work, not normal consumer runtime.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-independent-release-tree-proof.yaml
  evidence_references:
  - docs/new-project.md
- id: dora-swift-ios-preflight-sequencing
  decision: Dora does not build a Swift/iOS technology profile now. It first learns from real Spring and web consumer use; a small owner-approved Swift/iOS local build/test-profile preflight may begin when an iPhone application actually starts.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-implementation-excellence-16-quality-profiles.yaml
  evidence_references:
  - docs/product-brief.yaml
- id: dora-bridge-optional-owner-gated-posture
  decision: Dora Bridge remains an optional, owner-gated integration layer. It is not Dora's core definition and has no remote-control authority.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-bridge-v3-local-runner-master.yaml
  evidence_references:
  - docs/product-brief.yaml
- id: dora-bridge-v2-structured-handoff-owner-decision
  decision: 'Approve Dora Bridge V2 as a separately governed structured handoff inbox:
    V1 remains read-only; ChatGPT may create only validated structured handoffs and
    never receives shell, filesystem, patch, git, source-editing, or process-execution
    authority; the owner running codex-both remains the execution gate; automatic
    remote Codex execution is deferred to a future V3 security program.'
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-bridge-v2-structured-handoff-master.yaml
  evidence_references:
  - docs/dora-bridge-v2-structured-handoff.md
- id: future-write-handoff-program
  decision: The prior generic future-write-handoff program is superseded by the separately approved and externally accepted Dora Bridge V2 structured-handoff program; V1 remains read-only.
  status: superseded
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-bridge-v1-historical-record-master.yaml
  evidence_references:
  - docs/dora-bridge-v1-connectivity.md
- id: dora-bridge-v2-external-acceptance-boundary
  decision: Dora Bridge V2 was freshly discovered in ChatGPT and a real handoff was created, owner-gated claimed, Dora-verified, completed, and read back. The external acceptance boundary is satisfied; remote Codex control remains deferred to V3.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-bridge-v2-1-collaboration-master.yaml
  evidence_references:
  - docs/dora-bridge-v2-structured-handoff.md
- id: dora-bridge-v2-2-feedback-projection
  decision: Approve V2.2 as a bounded append-only collaboration feedback projection on the existing private handoff lifecycle. Extend existing handoff reads rather than adding a parallel status system or MCP tool; structured owner-decision blocks are terminal, completion remains evidence-gated, and remote Codex control remains deferred to V3.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-bridge-v2-2-collaboration-master.yaml
  evidence_references:
  - docs/dora-bridge-v2-structured-handoff.md
- id: dora-bridge-v3-local-runner-boundary
  decision: Approve V3 as an explicit owner-started local foreground runner that reuses
    the V2.2 private handoff lifecycle, evidence, and sanitized readback. It may invoke
    only the fixed existing owner-local Codex workflow for one claimed handoff at a time;
    it cannot be remotely started, stopped, steered, inspected, or used for terminal
    streaming. Completion awareness is scheduled V2.2 readback, not push.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-bridge-v3-local-runner-master.yaml
  evidence_references:
  - docs/dora-bridge-v2-structured-handoff.md
- id: dora-bridge-v3-2-friendly-progress-readback
  decision: Approve V3.2 as a derived safe progress projection on the existing handoff lifecycle. Local Codex continues to use the bounded handoff-feedback command, ordered phase validation prevents regression, and status/readback exposes only fixed language plus a material-change token; no new bridge write, status store, terminal stream, or remote runner control is added.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/dora-bridge-v3-2-friendly-progress-master.yaml
  evidence_references:
  - docs/dora-bridge-v2-structured-handoff.md
- id: chatgpt-intent-plan-canonical-alignment
  decision: Approve MP-01 as a transient, read-only comparison between one bounded
    ChatGPT Intent Plan and canonical Dora state. Dora Master Plans, accepted decisions,
    task lifecycle, and verification evidence retain sole authority. An accepted or
    reconciled result may identify only the first gated candidate slice; it cannot create
    or release work, and later candidates remain blocked pending Dora verification and no
    owner decision.
  status: accepted
  domain_references:
  - docs/domain-library.yaml
  plan_references:
  - docs/work/chatgpt-intent-plan-alignment-master.yaml
  evidence_references:
  - docs/dora-bridge-v2-structured-handoff.md
