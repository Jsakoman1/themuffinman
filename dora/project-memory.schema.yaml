kind: dora_project_memory_schema
version: 1
purpose: Preserve declared project intent, canonical knowledge, unresolved decisions, capability intent, and current bounded work for a Codex agent without inventing delivery status.
required_fields: [kind, version, project_intent, canonical_knowledge, open_decisions, capability_intent, current_work]
project_intent_required_fields: [product_brief, domain_library]
canonical_knowledge_entry_fields: [id, path, purpose]
open_decision_entry_fields: [id, statement, source]
capability_intent_entry_fields: [id, intended_outcome, knowledge_references]
current_work_required_fields: [plan, task, state]
allowed_current_work_states: [planned, active, blocked]
invariants:
  - Project memory links only declared project-relative knowledge and work paths.
  - Open decisions remain open; memory does not resolve them or infer a product decision.
  - Capability intent describes desired outcomes, not completed implementation.
  - Current work identifies a bounded declared task and never records verified or complete as a state.
  - Project memory is navigation context only and does not prove implementation, runtime acceptance, or release readiness.
  - Drift reports compare declared sources without rewriting memory or resolving decisions.
