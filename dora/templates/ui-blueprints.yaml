kind: dora_ui_blueprint_catalog
version: 1
blueprints:
  - id: list-detail
    purpose: Present a list and one selected detail surface.
    states: [loading, empty, error, populated]
    mobile: Preserve the selected detail as a full-width route or panel.
    accessibility: Provide semantic headings, keyboard focus order, and visible focus indicators.
  - id: filterable-list
    purpose: Present a list with explicitly labelled filters.
    states: [loading, empty, error, populated]
    mobile: Keep filters discoverable without hiding active filter state.
    accessibility: Associate every control with a label and announce result changes appropriately.
  - id: status-badge
    purpose: Communicate a declared state without relying on color alone.
    states: [normal, warning, critical]
    mobile: Preserve text labels at narrow widths.
    accessibility: Include text and programmatic state in addition to color.
  - id: dashboard-summary
    purpose: Present high-level counts and prioritised actions.
    states: [loading, empty, error, populated]
    mobile: Stack summary sections in reading order.
    accessibility: Use meaningful headings and do not encode critical meaning by position alone.
accessibility_baseline:
  - Keyboard interaction and visible focus are required for interactive controls.
  - Inputs require programmatic labels and errors require clear text.
  - Loading, empty, and error states require explicit text.
  - Color is never the only carrier of status meaning.
completion_boundary: This catalog is neutral. It contains no product copy, component implementation, visual acceptance result, or browser evidence.
