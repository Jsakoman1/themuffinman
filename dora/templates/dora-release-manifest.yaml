kind: dora_release_manifest
version: 1
release:
  version: replace-with-immutable-version
  source_commit: replace-with-forty-character-commit
  release_type: patch
  published_at: replace-with-utc-timestamp
scope:
  changed_capabilities: []
  idc_impact: none
  compatibility_posture: review-required
consumer_requirements:
  package_update: explicit-owner-selection-only
  adapter_change_required: false
  required_validations: [dora_doctor, git_diff_check]
  rollback: Revert the isolated consumer release commit or restore the recorded local backup before commit.
boundaries:
  - The release manifest does not claim that any consumer is updated, compatible, deployed or verified.
  - IDC remains opt-in; a Dora package update does not start IDC or create a Dora write path.
  - The release process does not discover consumer repositories or modify one without explicit owner approval.
