kind: dora_schema
version: 1
id: command-envelope
description: Stable machine-readable response contract for Codex-facing Dora commands.
success_required: [kind, version, outcome, payload, citations, side_effect]
error_required: [kind, version, outcome, error, remediation, citations, side_effect]
invariants:
  - Every response states whether it succeeded or failed without implying product completion.
  - Citations name only declared project-owned sources.
  - Side-effect class is one of read_only, local_mutation, or external_approval_required.
