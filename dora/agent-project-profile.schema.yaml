kind: dora_agent_project_profile_schema
version: 1
purpose: Give an implementation agent explicit, project-owned operating context without embedding application logic in Dora.
required_fields: [kind, version, entrypoints, canonical_knowledge, stack_commands, authority_limits, evidence_requirements, implementation_order]
named_list_fields: [entrypoints, canonical_knowledge, stack_commands, authority_limits, evidence_requirements, implementation_order]
invariants:
  - Entrypoints and canonical knowledge are declared project-relative paths.
  - Stack commands are explicit project commands; Dora does not infer them.
  - Authority limits and evidence requirements are explicit before implementation starts.
  - Implementation order is advisory routing, never evidence of completed work.
