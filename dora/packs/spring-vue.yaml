kind: dora_stack_pack
version: 1
id: spring-vue
directories: [backend/src/main/java, frontend/src]
files:
  .dora/repository-map.yaml:
    kind: dora_repository_map
    version: 1
    source_roots:
      - id: backend
        path: backend
        plugins: [java_spring]
      - id: frontend
        path: frontend
        plugins: [typescript_vue]
    relationships: []
  .dora/stack.yaml:
    kind: dora_stack
    version: 1
    validation_commands:
      backend: ./mvnw test
      frontend: npm run type-check
    plugins: [java_spring, typescript_vue]
