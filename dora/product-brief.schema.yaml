kind: dora_product_brief_schema
version: 1
purpose: Declare the intended product outcome before implementation without prescribing a business vertical or technical stack.
required_fields: [kind, version, product, user_problem, primary_users, intended_outcomes, non_goals, assumptions, risks, unanswered_decisions]
list_fields: [primary_users, intended_outcomes, non_goals, assumptions, risks]
optional_empty_list_fields: [unanswered_decisions]
invariants:
  - A brief records intent, uncertainty, and scope boundaries; it is not implementation evidence.
  - Every list item is a non-empty statement supplied by the consuming project; unanswered_decisions may be an empty list when no owner decision is pending.
  - Unanswered decisions remain explicit until the project resolves them, then the declared list is empty.
