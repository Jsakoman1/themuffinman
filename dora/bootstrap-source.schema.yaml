kind: dora_schema
version: 1
id: bootstrap-source
description: Declares a local Dora source and an immutable source revision for safe project bootstrap.
required:
  - kind
  - version
  - source
  - review
properties:
  kind:
    const: dora_bootstrap_source
  version:
    const: 1
  source:
    type: object
    required: [path, ref, checksum]
    properties:
      path:
        type: string
        description: Existing local directory containing bin/dora and lib/dora; remote URLs are not permitted.
      ref:
        type: string
        pattern: '^[0-9a-fA-F]{40}$'
        description: Immutable reviewed commit identifier recorded with the copied local source.
      checksum:
        type: string
        pattern: '^[0-9a-fA-F]{64}$'
        description: SHA-256 digest of the reviewed local Dora source content, excluding source-control and local IDE metadata that cannot enter a vendored consumer package.
  review:
    type: object
    required: [id, reviewed_by, reviewed_at]
    properties:
      id:
        type: string
        description: Project-owned identifier for the source review record.
      reviewed_by:
        type: string
        description: Person or approved local automation that reviewed the source descriptor.
      reviewed_at:
        type: string
        description: Recorded review timestamp; Dora preserves it and does not infer approval.
