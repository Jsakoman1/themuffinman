kind: dora_schema
version: 1
id: bootstrap-source
description: Declares a local Dora source and an immutable source revision for safe project bootstrap.
required:
  - kind
  - version
  - source
properties:
  kind:
    const: dora_bootstrap_source
  version:
    const: 1
  source:
    type: object
    required: [path, ref]
    properties:
      path:
        type: string
        description: Existing local directory containing bin/dora and lib/dora; remote URLs are not permitted.
      ref:
        type: string
        pattern: '^[0-9a-fA-F]{40}$'
        description: Immutable reviewed commit identifier recorded with the copied local source.
