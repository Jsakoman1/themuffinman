kind: dora_plugin_manifest_schema
version: 2
purpose: Declare optional stack plugins and, from manifest version 2, their honest local execution boundary without Dora inferring source roots, product behavior, or completion status.
manifest_versions:
  1:
    compatibility: Legacy manifests remain readable but have no declared execution policy.
  2:
    plugin_required_fields: [id, source_roots, inputs, output, execution_policy]
plugin_required_fields: [id, source_roots, inputs, output]
plugin_execution_one_of: [entrypoint, builtin]
execution_policy_required_fields: [trust, timeout_seconds, isolation, unsupported_guarantees]
supported_trust_classes: [dora_builtin, project_trusted]
supported_isolation: [none]
required_unsupported_guarantees: [filesystem_isolation, network_isolation, credential_isolation, resource_sandbox]
timeout_seconds_range: [1, 300]
source_root_required_fields: [id, path]
output_required_fields: [kind, path]
invariants:
  - Plugin source roots are project-owned relative paths.
  - A plugin runs either a project-owned Ruby entrypoint or a Dora built-in; never both.
  - Built-ins are Dora-owned static analysis only and do not require executable project code.
  - Version 2 manifests declare an execution policy for every plugin; project entrypoints are explicitly trusted local code and Dora built-ins are explicitly Dora-owned code.
  - Dora currently supports a wall-clock timeout and no process, filesystem, network, credential, or resource sandbox.
  - Unsupported guarantees are declared as limitations, never presented as protections Dora enforces.
  - Inputs describe only static analysis configuration supplied by the consuming project.
  - Plugin output is a report contract, never a capability, runtime, or release conclusion.
