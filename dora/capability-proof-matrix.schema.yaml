kind: dora_capability_proof_matrix_schema
version: 1
description: Explicit evidence obligations for confirmed capability assertions.
required_fields: [kind, version, capability, assertions, obligations, completion_boundary]
assertion_required_fields: [id, statement, confirmed]
obligation_required_fields: [id, assertion_id, evidence_class, status, boundary]
evidence_classes: [static, unit, api, migration, browser_runtime, accessibility, security, acceptance]
statuses: [required, unresolved]
invariants:
  - Every obligation cites one declared assertion and a distinct evidence class.
  - Browser/runtime, accessibility, security, and acceptance obligations remain unresolved until project-owned evidence is recorded.
  - The matrix declares proof work only and never manufactures a passing result.
completion_boundary: A capability proof matrix records obligations only; it does not execute a command, start a browser, access a database, or prove acceptance.
