kind: dora_project_adapter
version: 1
project:
  id: standalone-fixture
  root: ..
paths:
  docs: docs
  work_plans: docs/work
  audit_output: docs/audit-output
  runtime_evidence: docs/runtime-evidence
commands:
  work_start: fixture work-start
  work_verify: fixture work-verify
  control_check: fixture control-check
extensions:
  - id: fixture-documentation
    category: documentation
    paths: [docs/product.md]
    invocation: fixture docs-check

