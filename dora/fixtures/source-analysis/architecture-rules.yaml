kind: dora_architecture_rule_set
version: 1
source_roots:
  - id: source
    path: src
inputs:
  paths: [src]
  rules:
    - id: no-product-secret
      source_glob: src/**/*.rb
      forbidden_pattern: product_secret
output:
  kind: static-analysis-report
  path: reports/architecture-integrity.json
invariants:
  - Rules describe only supplied source paths and patterns.
  - Findings are diagnostic evidence, not a completion decision.
