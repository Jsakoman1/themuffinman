kind: dora_idea_interview_schema
version: 1
purpose: Capture explicit user answers needed to turn an idea into declared project knowledge without Dora inferring product policy.
required_fields: [kind, version, project_id, answers, unanswered_decisions]
required_answer_ids: [target_users, first_problem, first_capability, domain_concepts, permission_intent, workflow_intent, forbidden_outcomes]
answer_required_fields: [id, value, source]
unanswered_decision_required_fields: [id, question, source]
allowed_answer_sources: [user, user_confirmed]
invariants:
  - Every answered value records user provenance.
  - An unanswered decision remains unresolved and is never converted into a rule.
  - Dora may validate completeness and structure but does not infer missing business policy, permissions, workflows, or acceptance criteria.
