kind: dora_domain_capability_graph_schema
version: 1
description: Declared capability dependency graph derived from confirmed domain decisions only.
required_fields: [kind, version, capabilities, decisions, completion_boundary]
capability_required_fields: [id, title, dependencies, required_decisions, confirmed]
decision_required_fields: [id, status]
decision_statuses: [confirmed, open]
invariants:
  - Every capability dependency and required decision must refer to a declared identifier.
  - Only confirmed capabilities with confirmed required decisions and ready dependencies may be recommended next.
  - A cycle, missing reference, open decision, or unconfirmed capability is a blocker, never an inferred resolution.
  - Graph status is planning guidance and does not mark a capability implemented or accepted.
completion_boundary: A capability graph reports declared ordering and gaps only; it does not create work, infer a decision, start implementation, or prove completion.
