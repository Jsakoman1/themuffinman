kind: dora_related_resource_feature_schema
version: 1
description: Explicit additive relationship around one confirmed compiled feature.
required_fields: [kind, version, feature, relation, query, ui_states, convention_profile, confirmation, completion_boundary]
relation_required_fields: [field, target_capability, target_table, target_column, confirmed]
query_required_fields: [id, fields, index_confirmed]
invariants:
  - The wrapped feature remains a separately confirmed compiled feature with an explicit foreign key mapping.
  - The relation, query, UI states, and project convention profile must be explicitly declared.
  - The declaration plans additive output only and never authorizes replacement of an existing resource, migration, or manual edit.
completion_boundary: A related-resource declaration is generator input only; it does not implement a consumer feature, run a database, or prove a relationship works at runtime.
