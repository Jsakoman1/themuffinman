kind: dora_schema
version: 1
id: plugin-report
description: Portable static-plugin report that is explicitly not a completion claim.
required: [kind, version, plugin, inputs, findings, completion_boundary]
properties:
  kind: {const: dora_plugin_report}
  version: {const: 1}
  plugin: {type: string}
  inputs: {type: object}
  findings: {type: array}
  completion_boundary:
    const: Static plugin output is diagnostic evidence only and does not prove product completion, runtime acceptance, or release readiness.
