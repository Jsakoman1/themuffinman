kind: dora_guided_agent_entrypoint_schema
version: 1
description: Contract for one Codex-guided route that resumes a confirmed interview and returns either one unanswered question or a review-only handoff.
required_fields: [kind, version, session, handoff, completion_boundary]
session_kind: dora_idea_interview_session
handoff_required_fields: [dora_source, first_work, starter, codex_integration]
resolution_states: [ask_one_confirmed_question, review_create_app_handoff]
invariants:
  - An incomplete session resolves only to the first unanswered required interview question.
  - A complete session may resolve only to a reviewable create-app handoff and retains explicit open decisions.
  - Answers and open decisions must remain user_confirmed; the entrypoint never synthesizes either.
  - The handoff is planning context, not a create-app mutation, implementation task, approval, or completion claim.
completion_boundary: The guided entrypoint selects one declared next interaction or review-only handoff; it does not infer product rules, create source code, start work, or prove readiness.
