kind: dora_idea_interview_session_schema
version: 1
required_fields: [kind, version, project_id, answers, open_decisions, completion_boundary]
answer_required_fields: [id, value, source]
open_decision_required_fields: [id, question, source, status]
allowed_answer_source: user_confirmed
allowed_open_decision_source: user_confirmed
required_answer_ids: [target_users, first_problem, first_capability, domain_concepts, permission_intent, workflow_intent, forbidden_outcomes]
direction_core_answer_ids: [target_users, first_problem, first_capability, forbidden_outcomes]
direction_conditional_rules:
- id: permission-intent
  answer_id: permission_intent
  source_answer_ids: [target_users]
  trigger_terms: [household, family, team, group, member, shared, organization, organisation, community, public, marketplace]
- id: workflow-intent
  answer_id: workflow_intent
  source_answer_ids: [first_problem, first_capability]
  trigger_terms: [record, track, manage, approve, book, schedule, order, share, lend, borrow, consume, restock]
direction_completion_boundary: Direction framing is advisory only; it does not create a product decision, authorize research, create-app, work, implementation, or verification.
completion_boundary: A guided session records confirmed answers and explicit open decisions only; it does not infer product rules or prove readiness.
