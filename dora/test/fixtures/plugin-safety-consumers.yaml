kind: dora_plugin_safety_consumers
version: 1
unsupported_guarantees: [filesystem_isolation, network_isolation, credential_isolation, resource_sandbox]
consumers:
  - id: quick-consumer
    entrypoint: plugins/quick.rb
    timeout_seconds: 2
    program: "puts 'quick analysis'"
    expected: success
  - id: timeout-consumer
    entrypoint: plugins/slow.rb
    timeout_seconds: 1
    program: "sleep 2"
    expected: timeout
