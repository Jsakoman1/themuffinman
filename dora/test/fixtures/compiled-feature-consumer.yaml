kind: dora_compiled_feature
version: 1
capability: record-supply
stack:
  id: spring-vue-postgres-buildable
  package: example.inventory
  backend_root: backend
  frontend_root: frontend
  migration_directory: backend/src/main/resources/db/migration
  confirmed: true
entity:
  id: supply
  table: supply
  fields:
    - id: name
      java_type: String
      database:
        column: name
        sql_type: varchar
        nullable: false
        confirmed: true
        default:
        default_confirmed: true
        unique: false
        unique_confirmed: true
        index: true
        index_confirmed: true
        foreign_key:
        foreign_key_confirmed: true
      confirmed: true
  confirmed: true
permission:
  id: household-write
  enforcement: service
  rule: Only an explicitly authorized actor may create a supply.
  confirmed: true
workflow:
  id: supply-lifecycle
  initial_state: active
  states: [active, archived]
  transitions:
    - from: active
      to: archived
      action: archive
      confirmed: true
  confirmed: true
api:
  base_path: /api/supplies
  operations:
    - id: create-supply
      method: POST
      path: /api/supplies
      request_fields: [name]
      response_fields: [name]
      confirmed: true
  confirmed: true
ui:
  blueprint: list-detail
  states: [loading, empty, error, populated]
  confirmed: true
confirmation: true
compile_commands:
  backend: mvn -q -f backend/pom.xml test
  frontend_syntax: node --check generated Vue module files
  frontend_test: node --test generated feature test file
