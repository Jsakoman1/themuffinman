kind: dora_codex_context_packet
version: 1
task:
  id: record-item
  observable_outcome: A confirmed item record can be prepared for implementation.
allowed_paths: [backend/src/main/java/example/items/ItemService.java, frontend/src/features/items/item-api.js]
confirmed:
  product: [first-user-problem]
  domain: [item-record]
  permissions: [household-owner-write]
  workflows: [item-lifecycle]
  conventions: [spring-vue-postgres-profile]
dependencies: [define-item-contract]
validation: ruby test/item_service_test.rb
proof_obligations:
  - {id: item-unit, evidence_class: unit, status: required, boundary: A unit test remains project-owned proof.}
  - {id: item-runtime, evidence_class: browser_runtime, status: unresolved, boundary: Browser execution requires a separately approved project-owned scenario.}
citations:
  - {id: product, path: docs/product-brief.yaml, reason: Confirmed user problem.}
  - {id: domain, path: docs/domain-library.yaml, reason: Confirmed domain and workflow rules.}
  - {id: conventions, path: .dora/project-convention-profile.yaml, reason: Declared technical conventions.}
  - {id: work, path: docs/work/item.yaml, reason: Selected bounded task.}
omitted: [undeclared-repository-files, product-inference, completion-conclusion]
completion_boundary: A context packet is read-only planning and implementation guidance; it does not start work, write source, approve a change, or prove completion.
