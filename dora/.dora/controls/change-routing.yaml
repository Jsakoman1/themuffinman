kind: dora_change_routing
version: 1
rules:
- id: work-artifact-audit
  path_prefixes:
  - lib/dora/work_artifact_
  - test/work_artifact_
  tool_ids: [work-artifact-audit, work-artifact-schema]
- id: implementation-session
  path_prefixes: [lib/dora/agent_session.rb, lib/dora/agent_context.rb, test/agent_session_]
  tool_ids: [agent-session]
- id: granular-routing
  path_prefixes: [lib/dora/change_routing.rb, lib/dora/tool_selection_commands.rb, lib/dora/tool_catalog.rb, test/change_routing_test.rb, test/tool_selection_commands_test.rb]
  tool_ids: [routing]
- id: bridge-mcp
  path_prefixes: [bridge/]
  tool_ids: [bridge-mcp]
- id: idc-v0
  path_prefixes: [idc/, lib/dora/idc_, test/idc_]
  tool_ids: [control-check]
- id: plugin-contract
  path_prefixes: [lib/dora/plugin_, test/plugin_]
  tool_ids: [plugin-contract]
- id: self-project-controls
  path_prefixes:
  - .dora/
  - docs/
  - AGENTS.md
  tool_ids: [control-check]
