kind: dora_tool_catalog
version: 1
commands:
- id: control-check
  target: bin/dora doctor .dora/project.yaml
  purpose: Validate Dora's self-project controls and canonical knowledge.
  preconditions:
  - Dora self-project controls are present.
  expected_cost: short
- id: work-artifact-audit
  target: ruby test/work_artifact_audit_test.rb
  purpose: Validate read-only work-artifact classification.
  preconditions: [Dora work artifacts are available.]
  expected_cost: short
- id: agent-session
  target: ruby test/agent_session_test.rb
  purpose: Validate bounded read-only implementation-session output.
  preconditions: [Dora agent-session sources are available.]
  expected_cost: short
- id: routing
  target: ruby test/change_routing_test.rb
  purpose: Validate deterministic advisory change routing.
  preconditions: [Dora change-routing controls are available.]
  expected_cost: short
- id: bridge-mcp
  target: ruby bridge/test/mcp_server_test.rb
  purpose: Validate the sanitized Bridge MCP boundary.
  preconditions: [Bridge test fixtures are available.]
  expected_cost: medium
- id: plugin-contract
  target: ruby test/plugin_contract_test.rb
  purpose: Validate static plugin contract compatibility.
  preconditions: [Plugin contract fixtures are available.]
  expected_cost: short
- id: work-artifact-schema
  target: ruby test/work_artifact_schema_test.rb
  purpose: Validate work-artifact schema structure.
  preconditions: [Work-artifact schema fixtures are available.]
  expected_cost: short
