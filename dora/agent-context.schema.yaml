kind: dora_agent_context_schema
version: 1
purpose: Produce a bounded cited context pack for one declared work item from project-owned knowledge only.
required_inputs: [project_root, work_plan, task_id]
output_fields: [task, knowledge, citations, omitted]
invariants:
  - Context includes only the selected task and declared project knowledge artifacts.
  - Every included section names its project-relative source path.
  - Missing declared knowledge or task context fails closed; Dora does not infer product rules.
  - The pack is advisory context, not evidence of implementation or completion.
