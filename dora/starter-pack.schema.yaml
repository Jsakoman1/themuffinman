kind: dora_schema
version: 1
id: starter-pack
description: Declares a technical project skeleton without product-domain behavior.
required: [kind, version, id, technical_only, commands, directories, files, boundaries]
properties:
  kind: {const: dora_starter_pack}
  version: {const: 1}
  id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
  technical_only: {const: true}
  commands:
    type: object
    required: [setup, test, build]
  directories: {type: array}
  files: {type: object}
  boundaries:
    type: array
    description: Explicit exclusions such as product domains, authentication, and data schemas.
