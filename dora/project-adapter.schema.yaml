kind: dora_project_adapter_schema
version: 1
purpose: Define the project-owned inputs Dora may use without embedding application-specific paths, commands, registries, or runtime behavior in Dora core.
adapter_required_fields:
  - kind
  - version
  - project
  - paths
  - commands
  - extensions
project:
  required_fields: [id, root]
  rules:
    id: Stable project identifier owned by the consuming application.
    root: Relative path from the adapter file to the consuming project root.
paths:
  required_fields: [docs, work_plans, audit_output, runtime_evidence]
  rules:
    docs: Project-owned canonical documentation root relative to project.root.
    work_plans: Project-owned executable work-plan directory relative to project.root.
    audit_output: Disposable project-owned audit output directory relative to project.root.
    runtime_evidence: Project-owned retained runtime evidence directory relative to project.root.
commands:
  required_fields: [work_start, work_verify, control_check]
  rules:
    work_start: Project command that starts one serial work item.
    work_verify: Project command that verifies one selected work item.
    control_check: Project command that runs the compact retained control check.
project_context:
  default_generated_output_paths: [audit_output, runtime_evidence]
  rules:
    generated_output_paths: Optional project-owned path keys that Dora may treat as disposable or retained generated output. Values must reference declared paths.
  invariants:
    - ProjectContext exposes only the declared roots, commands, extension count, and generated-output roots.
    - ProjectContext rejects undeclared path and command access.
extensions:
  item_required_fields: [id, category, paths, invocation]
  allowed_categories: [audit, documentation, runtime, build, product_contract]
  rules:
    paths: Explicit project-owned implementation or evidence paths; Dora never derives product paths from an extension id.
    invocation: Project-owned command or entry point; Dora records it but does not infer completion from it.
invariants:
  - Adapter paths are relative and resolve inside project.root.
  - Dora core receives no product-domain, route, entity, capability, credential, or deployment rule through this schema.
  - Product extension commands and their evidence remain owned by the consuming project.
  - The adapter does not make capability, implementation, runtime, or release status claims.
