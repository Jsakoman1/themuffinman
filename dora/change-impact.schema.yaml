kind: dora_change_impact_schema
version: 1
purpose: Let a consuming project declare which validation, documentation, runtime-evidence, and decision obligations each changed path affects.
rule_required_fields: [id, path_prefixes, validations, documentation, runtime_evidence, decisions]
report_fields: [path_impacts, validations, documentation, runtime_evidence, decisions, unmatched_paths]
invariants:
  - Rules are project-owned declarations; Dora does not infer product impact from source names.
  - Output separates required validation, documentation, runtime evidence, and decision review.
  - An unmatched path is an explicit gap for project review, never a completion or safety conclusion.
