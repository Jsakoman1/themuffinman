kind: dora_release_handoff
version: 1
status: awaiting_external_approval
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v0.9.0
  immutable_commit: pending_external_release
  source_parent_commit: pending_release_commit
consumption:
  project: muffinman
  method: git_subtree
  subtree_prefix: dora
  status: release_published_unpinned
  pinned_ref: pending_external_release
  pinned_commit: pending_external_release
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan may pin only the reachable immutable Dora v0.9.0 tag commit after its reviewed release handoff is published.
approval:
  approved_by: user
  approved_at: 2026-08-05
  scope: Publish Dora v0.9.0, create its immutable tag, and then pin MuffinMan to the reviewed release commit.
preservation:
  - MuffinMan retains product code, product documentation, work plans, runtime evidence, adapters, and product authority.
  - Dora v0.9.0 exports only dora package paths and retains no MuffinMan business rules, provider credentials, runtime evidence, or product mutation adapters.
  - The release tag must resolve before the MuffinMan adapter pin changes.
rollback:
  - Before the adapter pin, MuffinMan remains on its v0.8.0 pin.
  - After the adapter pin, revert only the dedicated v0.9.0 pin commit to restore v0.8.0.
verification:
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --check-handoff-draft --handoff docs/dora-release-handoff-v09.yaml --expected-version v0.9.0
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v09.yaml --expected-version v0.9.0
