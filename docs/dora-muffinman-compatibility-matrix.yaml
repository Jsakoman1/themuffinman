kind: dora_muffinman_compatibility_matrix
version: 1
status: active
purpose: Define retained MuffinMan root work commands that execute through Dora without changing MuffinMan-owned evidence locations.
adapter: .dora/project.yaml
fixture_trace: ruby dora/test/work_execution_test.rb
entries:
  - target: work-start
    dora_executor: dora/bin/dora work-start .dora/project.yaml plan="$(plan)" task="$(task)"
    evidence_paths: [docs/work, docs/work/dora-muffinman-separation-execution-inventory.yaml]
    proof: A successful serial start invokes the Dora executor through the MuffinMan adapter and preserves the existing start snapshot and inventory mutation behavior.
  - target: work-verify
    dora_executor: dora/bin/dora work-verify .dora/project.yaml plan="$(plan)" task="$(task)"
    evidence_paths: [docs/work]
    proof: A successful verification invokes the Dora executor through the MuffinMan adapter and preserves verifier-generated task evidence in the selected work plan.
invariants:
  - Dora command dispatch is fail-closed and uses the project adapter before work-plan state changes.
  - Dora does not create or relocate MuffinMan verification evidence.
  - Product-specific audit, runtime, and capability evidence remains outside this compatibility surface.
