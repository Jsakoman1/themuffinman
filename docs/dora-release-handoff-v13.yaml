kind: dora_release_handoff
version: 1
status: published
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v1.3.0
  immutable_commit: 081720706752f72988fa7dd564947a603da5a849
  source_parent_commit: 7c805a2dbec030391574c3b8808556611d306d03
consumption:
  project: muffinman
  method: git_subtree
  subtree_prefix: dora
  status: pinned
  pinned_ref: v1.3.0
  pinned_commit: 081720706752f72988fa7dd564947a603da5a849
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan may pin only the reachable immutable Dora v1.3.0 tag commit after this reviewed release handoff is published.
approval:
  approved_by: user
  approved_at: 2026-08-05
  scope: Publish Dora v1.3.0, create its immutable tag, and then pin MuffinMan to the reviewed release commit.
preservation:
  - MuffinMan retains product code, product documentation, work plans, runtime evidence, adapters, and product authority.
  - Dora v1.3.0 exports only Dora-owned package paths and retains no MuffinMan business rules, credentials, runtime evidence, or product mutation adapters.
  - The release tag resolves before the MuffinMan adapter pin changes.
rollback:
  - Before the adapter pin, MuffinMan remains on its v1.2.0 pin.
  - After the adapter pin, revert only the dedicated v1.3.0 pin commit to restore v1.2.0.
verification:
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --check-handoff-draft --handoff docs/dora-release-handoff-v13.yaml --expected-version v1.3.0
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v13.yaml --expected-version v1.3.0
