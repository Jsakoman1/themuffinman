kind: dora_release_handoff
version: 1
status: published
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v0.8.0
  immutable_commit: 1a51c379487b939b7ed01b422cf4bb90f5f09d13
  source_parent_commit: d6ac8d57cd4a7c019cdf16fba12e2989cb972693
consumption:
  project: muffinman
  method: git_subtree
  subtree_prefix: dora
  status: pinned
  pinned_ref: v0.8.0
  pinned_commit: 1a51c379487b939b7ed01b422cf4bb90f5f09d13
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan is pinned to reachable immutable Dora v0.8.0 tag commit 1a51c379487b939b7ed01b422cf4bb90f5f09d13; future upgrades require a new reviewed handoff and separate pin commit.
approval:
  approved_by: user
  approved_at: 2026-08-05
  scope: Publish Dora v0.8.0, create its immutable tag, and then pin MuffinMan to the reviewed release commit.
preservation:
  - MuffinMan retains product code, product documentation, work plans, runtime evidence, adapters, and product authority.
  - Dora v0.8.0 exports only dora package paths and retains no MuffinMan business rules.
  - The release tag must resolve before the MuffinMan adapter pin changes.
rollback:
  - Before the adapter pin, MuffinMan remains on its v0.7.1 pin.
  - After the adapter pin, revert only the dedicated v0.8.0 pin commit to restore v0.7.1.
verification:
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --check-handoff-draft --handoff docs/dora-release-handoff-v08.yaml --expected-version v0.8.0
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v08.yaml --expected-version v0.8.0
