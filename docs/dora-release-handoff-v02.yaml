kind: dora_release_handoff
version: 1
status: published
approved_by: user
approved_at: 2026-08-05
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v0.2.0
  immutable_commit: cb6eb3163aac80add33f6afa473b0752ff471c65
  source_parent_commit: 0b4c7b60e74c3147925ff973ec86473a81897131
consumption:
  project: muffinman
  method: git_subtree
  subtree_prefix: dora
  pinned_ref: v0.2.0
  pinned_commit: cb6eb3163aac80add33f6afa473b0752ff471c65
  status: pinned
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan records the reviewed immutable Dora v0.2.0 commit in its adapter; future updates remain separate, reviewable subtree pin commits.
preservation:
  - MuffinMan remains the owner of application source, product documentation, work plans, runtime evidence, and .dora/project.yaml.
  - Dora export contains only dora/ package paths; no source-repository product path is deleted or rewritten.
rollback:
  - Dora v0.2.0 was exported from the reviewed MuffinMan commit; the following MuffinMan pin update remains separate and reversible.
  - Revert the separate MuffinMan subtree update to return to v0.1.0 if v0.2.0 is unsuitable.
verification:
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v02.yaml --expected-version v0.2.0
  - ruby scripts/audits/audit-dora-muffinman-compatibility.rb
