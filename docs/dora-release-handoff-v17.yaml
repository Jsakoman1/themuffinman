kind: dora_release_handoff
version: 1
status: published
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v1.7.0
  immutable_commit: ef26f5af2b92ff199aa3393006b79e437e5a0920
  source_parent_commit: e68cfc3f5d1c3f8a99a8e627b9d09b7baf86382d
consumption:
  project: muffinman
  method: git_subtree
  status: pinned
  pinned_ref: v1.7.0
  pinned_commit: ef26f5af2b92ff199aa3393006b79e437e5a0920
  subtree_prefix: dora
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan may pin only the reachable immutable Dora v1.7.0 tag commit after this reviewed release handoff is published.
approval:
  approved_by: user
  approved_at: 2026-08-06
  scope: Publish Dora v1.7.0, create its immutable tag, and then pin MuffinMan to the reviewed release commit.
preservation:
  - MuffinMan retains product code, product documentation, work plans, runtime evidence, adapters, and product authority.
  - Dora v1.7.0 exports only Dora-owned package paths and retains no MuffinMan business rules, credentials, real data, runtime evidence, or product mutation adapters.
  - The Codex acceleration route supplies only explicit guidance, declarations, local diagnostics, and generated traces; it does not claim consumer implementation, runtime, security, acceptance, or release proof.
  - The release tag resolves before the MuffinMan adapter pin changes.
rollback:
  - Before the adapter pin, MuffinMan remains on its v1.6.0 pin.
  - After the adapter pin, revert only the dedicated v1.7.0 pin commit to restore v1.6.0.
verification:
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v17.yaml --expected-version v1.7.0
