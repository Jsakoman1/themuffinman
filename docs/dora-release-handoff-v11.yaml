kind: dora_release_handoff
version: 1
status: published
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v1.1.0
  immutable_commit: e0123b86aa24a3dc0911b7f6a055f32bbec51999
  source_parent_commit: 558fad116a3a953c6d984a667f45dd16d0f8e869
consumption:
  project: muffinman
  method: git_subtree
  subtree_prefix: dora
  status: pinned
  pinned_ref: v1.1.0
  pinned_commit: e0123b86aa24a3dc0911b7f6a055f32bbec51999
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan may pin only the reachable immutable Dora v1.1.0 tag commit after this reviewed release handoff is published.
approval:
  approved_by: user
  approved_at: 2026-08-05
  scope: Publish Dora v1.1.0, create its immutable tag, and then pin MuffinMan to the reviewed release commit.
preservation:
  - MuffinMan retains product code, product documentation, work plans, runtime evidence, adapters, and product authority.
  - Dora v1.1.0 exports only Dora-owned package paths and retains no MuffinMan business rules, credentials, runtime evidence, or product mutation adapters.
  - The release tag must resolve before the MuffinMan adapter pin changes.
rollback:
  - Before the adapter pin, MuffinMan remains on its v1.0.0 pin.
  - After the adapter pin, revert only the dedicated v1.1.0 pin commit to restore v1.0.0.
verification:
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --check-handoff-draft --handoff docs/dora-release-handoff-v11.yaml --expected-version v1.1.0
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v11.yaml --expected-version v1.1.0
