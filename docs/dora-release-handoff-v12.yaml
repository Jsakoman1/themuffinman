kind: dora_release_handoff
version: 1
status: published
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v1.2.0
  immutable_commit: a708be9deb63985d2288df34ad1f679b7e0137c4
  source_parent_commit: c3dc9e050f288ae07024c677e749ab0244846b7c
consumption:
  project: muffinman
  method: git_subtree
  subtree_prefix: dora
  status: release_published_unpinned
  pinned_ref: pending_external_release
  pinned_commit: pending_external_release
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan may pin only the reachable immutable Dora v1.2.0 tag commit after this reviewed release handoff is published.
approval:
  approved_by: user
  approved_at: 2026-08-05
  scope: Publish Dora v1.2.0, create its immutable tag, and then pin MuffinMan to the reviewed release commit.
preservation:
  - MuffinMan retains product code, product documentation, work plans, runtime evidence, adapters, and product authority.
  - Dora v1.2.0 exports only Dora-owned package paths and retains no MuffinMan business rules, credentials, runtime evidence, or product mutation adapters.
  - The release tag must resolve before the MuffinMan adapter pin changes.
rollback:
  - Before the adapter pin, MuffinMan remains on its v1.1.0 pin.
  - After the adapter pin, revert only the dedicated v1.2.0 pin commit to restore v1.1.0.
verification:
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --check-handoff-draft --handoff docs/dora-release-handoff-v12.yaml --expected-version v1.2.0
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v12.yaml --expected-version v1.2.0
