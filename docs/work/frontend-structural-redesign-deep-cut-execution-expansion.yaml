title: Convert deep-cut outcome matrix into executable atomic plans
status: verified
master_plan: docs/work/frontend-structural-redesign-master.yaml
baseline: dcb983f4ad2b0354101caa8c1cdc47c624fb8b71
strict_verification: true
serial_task_execution: true
execution_inventory: docs/work/frontend-structural-redesign-execution-inventory.yaml
purpose: Replace broad child-plan tasks with the 57 deep-cut outcome units without
  keeping parent and child tasks as competing completion claims.
queue_review: 2026-07-24-queue-integrated
source_matrix: docs/work/frontend-structural-redesign-deep-cut-atomization.yaml
conversion_rules:
- Every source outcome becomes one executable task or is explicitly merged with a
  documented reason.
- Every executable task receives exact implementation paths, dependencies, a leaf
  validation, evidence boundary, and runtime requirement where applicable.
- Parent tasks are removed from the active child plan when their outcome is replaced
  by child tasks; they are not marked done as a shortcut.
- Existing verified baseline plans remain baseline-only and are not reopened unless
  the new task changes their contract.
- The execution inventory is regenerated only after all child-plan mappings and dependency
  order pass the structural audit.
- No task may close on a screenshot, a type-check alone, or an unchanged pre-existing
  artifact.
