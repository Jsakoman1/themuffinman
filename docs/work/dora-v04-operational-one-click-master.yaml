principles:
- A generated project must invoke Dora from its own checkout without PATH assumptions.
- Dora never executes undeclared project commands or infers product completion.
- Cleanup stays policy-bound, dry-run-first, and explicit.
- Stack-specific logic enters Dora only as an optional plugin after classification.
