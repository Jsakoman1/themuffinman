outcomes:
  - Capability package links intent, vocabulary, permissions, workflow, API boundary, tests, and runtime scenario.
  - Readiness engine reports exact blockers, contradictions, and recommended next action.
  - One ready atomic plan can be generated only when declared prerequisites are present.
boundaries:
  - Readiness is not a completion claim or authorization to bypass review.
  - Missing product policy remains unresolved rather than receiving a generated default.
