execution_inventory: docs/work/dora-v15-application-authoring-execution-inventory.yaml
atomic_task_hardening_plan: docs/work/dora-v15-atomic-hardening.yaml
strict_verification: true
serial_task_execution: true
atomic_task_contract:
  required_fields:
  - observable_outcome
  - dependencies
  - required_paths
  - evidence_boundary
  - validation
  execution_rule: Start exactly one inventory item only after its direct predecessor
    is verifier-marked verified.
  generation_rule: Generation tasks require confirmed inputs, preview, non-overwrite
    protection, and explicit review boundaries.
preflight_source: docs/work/dora-v15-application-authoring-preflight.md
goal_readiness_source: docs/work/dora-v15-application-authoring-goal-readiness.md
completion_boundary: Verified v1.5 work proves only the declared Dora control surfaces
  and their bounded local tests. It does not prove a consumer product, install packages,
  start a database, run a browser, publish a release, or deploy software.
