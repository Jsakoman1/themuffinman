out_of_scope:
- product feature behavior unrelated to local tooling
- native or production infrastructure implementation
- replacing System Map, capability inventories, runtime matrix, or verifier authorities
- claiming Chromium runtime proof without a live runtime environment
success_measures:
- every retained local tool has a current reference and a clear operational purpose
- AST and repository map checks expose parse failures instead of silently degrading
- search/context commands have bounded output and useful canonical-source navigation
- stale tool assumptions fail in self-test before they reach broad implementation
  work
- generated audit and map output is removed automatically at closeout
- final control check, self-test, backend tests, frontend type-check, and build pass
