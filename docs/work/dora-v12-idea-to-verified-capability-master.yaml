kind: master
version: 1
id: dora-v12-idea-to-verified-capability-master
title: Make Dora take Codex from a reviewed idea to a verified first capability with minimal setup
status: draft
implementation_ready: true
baseline: 470b6e9
target_release: v1.2.0
objective: >-
  Make the safe path from an idea to a first verified capability substantially easier for a beginner and Codex,
  while retaining declared product ownership, deterministic readiness, evidence boundaries, and explicit approval gates.
analysis_source: docs/work/dora-v12-idea-to-verified-capability-analysis.md
preflight_source: docs/work/dora-v12-idea-to-verified-capability-preflight.md
goal_readiness_source: docs/work/dora-v12-idea-to-verified-capability-goal-readiness.md
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plan: docs/work/dora-v11-codex-first-ergonomics-master.yaml
  baseline_only_surfaces:
    - self-contained Dora source, project creation, agent session, command envelopes, traceability, leases, plugin policy, safe upgrade, and opt-in Codex guidance
  non_duplication_rule: >-
    v1.2 reuses v1.1 control mechanics and changes only the setup friction, readiness precision,
    generated capability package, neutral technical packs, and evidence navigation needed for the new path.
  residual_scope:
    - Guided project creation still requires users or Codex to compose several YAML inputs manually.
    - Dora has no deterministic capability-readiness or domain-contradiction compiler.
    - Codex integration is library-only rather than a discoverable command, and startup guidance remains fragmented.
    - Existing stack packs and plugin boundaries need neutral catalog selection and more precise declared read evidence.
    - Capability trace does not yet connect a verified task, changed paths, evidence artifacts, and a release revision.
  retest_triggers:
    - Changed project creation, intake, generated knowledge, or Git baseline behavior.
    - Changed capability, domain, permission, workflow, readiness, or agent-session contracts.
    - Changed starter pack, plugin execution/report, or integration ownership behavior.
    - Changed trace, evidence, release handoff, compatibility, or pin behavior.
principles:
  - Dora asks for and records product decisions; it never invents them.
  - A generated artifact is declared starting context, not implementation or release proof.
  - Every command exposes citations, side effects, omissions, and remediation in stable machine-readable form.
  - Generated Dora-owned content is idempotent and never overwrites user-owned instructions or code.
  - Domain, permission, workflow, API, test, and runtime evidence links must be checked for contradictions before work is marked ready.
  - Technical stack packs are neutral, optional, independently proven, and separate from product logic.
workstreams:
  - docs/work/dora-v12-guided-intake-scope.yaml
  - docs/work/dora-v12-capability-readiness-scope.yaml
  - docs/work/dora-v12-codex-experience-scope.yaml
  - docs/work/dora-v12-neutral-stack-and-plugin-scope.yaml
  - docs/work/dora-v12-evidence-and-release-scope.yaml
children:
