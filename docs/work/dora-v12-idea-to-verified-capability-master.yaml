  - docs/work/dora-v12-evidence-and-release.yaml
execution_inventory: docs/work/dora-v12-idea-to-verified-capability-execution-inventory.yaml
atomic_task_hardening_plan: docs/work/dora-v12-atomic-hardening.yaml
strict_verification: true
serial_task_execution: true
required_before_goal_pursuit:
  - Define the interview answer provenance, unanswered-decision representation, and no-inference boundary.
  - Define a single generated project bundle and its exact ownership/overwrite behavior.
  - Define readiness blockers and contradiction rules before generating implementation work.
  - Define capability-package references from intent through runtime evidence without a completion claim.
  - Select no more than two neutral stack packs for the first slice and require independent consumers.
  - Create hardened atomic child plans, one global serial inventory, exact paths, leaf validations, and evidence boundaries.
success_criteria:
  - A beginner or Codex can create a neutral project and a first capability package from a declared interview without hand-authoring boilerplate YAML.
  - Dora reports precise missing decisions, contradictions, and next actions before implementation begins.
  - Codex can receive a compact cited startup session and one ready atomic task without repository inference.
  - Generated project guidance preserves distinct user-owned instructions across independent consumers.
  - A capability trace connects intent, permissions, workflow, implementation plan, tests, and runtime evidence while retaining unresolved gaps.
  - Selected neutral stack packs and safer plugin controls are independently proven without MuffinMan data.
  - v1.2 is published and pinned only after explicit approval and full compatibility proof.
release_boundary:
  - No remote publication, tag, consumer pin, or destructive migration may occur without explicit user approval.
  - Draft planning and local validation do not authorize implementation beyond a started atomic work task.
readiness:
