scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
    - docs/work/dora-v09-codex-delivery-acceleration-master.yaml
    - docs/work/dora-v08-agent-first-operating-system-master.yaml
  baseline_only_surfaces:
    - v0.9 task context, next-step, closeout, status, finding, impact, cache, voice evaluation, and release mechanics
  residual_scope:
    - one beginner and Codex entrypoint over existing neutral contracts
    - complete and documented public agent command surface
    - integrated evidence and cache workflow
    - verified source consumption and upgrade lifecycle
  retest_triggers:
    - changed public Dora CLI command or registry
    - changed project knowledge or change-impact schema
    - changed plugin report, finding, or cache key contract
    - changed bootstrap source verification or upgrade behavior
    - changed release, external export, or consumer pin boundary
  non_duplication_rule: >-
    v0.9 proves individual portable mechanics; v1.0 must prove their coherent public
    workflow and independent consumer lifecycle rather than repeat individual fixtures.
principles:
  - Dora generates neutral structure and deterministic guidance only from declared project inputs.
  - Product requirements, domain rules, permissions, runtime authority, and acceptance remain consumer-owned.
  - Every user-visible command has a documented input contract, machine-readable output contract, and independent fixture.
  - Findings, status, cache, and exports are diagnostic or advisory until a project verifier records evidence.
  - Network source acquisition, release publication, and consumer pinning require explicit approval and immutable references.
workstreams:
  - docs/work/dora-v10-entrypoint-and-project-memory-scope.yaml
  - docs/work/dora-v10-agent-command-surface-scope.yaml
  - docs/work/dora-v10-evidence-pipeline-scope.yaml
  - docs/work/dora-v10-distribution-lifecycle-scope.yaml
children:
  - docs/work/dora-v10-atomic-hardening.yaml
