objective: >-
  Make Dora one-click ready for an explicit idea-to-verified-work path while preserving
  project ownership of product meaning, runtime authority, and external approval.
analysis_source: docs/work/dora-v10-one-click-agent-operating-system-analysis.md
preflight_source: docs/work/dora-v10-one-click-agent-operating-system-preflight.md
