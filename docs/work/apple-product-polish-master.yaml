evidence_requirements:
- Fresh API/unit/integration evidence for Work scope isolation and calendar range/view
  contracts.
- Fresh desktop and mobile browser evidence for Home, Work, Calendar, Business, Vision,
  drawers, keyboard focus, and responsive overflow.
- Fresh visual screenshots for day/week/month Calendar and the shared Apple interaction
  grammar.
- Fresh recovery evidence for route refresh, back/forward, scope switching, stale
  data, failed mutation retry, and calendar empty/error states.
- Full backend/frontend tests, contract generation, design-system audits, docs/truth
  audits, and strict master verification.
closeout_gates:
- Atomic hardening is verified before any child implementation starts.
- Leaf expansion audit passes for all 35 inventory parents before any implementation
  parent can close.
- Every child task has exact required paths, one observable outcome, dependencies,
  leaf validation, and an evidence boundary.
- No task is marked complete from source inspection or screenshots alone when runtime
  behavior is required.
- Work scope traces prove all three scopes independently from direct route entry,
  tab switching, refresh, and back/forward.
- Calendar traces prove day/week/month range transitions, source filters, all-module
  aggregation, and per-business isolation.
- Full `make work-verify plan=docs/work/apple-product-polish-master.yaml` passes.
- System Map review artifact is retained and every new finding is either mapped to
  an atomic task or explicitly preserved as an external/deferred boundary.
- Deep atomization review items A01–K03 are all mapped to an inventory item or have
  a documented baseline-only/external disposition before goal pursuing.
- The machine-readable deep-cut matrix passes its dedicated audit and remains in the
  hardening task required paths.
- The Apple desktop reference contract is directly linked, reviewed, and used as the
  acceptance vocabulary for shell, module, command, search, editor, settings, Calendar,
  and Vision work.
- The mental-model contract is explicit: overview first, detail on demand, bounded
    collections, lightweight Settings, and browse/inspect/edit/review/return flows
    are mapped before implementation.
- System behavior is explicit: reversible mutations, drafts, history, urgency, deep
    links, capabilities, previews, collaboration, consent, and platform boundaries
    are mapped before implementation.
- Every parent implementation/runtime task is expanded into leaf execution gates for
  contract, authority, primitive, surface, negative states, and evidence cleanup before
  goal pursuing.
- Existing verified baseline evidence and external/provider boundaries are preserved
  and not relabeled as new proof.
