    evidence from commit 2176d92.
  - Existing backend permissions, ownership rules, booking rules, calendar source
    services, and generated client contracts unless a listed task changes their contract.
  residual_scope:
  - Make the ten Apple product improvements concrete across the shared Web workspace
    without introducing a second design system.
  - Fix the Home/Work scope contamination where Find work and My work show the wrong
    dataset until My applications is visited.
  - Add a genuine Apple Calendar-style day/week/month view model while preserving
    agenda as the mobile default and retaining all-module aggregation.
  - Prove state isolation, calendar view correctness, responsive behavior, keyboard
    behavior, and recovery with fresh evidence.
  retest_triggers:
  - Any change to shell navigation, Home data loading, Work scope/query presets, route/tab
    registry, calendar DTOs, calendar source aggregation, or shared preview/drawer
    primitives.
  - Any change to assistant anchoring, global tokens, breakpoints, focus handling,
    or module-level action grammar.
  - Any removal of a route, duplicate component, local CSS rule, or compatibility
    adapter.
  non_duplication_rule: Prior verified redesign evidence is baseline only; this master
    counts only the new scope-isolation, Calendar-view, Apple-polish, and closeout
    evidence.
design_contract:
  primary_reference: docs/apple-desktop-design-reference.md
  supporting_reference: Apple Human Interface Guidelines adapted for responsive Web
  reference_sources:
  - https://developer.apple.com/design/human-interface-guidelines/design-principles
  - https://developer.apple.com/design/human-interface-guidelines/color
  - https://developer.apple.com/design/human-interface-guidelines/typography
  - https://developer.apple.com/design/human-interface-guidelines/materials
  - https://developer.apple.com/design/human-interface-guidelines/sidebars
  - https://developer.apple.com/design/human-interface-guidelines/split-views
  - https://developer.apple.com/design/human-interface-guidelines/sheets
  - https://developer.apple.com/design/human-interface-guidelines/popovers
  principles:
  - Clarity before density.
  - One visual starting point and one primary action per surface.
  - Stable labeled navigation; tabs only switch sibling views.
  - Progressive disclosure through previews, drawers, and sheets.
  - Calm surfaces, restrained color, generous spacing, predictable focus, and reversible
    actions.
  - Backend-owned domain behavior; frontend owns presentation state only.
  prohibited_patterns:
  - Same dataset rendered under different Work scope labels.
  - Route transitions that mutate hidden scope state as an accidental side effect.
  - Full-page detail navigation when an adjacent preview is sufficient.
  - Page-local CSS grammar when a shared token or primitive can express the behavior.
  - A calendar toolbar that cannot explain the active range, source filters, or selected
    view.
visual_language_contract:
  identity: Apple-inspired product family language for Web, designed as a portable
    foundation for future Swift iPhone and Apple Watch clients; never copy Apple trademarks,
    proprietary assets, SF Symbols files, or exact product screens.
  color:
  - Use semantic design tokens for canvas, elevated surface, grouped surface, sidebar
    material, primary label, secondary label, tertiary label, separator, accent, success,
    warning, and destructive states.
  - Support light and dark appearance through paired tokens and contrast-tested values;
    do not hardcode a single theme into component CSS.
  - Keep most surfaces neutral. Reserve accent color for selection, primary actions,
    links, focus, and meaningful status; never use color as the only state signal.
  - Use one accent family across the shell, with business/source colors limited to
    calendar event identity and always paired with labels or icons.
  - Never assign a fixed rainbow color to every sidebar item or module merely for
    decoration.
  typography:
  - Use one system-first font stack (`-apple-system`, `BlinkMacSystemFont`, `Segoe
    UI`, sans-serif) with no bundled proprietary system font.
  - Define a small type ramp: large page title, section title, body, secondary body,
      caption, and control label.
  - Let weight, size, line height, grouping, and whitespace communicate hierarchy
    before borders or color.
  - Keep labels short and human; move technical IDs, raw statuses, and advanced options
    into progressive detail.
  surfaces_and_materials:
  - Separate the content layer from the functional layer: the page canvas and content
      remain calm/opaque, while navigation, sidebar, toolbar, popover, and assistant
      may use a restrained translucent material.
  - Use `backdrop-filter` only on functional overlays with an opaque fallback, never
    as a universal card treatment.
  - Use regular/thicker surfaces for readable sidebars and dense text, thinner material
    for compact controls, and no glass effect on every content row.
  - Use subtle radius, separator, shadow, and blur tokens; avoid ornamental gradients,
    neon glow, excessive elevation, and stacked glass panels.
  layout_and_effects:
  - Center the primary content with a readable max width and consistent horizontal
    rhythm.
  - Desktop uses a floating/collapsible sidebar plus split-view list/detail where
    appropriate; mobile transforms the sidebar into a labeled tab bar or sheet.
  - Effects are short, quiet, reversible, and purposeful: selection highlight, sheet
      movement, preview transition, focus ring, and loading shimmer only.
  - Every effect has a reduced-motion alternative and never delays an action or hides
    a state change.
  controls_and_flow:
  - Prefer labeled tabs for sibling views, segmented controls for small mutually exclusive
    modes, checkmarks for selection, chevrons for hierarchy, and popovers/sheets for
    bounded choices.
  - Use one primary action per surface; secondary actions are quiet and destructive
    actions are separated and explicit.
  - Replace long forms with a step-based flow: orient, choose one thing, review the
      consequence, confirm, and provide a clear completion state.
  - Preserve drafts when a sheet/popover closes accidentally; only explicit Cancel
    discards work.
  inspiration_mapping:
  - Notes: sidebar/list/detail hierarchy, folders/tags as secondary context, clean
      editor focus.
  - Reminders: grouped lists, visible completion state, simple add flow, progressive
      detail.
  - Calendar: calm range navigation, day/week/month hierarchy, event popover, source
      identity, Today anchor.
  - Finder: sidebar context, split view, selected-row continuity, predictable disclosure.
  - Mail and Messages: list/detail continuity, unread/attention hierarchy, context-preserving
      composer.
  - Safari: compact contextual toolbar, clear current location/context, minimal chrome
      around content.
  - Siri: quiet persistent input, visible listening/thinking/result state, concise
      response, explicit confirmation.
  - These are interaction references only; do not reproduce product names, icons,
    copy, layouts, or proprietary assets.
multi_business_context:
  required_behavior:
  - A user with one or many businesses has one global context switcher available from
    the shell and business workspace.
  - The switcher includes Personal, All businesses, Favorites, and each owned business
    with name, compact identity, and active state.
  - Switching business changes the backend context/read-model query and URL together;
    it never filters only the already-loaded frontend array.
  - Every owned business has a stable direct route and deep link; switching between
    three or more businesses is one deliberate selection with no nested settings detour.
  - All businesses is an explicit aggregate context, never an accidental default caused
    by missing business id.
  - The active business remains visible in the header/sidebar and in Calendar, bookings,
    services, gallery, and profile editor.
  - Mobile uses a full-width sheet/picker with search only when the list is long;
    desktop uses a compact popover or sidebar section.
home_information_architecture:
  purpose: Home is the calm starting base for what matters now, not a dashboard containing
    every module.
  order:
  - Today: immediate actions and current state.
  - Next: nearest appointment, booking, ride, work item, or reminder.
  - Needs attention: only items requiring a decision.
  - Favorites: saved businesses, people, or recurring contexts.
  - Quick actions: a small set of high-frequency entry points.
  rules:
  - Each section has a clear label, one primary action, compact rows, and an honest
    empty state.
  - Information is collapsed by relevance, not hidden behind unexplained Dismiss/Show/Hide
    controls.
  - Home never renders raw module dumps, duplicate Work scopes, or statistics without
    an immediate action.
  - Details open in preview/sheet and preserve Home context.
cross_cutting_contracts:
  state_and_cache:
  - Every collection scope has one canonical query key containing route scope, filters,
    viewer context, and selected range; presentation selection cannot mutate the dataset
    query.
  - Route entry, tab selection, refresh, back/forward, and context switching invalidate
    or revalidate the correct read model explicitly.
  - Stale, loading, empty, forbidden, conflict, retryable failure, and success states
    retain the active scope/context label.
  command_palette:
  - Cmd/Ctrl+K opens one backend-prepared command/search palette for navigation, business
    switching, calendar range, creation handoffs, and Vision handoff.
  - The palette is a presentation entry point; backend-provided routes/actions remain
    authoritative and inaccessible actions are not shown as executable.
  preferences:
  - Persist default business/context, default Calendar view, week start, timezone/display
    preference, density, and reduced-motion preference through a portable preference
    contract.
  calendar_reliability:
  - Calendar reads use explicit timezone, locale, week-start, DST-safe range boundaries,
    all-day semantics, and currency/date formatting metadata.
  feedback_and_recovery:
  - Safe mutations expose inline confirmation and undo where supported; all mutations
    expose retry or recovery guidance without relying on ephemeral toasts.
  - Stale context, lost business access, deleted targets, and calendar source failures
    explain what changed and preserve a safe return path.
  accessibility:
  - Contrast, forced-colors, zoom, focus visibility, screen-reader names, live regions,
    semantic selected/current state, touch target size, and reduced motion are audited
    centrally.
  performance:
  - Large collections and calendar ranges use bounded reads, progressive loading,
    virtualization or pagination where needed, and measured perceived-load evidence.
  trust_and_privacy:
  - Business, Calendar, Circle, Ride, Thing, Wishlist, Profile, and Chat actions show
    relevant visibility/ownership context and explain disabled actions at the point
    of decision.
  localization:
  - Dates, times, week starts, timezones, currencies, plural labels, and relative
    time are formatted by shared portable helpers rather than page-local strings.
native_laptop_contract:
  product_feel: The authenticated Web should feel like a native Apple laptop app through
    stable frame, split views, sidebar context, keyboard commands, persistent selection,
    sheets/popovers, quiet transitions, and no unnecessary document reloads.
  required_surfaces:
  - Functional sidebar floats above or clearly separates from a calm content canvas
    and collapses at compact widths.
  - Desktop lists and details use split view where the task benefits from simultaneous
    context; the selected row remains visibly selected.
  - Sidebar and pane widths are bounded, keyboard-resizable or pointer-resizable where
    useful, and persisted as presentation preferences.
  - Cmd/Ctrl+K, safe shortcuts, context menus, and popovers share one backend-prepared
    command/action model.
  - Navigation feels app-like inside the shell; full document reloads, fake OS title
    bars, fake Finder chrome, and browser permission bypasses are prohibited.
  - Standalone/PWA behavior may improve launch continuity, but offline mutation, background
    execution, and device runtime remain explicit external boundaries until separately
    evidenced.
  - Drag/drop is allowed only when a backend capability and reversible recovery exist;
    it is not added as decoration.
  - Hover, pressed, selected, disabled, focus, reduced-motion, and forced-colors states
    are all deliberate and tested.
ten_improvements:
- id: global-navigation
  outcome: One calm global navigation hierarchy with compact desktop sidebar, mobile
    tab bar, stable back behavior, and no redundant header commands.
- id: progressive-disclosure
  outcome: Collections reveal the next useful decision first and expose advanced detail
    through one shared drawer, sheet, or preview pattern.
- id: calendar-view
  outcome: Calendar supports Apple-like day, week, and month views with arrows, Today,
    source/business filters, event previews, and all-module aggregation.
- id: interaction-language
  outcome: Buttons, tabs, forms, dialogs, loading, empty, error, success, and confirmation
    states use one shared interaction vocabulary.
- id: vision-composer
  outcome: VisionForWeb behaves as a quiet Siri-like persistent composer with contextual
    answer bubbles, listening/thinking/recovery states, and confirmation before mutations.
- id: typography-hierarchy
  outcome: All redesigned surfaces use a small typography hierarchy that makes context,
    title, primary action, and supporting detail immediately distinguishable.
- id: business-product-page
  outcome: Public Business pages read as calm Apple-like product/service pages with
    a clear hero, next availability, price/quote, trust, gallery, and one Book action.
- id: guided-forms
  outcome: Booking, Business setup, Things, and other high-friction forms become one-decision-at-a-time
    flows with review before commit.
- id: microinteractions
  outcome: Selection, drawers, transitions, loading, optimistic reversible actions,
    reduced motion, focus, and touch targets feel native and predictable.
- id: design-system-control
  outcome: Shared tokens/primitives and automated audits prevent CSS, layout, route,
    and component drift and keep future global changes inexpensive.
work_scope_invariant:
  bug: Find work and My work can display the wrong quest collection until My applications
    is opened, indicating shared mutable scope or stale query state.
  required_behavior:
  - Find work always reads the backend discovery/available scope.
  - My work always reads the authenticated owner/creator scope.
  - My applications always reads the authenticated applicant scope.
  - Switching between the three scopes never changes another scope's dataset or requires
    visiting a fourth tab first.
  - Route entry, browser refresh, back/forward navigation, and direct deep links produce
    the same scope as tab navigation.
  - Empty, loading, error, and stale states retain the active scope label and never
    display a different scope's rows.
calendar_contract:
  required_views:
  - day
  - week
  - month
  behavior:
  - Day shows a readable chronological timeline with event duration, source, business,
    and preview action.
  - Week shows a seven-day time grid with all-day and timed events without losing
    source identity.
  - Month shows a compact month grid with event density and a selected-day preview/agenda.
  - Previous/next arrows and Today change the visible range without changing source
    filters.
  - Source filters include Work, Rides, Things, Business, Chat, Circles, and personal
    commitments where data exists; Business can be narrowed to one owned business.
  - Desktop may use a grid; mobile defaults to agenda/day and exposes week/month through
    a compact segmented control or sheet.
  - Per-business calendars remain isolated within Business workspaces while global
    Calendar aggregates authorized events.
  - Backend DTOs own event identity, range, source, permissions, and business metadata;
    clients do not reconstruct domain events.
