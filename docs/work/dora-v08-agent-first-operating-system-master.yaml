objective: Physically extract reusable analysis engines from MuffinMan, give Dora
  a machine-readable product and agent knowledge model, add generic architecture and
  voice-capability blueprints, and prove that Codex can bootstrap and validate a new
  application from an explicit idea without importing MuffinMan product meaning.
