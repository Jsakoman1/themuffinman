execution_inventory: docs/work/dora-v14-agent-authoring-execution-inventory.yaml
atomic_task_hardening_plan: docs/work/dora-v14-atomic-hardening.yaml
strict_verification: true
serial_task_execution: true
atomic_task_contract:
  required_fields:
  - observable_outcome
  - dependencies
  - required_paths
  - evidence_boundary
  - validation
  execution_rule: Start exactly one inventory item only after its predecessor is verifier-marked
    verified.
  validation_rule: Leaf validation commands must not invoke a work-plan verifier.
