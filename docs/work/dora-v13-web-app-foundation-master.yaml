kind: master
version: 1
id: dora-v13-web-app-foundation-master
title: Make Dora a controlled foundation for a new Spring Boot, Vue, and PostgreSQL
  web application
status: verified
implementation_ready: true
baseline: 90f1e3f513e3a0a8941b2a5720d8bd8395f54962
target_release: v1.3.0
objective: Let Codex take a user-confirmed product idea to a first proposed vertical
  web-application capability with minimal setup, while keeping product decisions,
  source application, production operations, and approval authority outside Dora.
analysis_source: docs/work/dora-web-app-readiness-temporary-analysis.md
plan_analysis_source: docs/work/dora-v13-web-app-foundation-analysis.md
preflight_source: docs/work/dora-v13-web-app-foundation-preflight.md
goal_readiness_source: docs/work/dora-v13-web-app-foundation-goal-readiness.md
decision_default: narrow_web_app_foundation
decision_boundary: This plan deliberately excludes production deployment, offline
  synchronization, product-specific UI, automatic destructive database operations,
  and automatic business-rule invention.
principles:
- Codex conducts a human-readable interview and Dora records only confirmed user intent.
- Dora technical starters are neutral and never include a product entity, role, API
  resource, seed data, or business screen.
- A generated vertical-slice proposal is a reviewable starting artifact, not silently
  applied application code.
- Database migrations are append-only and use Flyway; reset or deletion is never an
  implicit starter command.
- Authentication, retention, backup, and external integration remain explicit product
  decisions.
- Every implementation item must have exact paths, a leaf validation command, evidence
  boundaries, and an independent-consumer proof where reusable behavior changes.
- Remote publication, deployment, secret changes, database destruction, and consumer
  pins require explicit approval.
success_criteria:
- A beginner can describe an idea to Codex and receive a cited Dora interview without
  manually composing project-control YAML.
- Dora can create a new project using one reviewed source and one neutral Spring/Vue/PostgreSQL
  starter.
- The selected starter has local setup, test, build, health, and database configuration
  commands that pass in an independent consumer.
- A confirmed capability package can produce a reviewable vertical-slice proposal
  covering migration, backend, API, frontend, tests, runtime evidence, documentation,
  and atomic work.
- The proposal fails closed when a required domain, permission, workflow, data-safety,
  or technical decision is absent.
- Dora documentation makes the interview-based `create-app` route the primary beginner
  and Codex path.
- Dora remains independent of MuffinMan and contains no DoomsDayStorage product terminology
  or behavior.
non_goals:
- Build or deploy DoomsDayStorage itself.
- Generate final production code without a reviewed atomic implementation task.
- Choose authentication, offline synchronization, retention, backup policy, or hosting
  without user confirmation.
- Promise security certification, backup correctness, or production readiness from
  starter generation.
