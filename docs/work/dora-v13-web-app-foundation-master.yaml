sequencing:
- Interview and guidance contract before project creation UX changes.
- Postgres starter before vertical-slice proposal paths and commands are finalized.
- Vertical-slice proposal and readiness checks before consumer proof.
- Independent consumer proof and documentation closeout before any release decision.
required_before_goal_pursuit:
- Convert every scope item into one atomic implementation task with bounded paths
  and a leaf validation command.
- Create one globally serial execution inventory and direct predecessor dependencies.
- Define exact ownership of generated proposal artifacts versus user-owned application
  code.
- Define starter support assumptions for Java, Node, Docker, PostgreSQL, Flyway, and
  local ports.
- Define an independent-consumer proof that does not rely on MuffinMan data or services.
- Decide whether authentication/data-safety profiles stay deferred or enter a separate
  following plan.
release_boundary:
- No v1.3.0 tag, remote publication, or MuffinMan pin is authorized by this draft.
- A later release task must require an explicit user approval record and a reachable
  immutable Dora tag.
completion_boundary: This master plan defines proposed reusable delivery work only.
  It does not authorize implementation, create an application, or prove that a generated
  application is secure or production-ready.
