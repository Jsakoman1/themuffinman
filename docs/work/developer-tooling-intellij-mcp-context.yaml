  title: Return only bounded matches from repository-map queries
  type: implementation
  status: done
  inventory_item: compact-repository-map-query
  observable_outcome: A symbol query returns a compact result envelope containing
    summary counts and exact frontend/backend/capability matches without serializing
    the global AST or import graph.
  dependencies:
  - harden-developer-tooling-intellij-mcp-inventory
  evidence_boundary:
  - deterministic compact-query assertions
  - maximum-output fixture assertion
  paths: &1
  - scripts/repository-map.rb
  - scripts/tool-self-test.rb
