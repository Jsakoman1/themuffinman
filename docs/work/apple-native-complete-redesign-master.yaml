scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/apple-product-polish-master.yaml
  baseline_only_surfaces:
  - Existing Apple reference contract, backend/API domain rules, VisionForWeb contracts,
    and prior runtime evidence.
  - Existing route ownership and functional module behavior unless a redesign task
    explicitly changes the interaction contract.
  residual_scope:
  - Replace the visually and behaviorally incomplete dashboard-like implementation
    with one coherent Apple-native desktop-app language across all user-facing surfaces.
  - Migrate every major screen to shared tokens, primitives, progressive disclosure,
    preview/split-view navigation, step-based flows, and context-preserving recovery.
  - Prove rendered light/dark desktop and mobile behavior; static markers, builds,
    and old evidence are baseline only.
  retest_triggers:
  - Any shared token, shell, primitive, route ownership, responsive breakpoint, Vision
    anchoring, calendar aggregation, or backend/API read-model change.
  - Any page-local CSS removal or replacement, component consolidation, or change
    to preview/detail behavior.
  non_duplication_rule: Prior verified Apple-polish plans and evidence establish intended
    contracts only; this master counts new rendered visual and behavioral evidence
    for the complete redesign.
