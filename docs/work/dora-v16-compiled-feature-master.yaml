execution_inventory: docs/work/dora-v16-compiled-feature-execution-inventory.yaml
atomic_task_hardening_plan: docs/work/dora-v16-atomic-hardening.yaml
atomic_task_hardening_review: Each planned item maps to one exact child task and one
  serial inventory position.
strict_verification: true
serial_task_execution: true
atomic_task_contract:
  required_fields:
  - observable_outcome
  - dependencies
  - required_paths
  - evidence_boundary
  - validation
  execution_rule: Start exactly one inventory item only after its direct predecessor
    is verifier-marked verified.
  generation_rule: Generation requires confirmed technical input, deterministic preview,
    empty declared paths, a manifest, and no overwrite or regeneration of manual edits.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-v15-application-authoring-master.yaml
  baseline_only_surfaces:
  - v1.5 guided interview, session-create-app, neutral starter, placeholders, safety
    declarations, and runtime profile behavior remain baseline-only.
  - Existing MuffinMan product code, data, runtime evidence, and release pin are outside
    the v1.6 generator scope.
  residual_scope:
  - v1.5 cannot render a compilable Spring JDBC, Flyway, API, Vue, and test feature.
  - v1.5 has no deterministic generated-output manifest or source-level consumer proof.
  retest_triggers:
  - Changes to the v1.5 Spring/Vue/PostgreSQL starter, feature-skeleton contract,
    shared command envelope, generation templates, or compiler-facing commands.
  non_duplication_rule: Prior v1.5 evidence remains baseline context and is not counted
    as v1.6 source, compile, database, browser, or acceptance evidence.
required_release_evidence:
- All child plans are verifier-verified through one strict serial inventory.
- A fresh generated consumer passes static and compile checks without a real database
  or browser.
- Collision, traversal, missing-declaration, historic-migration, and manual-edit rejection
  paths have direct tests.
- The generated manifest traces every artifact to confirmed input and records only
  unresolved runtime and acceptance obligations.
- The Dora package boundary, documentation, release handoff, immutable tag, and MuffinMan
  pin are verified in separate approved release steps.
preflight_source: docs/work/dora-v16-compiled-feature-preflight.md
