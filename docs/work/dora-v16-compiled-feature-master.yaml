kind: master
version: 1
id: dora-v16-compiled-feature-master
title: Generate a controlled, compilable first vertical feature from confirmed intent
status: verified
implementation_ready: true
baseline: c7dcfaa
target_release: v1.6.0
objective: Extend Dora v1.5 from reviewable feature placeholders to a deterministic,
  stack-specific Spring Boot, Vue, PostgreSQL, and Flyway feature generator that a
  Codex agent can inspect, build, test, and document without Dora inventing product
  meaning or changing external systems.
analysis_source: docs/work/dora-v16-compiled-feature-analysis.md
target_stack: spring-vue-postgres-buildable
target_persistence: Spring JDBC repository; the v1.5 technical starter already owns
  JDBC and does not declare an ORM or JPA policy.
principles:
- Generate only from explicit, user-confirmed business and technical declarations.
- Preview must be deterministic and read-only; apply must be explicit, bounded, collision-safe,
  and reversible through normal Git history.
- Every generated file must have a traceable source declaration and a clear review
  marker or generated-output manifest.
- Compile and static contract evidence are distinct from database, browser, security,
  accessibility, business acceptance, release, and production evidence.
- A missing type, constraint, permission, transition, API shape, or UI behavior is
  a blocking gap, never a reason to infer a default.
- The feature generator is stack-specific in v1.6; generic multi-stack generation
  is deferred until one stack has independent-consumer proof.
workstreams:
- id: compiled-feature-contract
  priority: 1
  outcome: A confirmed feature has explicit field-to-database mappings, API shapes,
    workflow transitions, permission checks, and selected technical locations; all
    unresolved technical decisions block generation.
- id: deterministic-generation-manifest
  priority: 1
  outcome: Dora previews the exact files, templates, source references, hashes, generation
    version, and post-generation obligations before any write.
- id: flyway-and-spring-generator
  priority: 1
  outcome: Dora generates an append-only Flyway migration and compilable Java model,
    JDBC repository, DTO, service, controller, validation, and unit-test surface from
    explicit mappings only.
- id: api-and-vue-generator
  priority: 1
  outcome: Dora generates an explicit API contract plus compilable Vue API client,
    feature surface, and frontend test scaffolding aligned to the same declaration.
- id: generated-safety-and-trace
  priority: 1
  outcome: Dora rejects collisions and historic migration changes, inspects its generated
    manifest against actual paths, and reports DTO/API/workflow/ permission trace
    gaps.
- id: executable-evidence-boundaries
  priority: 2
  outcome: Generated projects receive build, static contract, test, runtime, and acceptance
    obligations with separate opt-in Docker/database and Playwright approval gates.
- id: independent-consumer-proof
  priority: 2
  outcome: A fresh temporary consumer proves preview, apply, generated source layout,
    compilation, and collision rejection without product data or external deployment.
- id: codex-first-documentation
  priority: 3
  outcome: Dora documents one clear Codex route from confirmed interview through compiled
    feature review, implementation work, evidence, and explicit release decisions.
non_goals:
- Generate a complete DoomsDayStorage product or infer any of its rules.
- Generate credentials, JWT/OIDC policy, users, real data, backups, secrets, deployments,
  cloud resources, or production configuration.
- Modify existing source, historical Flyway migrations, or manually edited generated
  files during apply or regeneration.
- Run Docker, PostgreSQL, package installation, browser tests, or deployment without
  a separate explicit approval at execution time.
- Treat compile success as business acceptance, security validation, accessibility
  validation, or release readiness.
required_before_goal_pursuit:
- Compare the v1.5 starter's actual package names, build commands, dependencies, Flyway
  locations, Vue tooling, and test framework with the proposed templates.
- Convert every workstream into strict serial atomic tasks with exact required paths,
  direct predecessors, leaf validations, and evidence boundaries.
- Create a complete schema and fixtures for confirmed technical mappings before any
  generator implementation starts.
- Define the generated-file manifest, collision policy, preview/apply contract, and
  explicit no-regeneration-over-manual-edits policy before source output exists.
- Split static/compile proof from opt-in database and browser proof; request those
  approvals only when an actual task reaches them.
- Define independent-consumer proof using temporary directories and no product data.
- Verifier-verify an atomic-task hardening plan before implementation starts.
