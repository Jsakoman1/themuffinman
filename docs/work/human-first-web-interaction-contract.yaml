kind: work
version: 1
id: human-first-web-interaction-contract
title: Replace generic preview behavior with predictable object opening
status: verified
baseline: a18b811e65001f68d174b42d1574f6c0f2ffc18d
strict_verification: true
serial_task_execution: true
master_plan: docs/work/human-first-web-experience-master.yaml
execution_inventory: docs/work/human-first-web-experience-execution-inventory.yaml
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/main-surfaces-interaction-action-system.yaml
  baseline_only_surfaces:
  - existing detail routes
  - backend allowed actions
  - dialog confirmation
  residual_scope:
  - one row activation contract
  - direct-open discovery
  - removal of duplicate previews
  - specialized operational review
  retest_triggers:
  - SurfaceRow
  - route-return
  - discovery
  - booking-review
  - or application-review changes
  non_duplication_rule: Existing detail screens are baseline; only activation and
    review interaction changes are new completion.
readiness:
  default_activation: Navigate directly to the canonical detail and preserve return
    state.
  exceptions:
  - Repeated owner decisions use ReviewPane.
  - Calendar events use a contextual popover.
  - Chat uses an inbox-thread split.
  decision: ObjectPreviewPanel is retired from generic discovery and retained only
    until specialized consumers migrate.
