principles:
  - Dora generates control structure and validates mechanics; consumer projects own product meaning.
  - Every generated file is adapter-declared, deterministic, and tested in a standalone fixture.
  - Every destructive cleanup operation requires explicit project policy and a dry-run path.
  - Technology packs are optional and never become Dora core assumptions.
