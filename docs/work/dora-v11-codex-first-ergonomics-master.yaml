  agent_boundary: Commands use declared project knowledge and explicit records only;
    they never infer product meaning or completion.
  evidence_boundary: Cache, trace, coordination, and session output remain advisory
    until project verification records evidence.
  lifecycle_boundary: Apply, publication, and pinning are local or external mutations
    only behind scoped approval records and explicit user approval.
  review_state: Active hardening task will record leaf-audit evidence before v1.1
    implementation begins.
required_before_goal_pursuit:
- Record an architecture decision for self-contained `dora new` versus explicit source
  descriptor input.
- Define public JSON/YAML envelope, error, remediation, citation, and side-effect
  contracts before command changes.
- Define cache implementation identity and backward-compatibility invalidation behavior
  before touching PluginRunner.
- Define memory refresh as proposal or explicit apply; it must not overwrite product-owned
  knowledge silently.
- Define approval artifact ownership, expiration, scope, and audit behavior before
  an apply command exists.
- Define plugin trust classes and platform-safe timeout behavior before process-policy
  implementation.
- Obtain two non-MuffinMan consumer fixtures before capability trace, coordination,
  or Codex integration can be promoted from experimental.
- Create a hardened atomic-task plan, one global serial execution inventory, exact
  paths, leaf validations, and evidence boundaries.
success_criteria:
- A beginner or Codex can create a self-contained neutral project through one supported
  explicit route and run its local launcher.
- Codex can obtain one cited session payload that identifies safe next work, constraints,
  tools, evidence, and approval state without repository inference.
- Public commands offer stable machine-readable success and error envelopes without
  changing existing YAML consumers unexpectedly.
- Memory drift, plugin-entrypoint changes, and Dora implementation changes invalidate
  stale guidance or cache output deterministically.
- A source-pinned upgrade can be previewed and, only with an explicit approval record,
  applied with backup and rollback evidence.
- Plugin execution exposes declared trust and resource policy; unsupported guarantees
  remain explicit.
- Two independent consumer projects prove selected traceability, coordination, and
  Codex integration features without MuffinMan data.
- v1.1 is published and pinned only after all new contracts, consumer proofs, compatibility
  audits, and explicit approval pass.
release_boundary:
- No `upgrade-apply`, source publication, tag, remote write, or consumer pin occurs
  without explicit user approval.
- v1.1 release may include only workstreams with verified independent consumer proof;
  experimental extensions remain unpinned.
