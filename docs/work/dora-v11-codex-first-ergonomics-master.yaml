principles:
- Dora consumes declared inputs and proposes deterministic guidance; it never invents
  product behavior.
- Every Codex-facing response has a documented machine-readable contract, citations,
  omission boundary, and side-effect class.
- A newly created project is usable through its documented local launcher without
  an undeclared parent package.
- Cache output is valid only for the exact source roots, plugin entrypoint, declared
  inputs, and Dora implementation identity.
- Memory and decision records expose drift and unresolved state; they never silently
  resolve product meaning.
- External, destructive, and upgrade-apply operations require explicit project-owned
  approval records and rollback data.
- Optional coordination and Codex integration never overwrite user-owned configuration
  and require independent consumer proof.
