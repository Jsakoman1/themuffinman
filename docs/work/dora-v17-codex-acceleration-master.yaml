kind: master
version: 1
id: dora-v17-codex-acceleration-master
title: Make Dora a faster, more precise Codex-first application delivery system
status: verified
implementation_ready: true
baseline: 0a5ca21
target_release: v1.7.0
analysis_source: docs/work/dora-v17-codex-acceleration-analysis.md
preflight_source: docs/work/dora-v17-codex-acceleration-preflight.md
goal_readiness_source: docs/work/dora-v17-codex-acceleration-goal-readiness.md
objective: Reduce the manual context assembly and repeated planning work a Codex agent
  needs when taking a confirmed product idea or capability through implementation,
  validation, and documentation, while preserving Dora's explicit product-decision,
  safety, and evidence boundaries.
principles:
- Dora asks for or records only material missing decisions; it never silently invents
  business rules, permissions, workflows, copy, or architecture.
- Codex receives a compact machine-readable task context with cited source decisions,
  allowed paths, required proof, and the one recommended next action.
- A generated feature must fit a declared project convention profile and must remain
  additive, previewable, collision-safe, and reversible through normal Git history.
- Domain dependency, API, migration, workflow, permission, and evidence gaps fail
  closed before source generation or implementation work begins.
- Static, compile, database, browser, accessibility, security, business acceptance,
  and production evidence remain separate evidence classes.
- Product projects remain the authority for source code, real data, credentials, runtime
  execution, release approval, and external mutations.
workstreams:
- id: guided-agent-entrypoint
  priority: 1
  outcome: A Codex agent can begin with one guided Dora entrypoint that resumes a
    confirmed interview, identifies the smallest unanswered question, and creates
    a reviewed project/capability handoff without the user hand-authoring YAML.
- id: codex-context-packet
  priority: 1
  outcome: Dora produces one bounded implementation packet for one selected task,
    containing confirmed product/domain/permission/workflow decisions, conventions,
    exact paths, dependencies, tests, evidence obligations, and explicit omissions.
- id: domain-capability-compiler
  priority: 1
  outcome: Confirmed domain knowledge compiles to a deterministic capability dependency
    graph that identifies blockers, decision gaps, ordering, and the next safe capability
    without treating proposed work as completed work.
- id: project-conventions-and-evolution
  priority: 1
  outcome: A project can declare its Spring, Vue, database, test, documentation, and
    generated-code conventions so an additive feature preview can detect incompatible
    paths, naming, package, migration, API, and ownership choices before apply.
- id: resource-feature-composition
  priority: 2
  outcome: The compiled-feature route can safely describe a related resource feature
    with explicit references, list/detail/form states, query requirements, validation,
    workflow, and permission checks, then produce a reviewable multi-layer feature
    packet without overwriting existing code.
- id: proof-orchestration
  priority: 2
  outcome: Each confirmed capability receives a deterministic proof matrix that maps
    assertions to unit, API, migration, browser/runtime, accessibility, and acceptance
    obligations; optional runtime adapters remain approval-gated and product-owned.
- id: independent-consumer-and-codex-guide
  priority: 3
  outcome: A fresh technical consumer proves the new command, context, compiler, convention,
    composition, and proof contracts; the public guide gives Codex and a beginner
    one concise route from idea to the first verified implementation task.
milestones:
- id: v1.7-core
  includes:
  - guided-agent-entrypoint
  - codex-context-packet
  - domain-capability-compiler
  - project-conventions-and-evolution
  - independent-consumer-and-codex-guide
  benefit: Codex needs less manual context assembly and can stop at an explicit gap
    instead of guessing the next task.
- id: v1.7-feature-flow
  includes:
  - resource-feature-composition
  - proof-orchestration
  benefit: A confirmed inventory-style feature can be prepared as one traced, reviewable
    multi-layer change with explicit proof requirements.
next-programs:
- id: DORA-V18-SECURITY-OPERATIONS-001
  scope: Opt-in implementation adapters for authentication, authorization tests, data
    safety execution, and production-readiness checks after a separate threat, credential,
    and real-data safety review.
- id: DORA-V19-PLATFORM-UX-001
  scope: Reusable UI blueprints, offline/sync architecture decision support, and opt-in
    deployment adapters after v1.7 proves project convention and feature composition
    contracts.
non_goals:
- Build a named consumer application from an unconfirmed free-text request.
- Generate users, passwords, tokens, OIDC/JWT policy, secrets, real data, backups,
  cloud infrastructure, deployment, or a production release.
- Rewrite, delete, or silently regenerate an existing product file or a historic Flyway
  migration.
- Claim that static checks, compilation, a generated proof matrix, or a browser template
  prove business acceptance, security, accessibility, or release readiness.
required_before_goal_pursuit:
- Compare all proposed commands with v1.5/v1.6 public command ownership; extend an
  existing command only when its safety boundary remains clear.
- Define schemas, fixtures, deterministic output rules, collision policy, and explicit
  missing-decision failures before writing a generator or compiler.
- Split each workstream into atomic child tasks with exact bounded paths, direct dependencies,
  leaf validation, and an evidence boundary.
- Prepare one strict serial execution inventory and verifier-verify its atomic-task
  hardening task before implementation starts.
- Define independent-consumer proof with no product data, credentials, Docker, database,
  browser, or network requirement by default.
- Identify any package installation, database startup, browser execution, external
  service, or deployment action as a separately approved task rather than a plan default.
