execution_inventory: docs/work/dora-v17-codex-acceleration-execution-inventory.yaml
atomic_task_hardening_plan: docs/work/dora-v17-atomic-hardening.yaml
atomic_task_hardening_review: All sixteen inventory mappings were audited for one
  observable outcome, required paths, direct serial dependency, leaf validation, and
  an explicit evidence boundary before goal pursuit.
strict_verification: true
serial_task_execution: true
atomic_task_contract:
  required_fields:
  - observable_outcome
  - dependencies
  - required_paths
  - evidence_boundary
  - validation
  execution_rule: Start one inventory item only after its direct predecessor is verifier-marked
    verified.
  generation_rule: Generator work requires a confirmed declaration, deterministic
    preview, declared empty paths, non-overwrite protection, and a generated-output
    manifest.
scope_control:
  standard: docs/plan-scope-control-standard.yaml
  reused_verified_plans:
  - docs/work/dora-v15-application-authoring-master.yaml
  - docs/work/dora-v16-compiled-feature-master.yaml
  baseline_only_surfaces:
  - Dora v1.5 confirmed interview, session-create-app, neutral profiles, and first
    feature skeleton behavior remain baseline-only.
  - Dora v1.6 starter, one-feature rendering, manifest, safe apply, static/compile
    consumer proof, and release pin remain baseline-only.
  - MuffinMan product source, product documentation, runtime evidence, and business
    rules are outside the Dora v1.7 scope.
  residual_scope:
  - v1.6 has no single guided agent entrypoint or compact task context packet.
  - v1.6 does not compile confirmed domain knowledge into a capability dependency
    graph and next-safe-capability recommendation.
  - v1.6 does not declare project conventions for safe additive feature evolution
    or compose a related resource feature with a complete proof matrix.
  retest_triggers:
  - Changes to v1.5/v1.6 interview, create-app, agent context, feature manifest, starter
    layout, shared CLI envelope, generated output, or evidence contracts.
  non_duplication_rule: v1.5 and v1.6 evidence is baseline context only. New v1.7
    completion must be proved by its own bounded tests and independent consumer.
completion_boundary: This draft is a scoped roadmap only. It does not authorize goal
  pursuit, implementation, package installation, database/browser execution, release,
  deployment, or a claim that Dora has created a complete product.
