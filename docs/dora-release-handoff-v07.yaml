kind: dora_release_handoff
version: 1
status: published
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v0.7.1
  immutable_commit: 6842ba490ab9b2ff991badb42f2252b2951a0486
  source_parent_commit: 92bc93b5ef1230e663d353780e73ce01343af1e0
consumption:
  project: muffinman
  method: git_subtree
  subtree_prefix: dora
  status: pinned
  pinned_ref: v0.7.1
  pinned_commit: 6842ba490ab9b2ff991badb42f2252b2951a0486
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan is pinned to immutable Dora v0.7.1 tag commit 6842ba490ab9b2ff991badb42f2252b2951a0486; later upgrades require a new reviewed handoff and reversible pin update.
approval:
  approved_by: user
  approved_at: 2026-08-05
  scope: Publish corrective Dora v0.7.1, then pin MuffinMan to its reviewed immutable commit and push both repositories.
supersedes:
  release: v0.7.0
  reason: The immutable v0.7.0 tag exposed three Dora-only regression tests that were corrected before any MuffinMan pin was pushed.
preservation:
  - MuffinMan retains product code, product documentation, work plans, runtime evidence, and its adapter.
  - Dora v0.7.1 exports only dora package paths and never rewrites MuffinMan product history.
  - The release tag must resolve before the MuffinMan adapter pin changes.
rollback:
  - Before the adapter pin, MuffinMan remains on its v0.6.0 pin.
  - After the adapter pin, revert only the dedicated v0.7.1 pin commit to restore v0.6.0.
verification:
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --check-handoff-draft --handoff docs/dora-release-handoff-v07.yaml --expected-version v0.7.1
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v07.yaml --expected-version v0.7.1
