kind: dora_release_handoff
version: 1
status: published
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v1.9.0
  immutable_commit: a7631603c11ad74fe873df713a04281cebda1ca8
  source_parent_commit: d57141dcf0fbb8a8ddfd1bd1edaea125fe4460e5
consumption:
  project: muffinman
  method: git_subtree
  status: pinned
  pinned_ref: v1.9.0
  pinned_commit: a7631603c11ad74fe873df713a04281cebda1ca8
  subtree_prefix: dora
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan may pin only the reachable immutable Dora v1.9.0 tag commit after this reviewed release handoff is published.
approval:
  approved_by: user
  approved_at: 2026-08-10
  scope: Publish Dora v1.9.0, create its immutable tag, and then pin MuffinMan to the reviewed release commit.
preservation:
  - MuffinMan retains product code, product documentation, work plans, runtime evidence, adapters, and product authority.
  - Dora v1.9.0 exports only Dora-owned package paths and retains no MuffinMan business rules, credentials, real data, runtime evidence, or product mutation adapters.
  - The release adds verifier-bounded implementation delivery controls and an owner-mediated Discovery to Owner Framing to Delivery Handoff route; it does not add autonomous product decisions, remote execution, write, source, shell, filesystem, GitHub, consumer-project, or direct Codex authority.
  - The release tag resolves before the MuffinMan adapter pin changes.
rollback:
  - Before the adapter pin, MuffinMan remains on its v1.8.0 pin.
  - After the adapter pin, revert only the dedicated v1.9.0 pin commit to restore v1.8.0.
verification:
  - Dora Ruby test suite (261 test files)
  - ruby scripts/audits/audit-dora-muffinman-compatibility.rb
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v19.yaml --expected-version v1.9.0
