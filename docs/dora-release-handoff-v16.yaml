kind: dora_release_handoff
version: 1
status: published
release:
  repository: https://github.com/Jsakoman1/dora.git
  visibility: private
  default_branch: main
  version: v1.6.0
  immutable_commit: 6bd4e6525ffea33db8daae6efb95cfcf49f0f0a1
  source_parent_commit: 1efbd49aeaeec1782e2dafcd7848ec5e0b5cc827
consumption:
  project: muffinman
  method: git_subtree
  status: pinned
  pinned_ref: v1.6.0
  pinned_commit: 6bd4e6525ffea33db8daae6efb95cfcf49f0f0a1
  subtree_prefix: dora
  local_adapter: .dora/project.yaml
  update_rule: MuffinMan may pin only the reachable immutable Dora v1.6.0 tag commit after this reviewed release handoff is published.
approval:
  approved_by: user
  approved_at: 2026-08-06
  scope: Publish Dora v1.6.0, create its immutable tag, and then pin MuffinMan to the reviewed release commit.
preservation:
  - MuffinMan retains product code, product documentation, work plans, runtime evidence, adapters, and product authority.
  - Dora v1.6.0 exports only Dora-owned package paths and retains no MuffinMan business rules, credentials, real data, runtime evidence, or product mutation adapters.
  - The compiled-feature generator remains a controlled implementation scaffold: it declares contracts and evidence obligations but does not claim product-runtime verification.
  - The release tag resolves before the MuffinMan adapter pin changes.
rollback:
  - Before the adapter pin, MuffinMan remains on its v1.5.0 pin.
  - After the adapter pin, revert only the dedicated v1.6.0 pin commit to restore v1.5.0.
verification:
  - ruby scripts/audits/audit-dora-extraction-manifest.rb --require-approved-release --handoff docs/dora-release-handoff-v16.yaml --expected-version v1.6.0
