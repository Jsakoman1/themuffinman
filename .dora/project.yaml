kind: dora_project_adapter
version: 1
project:
  id: muffinman
  root: ..
paths:
  docs: docs
  work_plans: docs/work
  audit_output: docs/audit-output
  runtime_evidence: docs/runtime-evidence
commands:
  work_start: bin/dora work-start .dora/project.yaml plan=<work-plan> task=<task-id>
  work_verify: bin/dora work-verify .dora/project.yaml plan=<work-plan> task=<task-id>
  control_check: bin/dora doctor .dora/project.yaml
  work_plan_preflight: bin/dora validate-work-plan .dora/project.yaml <work-plan>
context:
  generated_output_paths: [audit_output, runtime_evidence]
distribution:
  method: release_pinned_package
  source_repository: https://github.com/Jsakoman1/dora.git
  source_ref: 922dbf5e0f9d32d52e546ccdd6145c592b1ab01a
  source_commit: 922dbf5e0f9d32d52e546ccdd6145c592b1ab01a
  source_checksum: a99b17942eca6a3dc74b5e0e83840c2c26aa0e076e44c8f62083ab57d0a2d3cd
  package_path: dora
  update_command: Use an owner-approved reviewed local source descriptor with Dora upgrade-preview and upgrade-apply; do not use git subtree.
  rollback_rule: Restore the recorded Dora upgrade backup before commit or revert the isolated Dora pin commit; do not reconstruct product evidence from Dora.
extensions:
  - id: muffinman-reusable-plugin-manifest
    category: product_contract
    paths: [.dora/plugins.yaml, scripts/audits]
    invocation: bin/dora plugin-run .dora/plugins.yaml <plugin-id>
  - id: muffinman-domain-audits
    category: audit
    paths: [scripts/audits, docs/capability-inventory.yaml, docs/runtime-acceptance-matrix.yaml]
    invocation: make audit-backend && make audit-frontend
  - id: muffinman-product-documentation
    category: documentation
    paths: [docs/business-logic.md, docs/domain-technical.md, docs/system-map.md]
    invocation: make audit-docs
  - id: muffinman-browser-runtime
    category: runtime
    paths: [apps/themuffinman/frontend/scripts, docs/runtime-evidence]
    invocation: make dev
  - id: muffinman-build-contracts
    category: product_contract
    paths: [apps/themuffinman/pom.xml, apps/themuffinman/frontend/package.json]
    invocation: make backend-test && make frontend-type-check
  - id: muffinman-java-spring-source-map
    category: product_contract
    paths: [apps/themuffinman/src/main/java, apps/themuffinman/src/test/java]
    invocation: Dora JavaSpring source-map plugin with MuffinMan-declared source roots
  - id: muffinman-typescript-vue-source-map
    category: product_contract
    paths: [apps/themuffinman/frontend/src]
    invocation: Dora TypeScriptVue source-map plugin with MuffinMan-declared source roots
  - id: muffinman-runtime-harness
    category: runtime
    paths: [apps/themuffinman/frontend/scripts/runtime-harness.mjs, docs/runtime-evidence]
    invocation: Project-owned browser command writes declared runtime evidence; Dora records only the trace contract.
